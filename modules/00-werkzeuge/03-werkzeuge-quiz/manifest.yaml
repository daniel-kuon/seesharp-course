id: werkzeuge-quiz
title: { de: "Werkzeuge-Quiz" }
reading:
  section: "3.1"
  title: { de: ".NET SDK" }
  printedPage: 61
teaches:
  - tools.sdk-version
  - tools.new-console-project
  - tools.solution-anatomy
  - basics.top-level-statements
requires:
  - tools.build-run
items:
  - type: multipleChoice
    id: sdk-auswahl
    prompt: { de: "Auf dem Rechner sind mehrere .NET-SDKs installiert. Welches SDK verwendet `dotnet build`?" }
    options:
      - { de: "Immer das älteste, damit alte Projekte weiter funktionieren." }
      - { de: "Das neueste, es sei denn, eine global.json im Projektordner oder darüber legt eine Version fest." }
      - { de: "Das SDK, das beim letzten Rider-Start ausgewählt wurde." }
      - { de: "Es fragt bei jedem Aufruf nach." }
    correct: [1]
    explanation: { de: "Ohne global.json gewinnt das neueste installierte SDK. SeeSharp liefert eine global.json mit, damit alle Übungen mit derselben Version gebaut werden." }
  - type: multipleChoice
    id: sdk-liste
    prompt: { de: "Mit welchem Befehl siehst du, welche SDK-Versionen installiert sind?" }
    options:
      - { de: "dotnet --list-sdks" }
      - { de: "dotnet new sdk" }
      - { de: "dotnet run --version" }
      - { de: "csc --sdks" }
    correct: [0]
  - type: multipleChoice
    id: neues-projekt
    prompt: { de: "Welcher Befehl legt ein neues Konsolenprojekt namens Hallo an?" }
    options:
      - { de: "dotnet create Hallo" }
      - { de: "dotnet new console -n Hallo" }
      - { de: "dotnet build --new Hallo" }
      - { de: "dotnet new Hallo --console" }
    correct: [1]
  - type: multipleChoice
    id: projektdatei
    prompt: { de: "Welche Aussagen über den Aufbau eines Projekts treffen zu? (mehrere möglich)" }
    options:
      - { de: "Die .csproj-Datei legt unter anderem Zielframework und Ausgabetyp fest." }
      - { de: "Der Ordner obj enthält Zwischenergebnisse des Builds und kann gelöscht werden." }
      - { de: "Der Ordner bin enthält den Quellcode." }
      - { de: "Eine Solution (.sln/.slnx) fasst ein oder mehrere Projekte zusammen." }
    correct: [0, 1, 3]
    explanation: { de: "bin enthält das Ergebnis des Builds, nicht den Quellcode. Quellcode liegt direkt im Projektordner." }
  - type: multipleChoice
    id: ausliefern
    prompt: { de: "Welche Dateien aus bin/Release/net10.0 musst du mindestens an einen Kunden ausliefern, damit das Programm auf einem Rechner mit installierter .NET-Laufzeit startet?" }
    options:
      - { de: "Nur die .exe-Datei." }
      - { de: "Die .dll, die .exe und die .runtimeconfig.json." }
      - { de: "Alle Dateien einschließlich .pdb und obj-Ordner." }
      - { de: "Nur die .pdb-Datei, sie enthält das Programm." }
    correct: [1]
    explanation: { de: "Die .dll enthält den IL-Code, die .exe ist nur der Windows-Starthelfer, die .runtimeconfig.json nennt die benötigte Laufzeitversion. Die .pdb braucht nur der Debugger." }
  - type: multipleChoice
    id: top-level
    prompt: { de: "Was gilt für Anweisungen auf oberster Ebene (Top-Level-Statements)?" }
    options:
      - { de: "Der Compiler erzeugt daraus im Hintergrund eine Startklasse mit Main-Methode." }
      - { de: "Sie sind in jeder Datei eines Projekts erlaubt." }
      - { de: "Sie ersetzen die Projektdatei." }
      - { de: "Sie funktionieren nur in Klassenbibliotheken." }
    correct: [0]
    explanation: { de: "Nur eine Datei pro Projekt darf Top-Level-Statements enthalten; der Compiler erzeugt daraus die Main-Methode." }
  - type: open
    id: build-vs-run
    prompt: { de: "Was ist der Unterschied zwischen `dotnet build` und `dotnet run`? Wann nimmst du welches?" }
