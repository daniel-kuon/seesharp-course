id: konzepte-assemblies-und-il
title: { de: "Compiler, IL und Assemblies", en: "Compilers, IL, and Assemblies" }
reading:
  section: "2.4"
  title: { de: "Assemblies", en: "Assemblies" }
  printedPage: 30
teaches:
  - concepts.assembly
  - concepts.namespace-vs-assembly
  - concepts.il-and-jit
  - concepts.aot
requires:
  - concepts.class-vs-object
items:
  - type: multipleChoice
    id: aussagen
    prompt: { de: "Welche Aussagen treffen zu? (mehrere möglich)", en: "Which statements are true? (You may select more than one.)" }
    options:
      - { de: "Mit C# lässt sich nur Software für Windows entwickeln.", en: "C# can only be used to develop software for Windows." }
      - { de: "Die BCL ist überwiegend in C# geschrieben.", en: "The BCL is written primarily in C#." }
      - { de: "Klassen aus einem in C# erstellten Bibliotheks-Assembly lassen sich auch aus VB.NET verwenden.", en: "Classes from a library assembly created in C# can also be used from VB.NET." }
      - { de: "Eine WPF-Anwendung läuft dank .NET auch unter Linux und macOS.", en: "Thanks to .NET, a WPF application also runs on Linux and macOS." }
      - { de: "Für ein reines Windows-Programm ist das alte .NET Framework heute die passende Wahl.", en: "For a Windows-only program, the old .NET Framework is the right choice today." }
    correct: [1, 2]
    explanation: { de: ".NET ist plattformübergreifend, WPF aber nicht. Das .NET Framework wird nicht weiterentwickelt; neue Projekte nutzen .NET (hier Version 10).", en: ".NET is cross-platform, but WPF is not. Development of the .NET Framework has been discontinued; new projects use .NET (version 10 in this case)." }
  - type: multipleChoice
    id: assembly
    prompt: { de: "Was ist ein Assembly?", en: "What is an assembly?" }
    options:
      - { de: "Eine Datei (.dll oder .exe) mit IL-Code und Metadaten; die Einheit, die gebaut, versioniert und ausgeliefert wird.", en: "A file (.dll or .exe) containing IL code and metadata; the unit that is built, versioned, and deployed." }
      - { de: "Ein Ordner mit Quellcodedateien.", en: "A folder containing source code files." }
      - { de: "Der Maschinencode, den der C#-Compiler erzeugt.", en: "The machine code generated by the C# compiler." }
      - { de: "Ein anderes Wort für Namensraum.", en: "Another word for \"namespace.\"" }
    correct: [0]
  - type: multipleChoice
    id: namensraum
    prompt: { de: "In welcher Beziehung stehen Assemblies und Namensräume?", en: "What is the relationship between assemblies and namespaces?" }
    options:
      - { de: "Ein Namensraum ist ein logisches Namenspräfix für Typen; ein Assembly ist eine physische Datei. Ein Assembly kann viele Namensräume enthalten, ein Namensraum kann sich über mehrere Assemblies erstrecken.", en: "A namespace is a logical name prefix for types; an assembly is a physical file. An assembly can contain many namespaces, and a namespace can span multiple assemblies." }
      - { de: "Jedes Assembly enthält genau einen Namensraum gleichen Namens.", en: "Each assembly contains exactly one namespace with the same name." }
      - { de: "Namensräume sind die ausführbare Form von Assemblies.", en: "Namespaces are the executable form of assemblies." }
      - { de: "Die using-Direktive bindet ein Assembly ein.", en: "The \"using\" directive imports an assembly." }
    correct: [0]
    explanation: { de: "using importiert einen Namensraum. Assemblies werden über Projekt- oder Paketverweise eingebunden.", en: "The `using` statement imports a namespace. Assemblies are included via project or package references." }
  - type: multipleChoice
    id: il
    prompt: { de: "Was erzeugt der C#-Compiler aus dem Quellcode?", en: "What does the C# compiler generate from the source code?" }
    options:
      - { de: "IL-Code (Intermediate Language), der erst zur Laufzeit in Maschinencode übersetzt wird.", en: "IL (Intermediate Language), which is translated into machine code only at runtime." }
      - { de: "Direkt Maschinencode für die CPU des Entwicklungsrechners.", en: "Direct machine code for the CPU of the development computer." }
      - { de: "Eine Textdatei, die die CLR Zeile für Zeile interpretiert.", en: "A text file that the CLR interprets line by line." }
      - { de: "JavaScript.", en: "JavaScript." }
    correct: [0]
  - type: multipleChoice
    id: jit
    prompt: { de: "Was macht der JIT-Compiler?", en: "What does the JIT compiler do?" }
    options:
      - { de: "Er übersetzt IL-Code beim ersten Aufruf einer Methode zur Laufzeit in Maschinencode für die lokale CPU.", en: "It translates IL code into machine code for the local CPU the first time a method is called at runtime." }
      - { de: "Er prüft den Quellcode auf Tippfehler.", en: "He checks the source code for typos." }
      - { de: "Er übersetzt C# in VB.NET.", en: "It translates C# into VB.NET." }
      - { de: "Er komprimiert das Assembly beim Ausliefern.", en: "It compresses the assembly during deployment." }
    correct: [0]
  - type: multipleChoice
    id: aot
    prompt: { de: "Worin unterscheidet sich AOT-Übersetzung (Ahead-Of-Time) von JIT?", en: "How does AOT (Ahead-Of-Time) compilation differ from JIT?" }
    options:
      - { de: "AOT erzeugt den Maschinencode schon beim Veröffentlichen: schnellerer Start, aber an die Zielplattform gebunden und mit Einschränkungen.", en: "AOT generates the machine code at the time of publication: faster startup, but tied to the target platform and subject to limitations." }
      - { de: "AOT ist nur ein anderer Name für den JIT-Compiler.", en: "AOT is just another name for the JIT compiler." }
      - { de: "AOT übersetzt den Code erst beim Beenden des Programms.", en: "AOT compiles the code only when the program exits." }
      - { de: "AOT funktioniert nur mit VB.NET.", en: "AOT works only with VB.NET." }
    correct: [0]
  - type: open
    id: abkuerzungen
    prompt: { de: "Erkläre in je einem Satz, wofür IL, BCL und JIT stehen und was sie tun.", en: "Explain in one sentence each what IL, BCL, and JIT stand for and what they do." }
