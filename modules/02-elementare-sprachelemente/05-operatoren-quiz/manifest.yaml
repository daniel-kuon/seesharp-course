id: sprachelemente-operatoren-quiz
title: { de: "Operatoren-Quiz", en: "Operator Quiz" }
reading:
  section: "4.5"
  title: { de: "Operatoren und Ausdrücke", en: "Operators and Expressions" }
  printedPage: 215
teaches:
  - operators.arithmetic
  - operators.precedence
  - operators.increment-compound
  - operators.conditional
  - operators.logical
  - operators.de-morgan
requires:
  - types.int
  - types.double
  - operators.integer-division
items:
  - type: multipleChoice
    id: gemischt
    prompt: { de: "Welchen Wert und Typ hat der Ausdruck `7 / 2 * 2.0`?", en: "What is the value and type of the expression `7 / 2 * 2.0`?" }
    options:
      - { de: "6.0 (double)", en: "6.0 (double)" }
      - { de: "7.0 (double)", en: "7.0 (double)" }
      - { de: "6 (int)", en: "6 (int)" }
      - { de: "7 (int)", en: "7 (int)" }
    correct: [0]
    explanation: { de: "7 / 2 ist eine Ganzzahldivision mit Ergebnis 3; erst 3 * 2.0 rechnet mit double.", en: "7 / 2 is an integer division with a result of 3; only 3 * 2.0 is calculated as a double." }
  - type: multipleChoice
    id: cast-rangfolge
    prompt: { de: "Welchen Wert hat `(int) 7 / 2.0 * 3`, und welchen hat `(int) (7 / 2.0 * 3)`?", en: "What is the value of `(int) 7 / 2.0 * 3`, and what is the value of `(int) (7 / 2.0 * 3)`?" }
    options:
      - { de: "10.5 und 10", en: "10.5 and 10" }
      - { de: "9 und 9", en: "9 and 9" }
      - { de: "10.5 und 10.5", en: "10.5 and 10.5" }
      - { de: "9 und 10", en: "9 and 10" }
    correct: [0]
    explanation: { de: "Der Cast bindet nur an die 7; 7 / 2.0 * 3 = 10.5. Mit Klammern wird 10.5 nach int abgeschnitten.", en: "The cast only binds to 7; 7 / 2.0 * 3 = 10.5. Using parentheses, 10.5 is truncated to int." }
  - type: multipleChoice
    id: modulo-kette
    prompt: { de: "Welchen Wert hat `2 * 5 + 9 / 2 % 4 * 5`?", en: "What is the value of `2 * 5 + 9 / 2 % 4 * 5`?" }
    options:
      - { de: "10", en: "10" }
      - { de: "30", en: "30" }
      - { de: "12", en: "12" }
      - { de: "35", en: "35" }
    correct: [0]
    explanation: { de: "*, / und % haben gleichen Rang und werden von links ausgewertet: 9 / 2 = 4, 4 % 4 = 0, 0 * 5 = 0; dann 10 + 0.", en: "*, /, and % have the same precedence and are evaluated from left to right: 9 / 2 = 4, 4 % 4 = 0, 0 * 5 = 0; then 10 + 0." }
  - type: multipleChoice
    id: inkrement
    prompt: { de: "`int i = 4, j = 5; int a = (i++ == j ? 1 : 2); int b = (++i == 6 ? 1 : 2);` Welche Werte haben a und b?", en: "`int i = 4, j = 5; int a = (i++ == j ? 1 : 2); int b = (++i == 6 ? 1 : 2);` What are the values of a and b?" }
    options:
      - { de: "a = 2, b = 1", en: "a = 2, b = 1" }
      - { de: "a = 1, b = 1", en: "a = 1, b = 1" }
      - { de: "a = 2, b = 2", en: "a = 2, b = 2" }
      - { de: "a = 1, b = 2", en: "a = 1, b = 2" }
    correct: [0]
    explanation: { de: "i++ liefert den alten Wert 4 (ungleich 5, also 2) und setzt i auf 5. ++i erhöht zuerst auf 6, der Vergleich ist wahr, also 1.", en: "i++ returns the old value 4 (not equal to 5, so 2) and sets i to 5. ++i first increments i to 6; the comparison is true, so 1." }
  - type: multipleChoice
    id: verbund
    prompt: { de: "`int k = 5; k += 3 * 2; k *= 2 + 1;` Welchen Wert hat k danach?", en: "`int k = 5; k += 3 * 2; k *= 2 + 1;` What is the value of k after that?" }
    options:
      - { de: "33", en: "33" }
      - { de: "23", en: "23" }
      - { de: "16", en: "16" }
      - { de: "36", en: "36" }
    correct: [0]
    explanation: { de: "k += 3 * 2 macht 11; k *= 2 + 1 bedeutet k = k * (2 + 1) = 33, die rechte Seite wird als Ganzes genommen.", en: "k += 3 * 2 equals 11; k *= 2 + 1 means k = k * (2 + 1) = 33, and the right-hand side is taken as a whole." }
  - type: multipleChoice
    id: logik
    prompt: { de: "Welchen Wert hat `bool x = 5 > 3 && 2 == 2 ^ 1 == 1;`?", en: "What is the value of `bool x = 5 > 3 && 2 == 2 ^ 1 == 1;`?" }
    options:
      - { de: "false", en: "false" }
      - { de: "true", en: "true" }
    correct: [0]
    explanation: { de: "Vergleiche binden stärker als ^, und ^ bindet stärker als &&: true && (true ^ true) = true && false = false.", en: "The comparison operator has higher precedence than ^, and ^ has higher precedence than &&: true && (true ^ true) = true && false = false." }
  - type: multipleChoice
    id: de-morgan
    prompt: { de: "Welcher Ausdruck ist gleichwertig zu `!(i > 0 || c == 'j')`?", en: "Which expression is equivalent to `!(i > 0 || c == 'j')`?" }
    options:
      - { de: "i <= 0 && c != 'j'", en: "i <= 0 && c != 'j'" }
      - { de: "i <= 0 || c != 'j'", en: "i <= 0 || c != 'j'" }
      - { de: "i < 0 && c != 'j'", en: "i < 0 && c != 'j'" }
      - { de: "!(i > 0) || !(c == 'j')", en: "!(i > 0) || !(c == 'j')" }
    correct: [0]
    explanation: { de: "De Morgan: !(a || b) = !a && !b; die Negation von i > 0 ist i <= 0.", en: "De Morgan: !(a || b) = !a && !b; the negation of i > 0 is i <= 0." }
  - type: multipleChoice
    id: reihenfolge
    prompt: { de: "In `a / (b + c) * d` mit numerischen Variablen: Welcher Operator wird zuerst ausgeführt?", en: "In the expression `a / (b + c) * d` with numerical variables: Which operator is evaluated first?" }
    options:
      - { de: "+", en: "+" }
      - { de: "/", en: "/" }
      - { de: "*", en: "*" }
      - { de: "Das entscheidet der Compiler zufällig.", en: "The compiler decides that randomly." }
    correct: [0]
    explanation: { de: "Klammern zuerst, danach / und * von links nach rechts.", en: "Parentheses first, then / and * from left to right." }
  - type: multipleChoice
    id: kurzschluss
    prompt: { de: "`int n = 0; bool ok = n != 0 && 10 / n > 1;` Was passiert?", en: "`int n = 0; bool ok = n != 0 && 10 / n > 1;` What happens?" }
    options:
      - { de: "ok ist false; die Division wird nicht ausgeführt, weil && den rechten Operanden bei false links überspringt.", en: "ok is false; the division is not performed because && skips the right operand when the left one is false." }
      - { de: "Es kommt zu einer Division durch null.", en: "A division by zero occurs." }
      - { de: "ok ist true.", en: "ok is true." }
      - { de: "Der Compiler meldet einen Fehler.", en: "The compiler reports an error." }
    correct: [0]
