id: ablauf-kontrollfluss-fehler
title: { de: "Fehlersuche in Verzweigungen" }
reading:
  section: "4.7.2"
  title: { de: "Bedingte Anweisung und Fallunterscheidung" }
  printedPage: 253
teaches:
  - control.dangling-else
  - control.assignment-in-condition
  - control.empty-statement
  - control.else-if-chain
requires:
  - control.if-else
  - operators.integer-division
  - operators.logical
items:
  - type: coding
    id: fehlersuche
    openFile: "Fehlersuche/Fehlersuche.cs"
    openLine: 5
    testProject: "Fehlersuche.Tests/Fehlersuche.Tests.csproj"
  - type: multipleChoice
    id: leere-anweisung
    prompt: { de: "`int i = 0; while (i < 100); { i++; Console.WriteLine(i); }` Wie oft wird der Block mit i++ ausgeführt?" }
    options:
      - { de: "Gar nicht: Das Semikolon hinter dem Schleifenkopf ist der (leere) Schleifenkörper, die Schleife endet nie, der Block wird nie erreicht." }
      - { de: "100-mal." }
      - { de: "Einmal." }
      - { de: "Der Compiler lehnt das Programm ab." }
    correct: [0]
  - type: multipleChoice
    id: else-zuordnung
    prompt: { de: "Zu welchem if gehört ein else, wenn keine geschweiften Klammern gesetzt sind?" }
    options:
      - { de: "Zum nächstgelegenen vorangehenden if, das noch kein else hat, unabhängig von der Einrückung." }
      - { de: "Zu dem if, das gleich eingerückt ist." }
      - { de: "Zum äußersten if." }
      - { de: "Der Compiler meldet einen Fehler, wenn es mehrdeutig ist." }
    correct: [0]
