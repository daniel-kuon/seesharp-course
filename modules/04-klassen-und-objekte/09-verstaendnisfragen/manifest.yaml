id: klassen-verstaendnisfragen
title: { de: "Verständnisfragen", en: "Comprehension questions" }
reading:
  section: "5"
  title: { de: "Klassen und Objekte", en: "Classes and Objects" }
  printedPage: 285
teaches:
  - oop.object-initializer
  - oop.copy-values
  - statics.constructor
  - algo.fibonacci
