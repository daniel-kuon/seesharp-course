items:
  - type: coding
    id: familie
    openFile: "GeschachtelteKlassen/Familie.cs"
    openLine: 18
    testProject: "GeschachtelteKlassen Tests/GeschachtelteKlassen.Tests.csproj"
  - type: multipleChoice
    id: zugriff
    prompt: { de: "Eine Klasse Sohn ist in Familie geschachtelt. Auf welche Mitglieder von Familie darf Sohn zugreifen?" }
    options:
      - { de: "Auf alle, auch auf private Felder, sofern eine Familie-Referenz vorliegt." }
      - { de: "Nur auf öffentliche Mitglieder, wie jede andere Klasse auch." }
      - { de: "Nur auf statische Mitglieder." }
      - { de: "Auf gar keine; geschachtelte Klassen sind vollständig getrennt." }
    correct: [0]
    explanation: { de: "Eine geschachtelte Klasse gehört zum Rumpf der äußeren Klasse und sieht deren private Mitglieder. Für Instanzmitglieder braucht sie trotzdem eine Referenz auf ein Familie-Objekt." }
