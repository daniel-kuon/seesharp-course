id: typen-enums-und-tupel
title: { de: "Enumerationen und Tupel", en: "Enumerations and Tuples" }
reading:
  section: "6.4"
  title: { de: "Aufzählungstypen", en: "Enumeration Types" }
  printedPage: 480
teaches:
  - enums.declare
  - enums.underlying-value
  - enums.parse-tostring
  - tuples.return-multiple
  - tuples.deconstruct
requires:
  - oop.property-validated
  - oop.property-field-keyword
  - strings.methods
  - types.explicit-cast
items:
  - type: coding
    id: temperament
    openFile: "EnumsTupel/Temperament.cs"
    openLine: 8
    testProject: "EnumsTupel Tests/EnumsTupel.Tests.csproj"
    requiredTests:
      - EnumsTupelTests.Enum_hat_die_vier_Temperamente_in_dieser_Reihenfolge
      - EnumsTupelTests.Setter_ignoriert_undefinierte_Werte
      - EnumsTupelTests.Person_laesst_sich_in_Vorname_und_Name_dekonstruieren
      - EnumsTupelTests.AnalyzeName_liefert_ein_benanntes_Tupel
      - EnumsTupelTests.AnalyzeName_laesst_sich_dekonstruieren
  - type: multipleChoice
    id: enum-cast
    prompt: { de: "enum Ampel { Rot, Gelb, Gruen } — was ergibt (Ampel)7?", en: "enum Ampel { Rot, Gelb, Gruen } — what does (Ampel)7 give?" }
    options:
      - { de: "Der Cast gelingt und liefert einen Ampel-Wert, hinter dem die 7 steht; Enum.IsDefined meldet ihn als nicht definiert.", en: "The cast succeeds and returns an Ampel value whose underlying number is 7; Enum.IsDefined reports it as not defined." }
      - { de: "Eine InvalidCastException zur Laufzeit.", en: "An InvalidCastException at runtime." }
      - { de: "Einen Compilerfehler.", en: "A compiler error." }
      - { de: "Ampel.Gruen, weil auf den letzten Wert gerundet wird.", en: "`Ampel.Gruen`, because it is rounded down to the last value." }
    correct: [0]
    explanation: { de: "Ein Enum ist zur Laufzeit nur eine Ganzzahl (6.4, Seite 480). Die explizite Typumwandlung (Ampel)7 erlaubt der Compiler, und zur Laufzeit wird weder geprüft noch gerundet; es entsteht keine Ausnahme. Deshalb lohnt sich die Validierung im Setter mit Enum.IsDefined.", en: "At runtime, an enum is simply an integer (6.4, page 480). The compiler allows the explicit conversion `(Ampel)7`, and at runtime nothing is checked or rounded; no exception occurs. That's why it's worth validating in the setter using `Enum.IsDefined`." }
