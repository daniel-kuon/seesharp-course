id: typen-records-und-anonyme-typen
title: { de: "Records, anonyme Klassen, using-Alias", en: "Records, anonymous classes, using aliases" }
reading:
  section: "6.7"
  title: { de: "Record-Datentypen", en: "Record Data Types" }
  printedPage: 495
teaches:
  - records.declare
  - records.value-equality
  - records.with
  - types.anonymous
  - types.using-alias
requires:
  - oop.constructor-explicit
  - oop.property-auto
  - tuples.deconstruct
  - structs.value-semantics
  - oop.pure-method-returns-new
  - types.var
items:
  - type: coding
    id: artikel
    openFile: "Records/Artikel.cs"
    openLine: 1
    testProject: "Records Tests/Records.Tests.csproj"
  - type: multipleChoice
    id: record-gleichheit
    prompt: { de: "record Punkt(int X, int Y); var a = new Punkt(1, 2); var b = new Punkt(1, 2); Was liefern a == b und ReferenceEquals(a, b)?", en: "`record Punkt(int X, int Y); var a = new Punkt(1, 2); var b = new Punkt(1, 2);` What do `a == b` and `ReferenceEquals(a, b)` return?" }
    options:
      - { de: "true und false: Records vergleichen inhaltlich, es sind aber zwei Objekte.", en: "true and false: Records are compared based on their content, but they are two separate objects." }
      - { de: "false und false: == vergleicht bei Klassen immer Referenzen.", en: "false and false: == always compares references when dealing with classes." }
      - { de: "true und true: der Compiler legt gleiche Records nur einmal an.", en: "true and true: The compiler creates identical records only once." }
    correct: [0]
    explanation: { de: "Records bekommen vom Compiler Equals, GetHashCode und die Operatoren == und != mit Wertvergleich (6.7.2, Seite 498).", en: "The compiler provides Records with the Equals and GetHashCode methods, as well as the == and != operators for value comparison (6.7.2, page 498)." }
  - type: multipleChoice
    id: anonym
    prompt: { de: "var p = new { Name = \"Otto\", Alter = 35 }; Welche Aussage stimmt?", en: "`var p = new { Name = \"Otto\", Alter = 35 };` Which statement is true?" }
    options:
      - { de: "p hat einen vom Compiler erzeugten Typ ohne Namen; seine Eigenschaften sind nur lesbar, und var ist für die Variable Pflicht.", en: "p has a nameless type generated by the compiler; its properties are read-only, and var is required for the variable." }
      - { de: "p ist vom Typ object; auf Name kommt man nur per Cast.", en: "p is of type object; you can only access name by casting." }
      - { de: "p ist ein Record namens Anonymous mit veränderbaren Eigenschaften.", en: "p is a record named \"Anonymous\" with modifiable properties." }
      - { de: "Der Code kompiliert nicht, weil der Typname fehlt.", en: "The code won't compile because the type name is missing." }
    correct: [0]
    explanation: { de: "Anonyme Klassen (6.5, Seite 483) sind für kurzlebige Datenbündel gedacht, etwa in LINQ-Abfragen; nach außen gibt man sie nicht weiter.", en: "Anonymous classes (6.5, page 483) are intended for short-lived data bundles, such as in LINQ queries; they are not passed on to the outside." }
  - type: multipleChoice
    id: using-alias
    prompt: { de: "Was bewirkt using Koordinate = (double X, double Y); am Dateianfang?", en: "What does `using Koordinate = (double X, double Y);` at the top of the file do?" }
    options:
      - { de: "Koordinate ist in dieser Datei ein Alias für den Tupeltyp; Koordinate k = (1.0, 2.0); ist erlaubt.", en: "In this file, \"coordinate\" is an alias for the \"tupel\" type; \"coordinate k = (1.0, 2.0);\" is allowed." }
      - { de: "Es wird ein neuer Record-Typ Koordinate deklariert.", en: "A new record type, \"Coordinate,\" is declared." }
      - { de: "Es importiert einen Namensraum namens Koordinate.", en: "It imports a namespace called \"Koordinate.\"" }
    correct: [0]
    explanation: { de: "Die using-Aliasdirektive (6.8, Seite 504) gibt einem Typ einen kürzeren Namen, seit C# 12 auch Tupeltypen. Es entsteht kein neuer Typ.", en: "The `using` alias directive (6.8, page 504) gives a type a shorter name; since C# 12, this also applies to tuple types. It does not create a new type." }
