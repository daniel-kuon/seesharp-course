id: typen-records-und-anonyme-typen
title: { de: "Records, anonyme Klassen, using-Alias", en: "Records, anonymous classes, using aliases" }
reading:
  section: "6.7"
  title: { de: "Record-Datentypen", en: "Record Data Types" }
  printedPage: 495
teaches:
  - records.declare
  - records.value-equality
  - records.with
  - types.anonymous
  - types.using-alias
requires:
  - oop.constructor-explicit
  - oop.property-auto
  - tuples.deconstruct
  - structs.value-semantics
  - oop.pure-method-returns-new
  - types.var
items:
  - type: coding
    id: artikel
    openFile: "Records/Artikel.cs"
    openLine: 1
    testProject: "Records Tests/Records.Tests.csproj"
  - type: multipleChoice
    id: record-gleichheit
    prompt: { de: "record Punkt(int X, int Y); var a = new Punkt(1, 2); var b = new Punkt(1, 2); Was liefern a == b und ReferenceEquals(a, b)?", en: "`record Punkt(int X, int Y); var a = new Punkt(1, 2); var b = new Punkt(1, 2);` What do `a == b` and `ReferenceEquals(a, b)` return?" }
    options:
      - { de: "true und false: Records vergleichen inhaltlich, es sind aber zwei Objekte.", en: "true and false: Records are compared based on their content, but they are two separate objects." }
      - { de: "false und false: == vergleicht bei Klassen immer Referenzen.", en: "false and false: == always compares references when dealing with classes." }
      - { de: "true und true: der Compiler legt gleiche Records nur einmal an.", en: "true and true: The compiler creates identical records only once." }
    correct: [0]
    explanation: { de: "Records bekommen vom Compiler Equals, GetHashCode und die Operatoren == und != mit Wertvergleich (6.7.2, Seite 498). == vergleicht also hier nicht die Referenzen, und der Compiler legt trotzdem zwei Objekte an; erst ReferenceEquals sieht das.", en: "The compiler provides Records with the Equals and GetHashCode methods, as well as the == and != operators for value comparison (6.7.2, page 498). So == does not compare references here, and the compiler still creates two objects; only ReferenceEquals reveals that." }
  - type: multipleChoice
    id: anonym
    prompt: { de: "var p = new { Name = \"Otto\", Alter = 35 }; Welche Aussage stimmt?", en: "`var p = new { Name = \"Otto\", Alter = 35 };` Which statement is true?" }
    options:
      - { de: "p hat einen vom Compiler erzeugten Typ, dessen Namen man in C# nicht schreiben kann; seine Eigenschaften sind nur lesbar, und var ist für die Variable Pflicht.", en: "p has a type generated by the compiler whose name cannot be written in C#; its properties are read-only, and var is required for the variable." }
      - { de: "p ist vom Typ object; auf Name kommt man nur per Cast.", en: "p is of type object; you can only access Name by casting." }
      - { de: "p ist ein Record namens Anonymous mit veränderbaren Eigenschaften.", en: "p is a record named \"Anonymous\" with modifiable properties." }
      - { de: "Der Code kompiliert nicht, weil der Typname fehlt.", en: "The code won't compile because the type name is missing." }
    correct: [0]
    explanation: { de: "Anonyme Klassen (6.5, Seite 483) sind für kurzlebige Datenbündel gedacht, etwa in LINQ-Abfragen; als Parameter- oder Rückgabetyp taugen sie nicht. p ist nicht vom Typ object, kein Record und hat nur Nur-Lese-Eigenschaften; ohne Typnamen kompiliert der Code, weil var den Typ übernimmt.", en: "Anonymous classes (6.5, page 483) are intended for short-lived data bundles, such as in LINQ queries; they cannot serve as a parameter or return type. p is not of type object, not a record, and has only read-only properties; the code compiles without a type name because var takes over the type." }
  - type: multipleChoice
    id: using-alias
    prompt: { de: "Was bewirkt using Koordinate = (double X, double Y); am Dateianfang?", en: "What does `using Koordinate = (double X, double Y);` at the top of the file do?" }
    options:
      - { de: "Koordinate ist in dieser Datei ein Alias für den Tupeltyp; Koordinate k = (1.0, 2.0); ist erlaubt.", en: "In this file, Koordinate is an alias for the tuple type; Koordinate k = (1.0, 2.0); is allowed." }
      - { de: "Es wird ein neuer Record-Typ Koordinate deklariert.", en: "A new record type Koordinate is declared." }
      - { de: "Es importiert einen Namensraum namens Koordinate.", en: "It imports a namespace called Koordinate." }
    correct: [0]
    explanation: { de: "Die using-Aliasdirektive (6.8, Seite 504) gibt einem Typ einen kürzeren Namen, seit C# 12 auch Tupeltypen (Seite 505). Es entsteht kein neuer Typ, also auch kein Record, und importiert wird nichts.", en: "The `using` alias directive (6.8, page 504) gives a type a shorter name; since C# 12, this also applies to tuple types (page 505). It does not create a new type, so no record either, and nothing is imported." }
