id: vererbung-virtual-override
title: { de: "Polymorphie: virtual und override" }
reading:
  section: "7.9"
  title: { de: "Polymorphie (Überschreiben von Methoden)" }
  printedPage: 566
teaches:
  - inheritance.virtual-override
  - inheritance.base-call
  - inheritance.sealed
requires:
  - inheritance.derive-class
  - inheritance.base-constructor
  - inheritance.base-reference
  - inheritance.protected
  - strings.interpolation
  - oop.tostring-override
items:
  - type: coding
    id: polymorphie
    openFile: "Polymorphie/Figur.cs"
    openLine: 12
    testProject: "Polymorphie Tests/Polymorphie.Tests.csproj"
  - type: multipleChoice
    id: statischer-vs-dynamischer-typ
    prompt: { de: "Figur f = new Kreis(); f.Wo(); — Wo ist in Figur virtual und in Kreis override. Welche Fassung läuft, und wonach entscheidet sich das?" }
    options:
      - { de: "Die Kreis-Fassung; entscheidend ist der dynamische Typ des Objekts (Kreis), nicht der statische Typ der Variablen (Figur)." }
      - { de: "Die Figur-Fassung; entscheidend ist der Typ der Variablen." }
      - { de: "Beide nacheinander, erst Figur, dann Kreis." }
    correct: [0]
    explanation: { de: "Virtuelle Methoden werden zur Laufzeit über den dynamischen Typ aufgelöst (7.9, Seite 566). Mit new statt override liefe dagegen die Figur-Fassung, weil new nur verdeckt." }
