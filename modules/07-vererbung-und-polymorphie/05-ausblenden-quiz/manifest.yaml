id: vererbung-ausblenden-quiz
title: { de: "Überladen, Verdecken, Überschreiben (Quiz)", en: "Overloading, Hiding, Overriding (Quiz)" }
reading:
  section: "7.6"
  title: { de: "Erbstücke durch spezialisierte Varianten ausblenden", en: "Hiding Heirlooms Using Specialized Variants" }
  printedPage: 555
teaches:
  - inheritance.hiding-new
  - inheritance.overload-vs-override
  - inheritance.static-no-override
requires:
  - inheritance.virtual-override
  - inheritance.base-reference
  - oop.method-overload
  - statics.method
items:
  - type: multipleChoice
    id: drei-begriffe
    prompt: { de: "Welche Zuordnung stimmt? (a) gleicher Name, andere Parameterliste, dieselbe Klasse; (b) gleiche Signatur, abgeleitete Klasse, Schlüsselwort new; (c) gleiche Signatur, abgeleitete Klasse, virtual/override", en: "Which assignment is correct? (a) Same name, different parameter list, same class; (b) Same signature, derived class, keyword `new`; (c) Same signature, derived class, `virtual`/`override`" }
    options:
      - { de: "(a) Überladen, (b) Verdecken, (c) Überschreiben", en: "(a) Overloading, (b) Hiding, (c) Overriding" }
      - { de: "(a) Überschreiben, (b) Überladen, (c) Verdecken", en: "(a) Overriding, (b) Overloading, (c) Hiding" }
      - { de: "(a) Verdecken, (b) Überschreiben, (c) Überladen", en: "(a) Hiding, (b) Overriding, (c) Overloading" }
    correct: [0]
    explanation: { de: "Überladen ist ein Thema innerhalb einer Klasse (5.3.5); Verdecken und Überschreiben betreffen die Vererbung (7.6 und 7.9).", en: "Overloading is a matter within a single class (5.3.5); hiding and overriding concern inheritance (7.6 and 7.9)." }
  - type: multipleChoice
    id: statisch
    prompt: { de: "Welche der drei Techniken ist bei statischen Methoden nicht anwendbar?", en: "Which of the three techniques cannot be used with static methods?" }
    options:
      - { de: "Überschreiben: statische Methoden sind nicht virtuell, es gibt keinen dynamischen Typ, nach dem entschieden werden könnte.", en: "Overriding: Static methods are not virtual; there is no dynamic type that could be used to make a decision." }
      - { de: "Überladen: statische Methoden dürfen nicht denselben Namen tragen.", en: "Overloading: Static methods must not have the same name." }
      - { de: "Verdecken: new ist bei static verboten.", en: "Hiding: `new` is not allowed with `static`." }
    correct: [0]
    explanation: { de: "Statische Methoden lassen sich überladen und mit new verdecken (Beispiel StatAusblenden), aber nicht mit virtual/override überschreiben (7.9, Seite 569; 7.16 Aufgabe 3).", en: "Static methods can be overloaded and hidden using `new` (see the `StatAusblenden` example), but they cannot be overridden using `virtual` or `override` (7.9, page 569; 7.16, Exercise 3)." }
  - type: multipleChoice
    id: new-ueber-basisreferenz
    prompt: { de: "Kreis verdeckt Wo() mit new. var kreis = new Kreis(); Figur figur = kreis; figur.Wo(); Welche Fassung läuft?", en: "`Kreis` hides `Wo()` with `new`. `var kreis = new Kreis(); Figur figur = kreis; figur.Wo();` Which version runs?" }
    options:
      - { de: "Die Figur-Fassung: Verdecken wirkt nur, wenn der statische Typ der Variablen Kreis ist.", en: "The `Figur` version: Hiding only takes effect if the static type of the variable is `Kreis`." }
      - { de: "Die Kreis-Fassung: das Objekt ist ein Kreis.", en: "The `Kreis` version: the object is a `Kreis`." }
      - { de: "Ein Compilerfehler, weil Wo mehrdeutig ist.", en: "A compiler error because `Wo` is ambiguous." }
    correct: [0]
    explanation: { de: "Beim Verdecken entscheidet der statische Typ (7.6.1.2, Seite 557). Genau deshalb ist override in den meisten Fällen die richtige Wahl.", en: "When it comes to hiding, the static type is what matters (7.6.1.2, page 557). That is precisely why `override` is the right choice in most cases." }
  - type: multipleChoice
    id: verdeckte-virtualitaet
    prompt: { de: "class A { public virtual void M() } — class B : A { public new virtual void M() } — class C : B { public override void M() }. C c = new(); A a = c; B b = c; Welche Fassungen laufen bei a.M() und b.M()?", en: "class A { public virtual void M() } — class B : A { public new virtual void M() } — class C : B { public override void M() }. C c = new(); A a = c; B b = c; Which versions are called when a.M() and b.M() are executed?" }
    options:
      - { de: "a.M() läuft die A-Fassung, b.M() die C-Fassung.", en: "a.M() runs the A version, b.M() the C version." }
      - { de: "Beide laufen die C-Fassung, weil das Objekt ein C ist.", en: "Both run the C version because the object is a C." }
      - { de: "a.M() läuft die A-Fassung, b.M() die B-Fassung.", en: "a.M() runs the A version, b.M() the B version." }
      - { de: "Beide laufen die A-Fassung.", en: "Both run the A version." }
    correct: [0]
    explanation: { de: "B.M beginnt mit new virtual eine neue Kette, die C überschreibt. A.M ist eine andere Kette, die niemand überschreibt (Beispiel VerdecktVirtuell, 7.9, Seite 568).", en: "`B.M` starts a new chain with `new virtual` that `C` overrides. `A.M` is a different chain that nobody overrides (example `VerdecktVirtuell`, 7.9, page 568)." }
  - type: multipleChoice
    id: ohne-new
    prompt: { de: "Eine abgeleitete Klasse deklariert eine Methode mit derselben Signatur wie die Basisklasse, ohne new und ohne override. Was passiert?", en: "A derived class declares a method with the same signature as the base class, without `new` and without `override`. What happens?" }
    options:
      - { de: "Sie verdeckt die Basismethode; der Compiler warnt (CS0108), dass new fehlt.", en: "It hides the base method; the compiler warns (CS0108) that `new` is missing." }
      - { de: "Sie überschreibt die Basismethode automatisch.", en: "It automatically overrides the base method." }
      - { de: "Compilerfehler: doppelte Definition.", en: "Compiler error: duplicate definition." }
    correct: [0]
    explanation: { de: "Verdecken ist der Standard, new macht es nur ausdrücklich und bringt die Warnung zum Schweigen (7.6.1).", en: "Hiding is the default; `new` only makes it explicit and silences the warning (7.6.1)." }
  - type: multipleChoice
    id: privates-verdecken
    prompt: { de: "class Basis { public void NenneTyp() … } — class Spezial : Basis { new void NenneTyp() … public void DeinTyp() { NenneTyp(); } }. var s = new Spezial(); Was liefern s.NenneTyp() und s.DeinTyp()?", en: "`class Basis { public void NenneTyp() … }` — `class Spezial : Basis { new void NenneTyp() … public void DeinTyp() { NenneTyp(); } }`. `var s = new Spezial();` What do `s.NenneTyp()` and `s.DeinTyp()` return?" }
    options:
      - { de: "s.NenneTyp() ruft die Basis-Fassung (die private Spezial-Fassung ist von außen unsichtbar); s.DeinTyp() ruft die Spezial-Fassung.", en: "`s.NenneTyp()` calls the base version (the private `Spezial` version is invisible from outside); `s.DeinTyp()` calls the `Spezial` version." }
      - { de: "Beide rufen die Spezial-Fassung.", en: "Both call the `Spezial` version." }
      - { de: "Beide rufen die Basis-Fassung.", en: "Both call the base version." }
    correct: [0]
    explanation: { de: "Die Sichtbarkeit entscheidet, welche Methode von einer Stelle aus überhaupt gefunden wird (Beispiel PrivAusblenden).", en: "Visibility determines which method can even be found from a given location (example `PrivAusblenden`)." }
  - type: multipleChoice
    id: felder-verdecken
    prompt: { de: "class BK { protected string x = \"BaseString\"; } — class AK : BK { new int x = 333; } Wie kommt eine Methode von AK an den String der Basisklasse?", en: "class BK { protected string x = \"BaseString\"; } — class AK : BK { new int x = 333; } How can a method in AK access the string from the base class?" }
    options:
      - { de: "Über base.x; x allein meint das int-Feld 333 von AK.", en: "Via `base.x`; `x` alone means the int field 333 of `AK`." }
      - { de: "Gar nicht; das Feld ist durch das Verdecken verloren.", en: "Not at all; hiding makes the field lost." }
      - { de: "Über (string)x.", en: "Via `(string)x`." }
    correct: [0]
    explanation: { de: "Auch Felder lassen sich verdecken (7.6.2, Seite 561). Beide Felder existieren im Objekt; base greift auf das Erbstück zu.", en: "Fields can also be hidden (7.6.2, page 561). Both fields exist in the object; `base` accesses the inherited field." }
  - type: multipleChoice
    id: vermeintlich
    prompt: { de: "Basis hat Methode(in int ip), Spezial hat new Methode(ref int ip). int i = 1; s.Methode(in i); s.Methode(ref i); Welche Fassungen laufen?", en: "`Basis` has `Methode(in int ip)`, `Spezial` has `new Methode(ref int ip)`. `int i = 1; s.Methode(in i); s.Methode(ref i);` Which versions run?" }
    options:
      - { de: "Erst die Basis-, dann die Spezial-Fassung: in und ref sind verschiedene Signaturen, es wird gar nicht verdeckt, sondern überladen.", en: "First the `Basis` version, then the `Spezial` version: `in` and `ref` are different signatures; nothing is hidden at all, the methods are overloaded." }
      - { de: "Beide Male die Spezial-Fassung, weil new verdeckt.", en: "Both times the `Spezial` version, because `new` hides." }
      - { de: "Compilerfehler, weil in und ref nicht gemischt werden dürfen.", en: "Compiler error because `in` and `ref` cannot be mixed." }
    correct: [0]
    explanation: { de: "Beim Ausblenden zählt die erweiterte Signatur mit den Verweismodifikatoren: Eine Methode mit ref blendet nur eine Basismethode mit ref aus (7.6.1.1, Seite 557). Das new ist hier überflüssig, der Compiler warnt (CS0109, Beispiel VermAusblenden, 7.6.1.2, Seite 558).", en: "For hiding, the extended signature including the reference modifiers counts: a method with `ref` only hides a base method with `ref` (7.6.1.1, page 557). The `new` is unnecessary here, and the compiler warns (CS0109, example `VermAusblenden`, 7.6.1.2, page 558)." }
