id: vererbung-erweiterungsmitglieder
title: { de: "Erweiterungsmitglieder (C# 14)" }
reading:
  section: "7.15"
  title: { de: "Erweiterungsmitglieder" }
  printedPage: 581
teaches:
  - extensions.extension-method
  - extensions.extension-block
  - extensions.static-extension
requires:
  - statics.method
  - operators.math-class
  - oop.operator-binary
  - oop.property-computed
  - operators.logical
items:
  - type: coding
    id: erweiterungen
    openFile: "Erweiterungen/DoubleExtensions.cs"
    openLine: 3
    testProject: "Erweiterungen Tests/Erweiterungen.Tests.csproj"
  - type: multipleChoice
    id: keine-vererbung
    prompt: { de: "double ist eine versiegelte Struktur. Warum lässt sich trotzdem pi.High(2) schreiben?" }
    options:
      - { de: "High ist eine Erweiterungsmethode in einer statischen Klasse; der Compiler schreibt pi.High(2) in DoubleExtensions.High(pi, 2) um. double selbst wird nicht verändert." }
      - { de: "Der Compiler leitet zur Laufzeit eine Klasse von double ab." }
      - { de: "double ist in Wirklichkeit nicht versiegelt." }
    correct: [0]
    explanation: { de: "Erweiterungsmitglieder sind syntaktischer Zucker für statische Methoden (7.15.1, Seite 582). Sie haben keinen Zugriff auf private Mitglieder des erweiterten Typs." }
  - type: multipleChoice
    id: instanz-vs-erweiterung
    prompt: { de: "Ein Typ hat eine Instanzmethode M() und es gibt zusätzlich eine Erweiterungsmethode M() für ihn. Was ruft x.M() auf?" }
    options:
      - { de: "Immer die Instanzmethode; Erweiterungen kommen nur zum Zug, wenn der Typ nichts Passendes hat." }
      - { de: "Die Erweiterungsmethode, weil sie später definiert wurde." }
      - { de: "Compilerfehler wegen Mehrdeutigkeit." }
    correct: [0]
    explanation: { de: "Erweiterungsmitglieder haben niedrigere Priorität als echte Mitglieder (7.15.1). Das gilt auch, wenn der erweiterte Typ das Mitglied später nachrüstet." }
