id: generics-stapel
title: { de: "Ein generischer Stapel", en: "A generic stack" }
reading:
  section: "8.2.1"
  title: { de: "Generische Klassen: Definition", en: "Generic Classes: Definition" }
  printedPage: 591
teaches:
  - generics.class-declare
  - generics.array-of-t
requires:
  - oop.class-declare
  - arrays.declare-init
  - arrays.index-length
  - oop.constructor-explicit
  - oop.constructor-validates
  - oop.property-computed
items:
  - type: coding
    id: stapel
    openFile: "SimpleStack/SimpleStack.cs"
    openLine: 2
    testProject: "SimpleStack Tests/SimpleStack.Tests.csproj"
  - type: multipleChoice
    id: warum-generisch
    prompt: { de: "Warum ist SimpleStack<T> einem Stapel mit Elementtyp object vorzuziehen?", en: "Why is SimpleStack<T> preferable to a stack with the element type `object`?" }
    options:
      - { de: "Der Compiler prüft den Elementtyp, Pop() braucht keinen Cast, und Werttypen werden nicht geboxt.", en: "The compiler checks the element type; `Pop()` does not require a cast, and value types are not boxed." }
      - { de: "Generische Klassen sind immer schneller, weil sie zur Laufzeit interpretiert werden.", en: "Generic classes are always faster because they are interpreted at runtime." }
      - { de: "object-Stapel können keine Strings aufnehmen.", en: "Object stacks cannot hold strings." }
    correct: [0]
    explanation: { de: "Typsicherheit und Performance sind die Motive aus 8.1 (Seite 589); der ArrayList-Vergleich in 8.8 Aufgabe 2 misst den Boxing-Aufwand. Generischer Code wird nicht interpretiert, sondern wie jeder andere C#-Code übersetzt. Und ein object-Stapel nimmt Strings durchaus auf, nur prüft der Compiler dann den Elementtyp nicht.", en: "Type safety and performance are the motives given in 8.1 (page 589); the ArrayList comparison in 8.8, Exercise 2, measures the boxing overhead. Generic code is not interpreted; it is compiled like any other C# code. And an object stack can certainly hold strings; the compiler just no longer checks the element type." }
