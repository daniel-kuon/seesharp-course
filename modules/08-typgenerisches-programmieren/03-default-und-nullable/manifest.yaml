id: generics-default-und-nullable
title: { de: "default(T) und Nullable<T>", en: "default(T) and Nullable<T>" }
reading:
  section: "8.7"
  title: { de: "default-Operator", en: "default operator" }
  printedPage: 605
teaches:
  - generics.default
  - generics.method
  - generics.nullable-value
requires:
  - generics.class-declare
  - control.foreach
  - operators.conditional
  - types.int
items:
  - type: coding
    id: werte
    openFile: "DefaultNullable/Werte.cs"
    openLine: 3
    testProject: "DefaultNullable Tests/DefaultNullable.Tests.csproj"
  - type: multipleChoice
    id: nullable-struct
    prompt: { de: "int? ist eine Kurzschreibweise für Nullable<int>. Was gilt für eine Variable int? x = null;?", en: "int? is a shorthand notation for Nullable<int>. What happens when you declare a variable like this: int? x = null;?" }
    options:
      - { de: "x ist eine Struktur mit HasValue == false; x.Value würde eine InvalidOperationException werfen.", en: "x is a structure with HasValue == false; x.Value would throw an InvalidOperationException." }
      - { de: "x ist eine Referenz auf ein Objekt auf dem Heap.", en: "x is a reference to an object on the heap." }
      - { de: "Der Code kompiliert nicht, weil int kein null kennt.", en: "The code won't compile because `int` doesn't support null." }
    correct: [0]
    explanation: { de: "Nullable<T> ist eine generische Struktur (8.3, Seite 598); null-Zuweisung setzt HasValue auf false. Mit ?? holt man sich sicher einen Ersatzwert (8.3.2, Seite 600).", en: "`Nullable<T>` is a generic structure (8.3, page 598); assigning `null` sets `HasValue` to `false`. Using `??` ensures that a default value is retrieved (8.3.2, page 600)." }
