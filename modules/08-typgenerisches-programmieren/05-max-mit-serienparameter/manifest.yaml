id: generics-max-serienparameter
title: { de: "Max<T>() mit generischem Serienparameter", en: "Max<T>() with a generic series parameter" }
reading:
  section: "8.5"
  title: { de: "Generische Methoden", en: "Generic Methods" }
  printedPage: 602
teaches:
  - generics.params
  - generics.constraint-kinds
requires:
  - generics.method
  - generics.constraint-icomparable
  - generics.nullable-value
  - methods.parameters
  - control.for
items:
  - type: coding
    id: serie
    openFile: "Serie/Serie.cs"
    openLine: 3
    testProject: "Serie Tests/Serie.Tests.csproj"
  - type: multipleChoice
    id: constraint-arten
    prompt: { de: "Welche Einschränkung erlaubt new T() innerhalb einer generischen Klasse?", en: "Which constraint allows `new T()` inside a generic class?" }
    options:
      - { de: "where T : new() — T muss einen öffentlichen parameterlosen Konstruktor haben.", en: "where T : new() — T must have a public, parameterless constructor." }
      - { de: "where T : class — Referenztypen haben immer einen Standardkonstruktor.", en: "where T : class — Reference types always have a default constructor." }
      - { de: "where T : IComparable<T> — ein vergleichbarer Typ hat immer einen öffentlichen Konstruktor.", en: "where T : IComparable<T> — a comparable type always has a public constructor." }
    correct: [0]
    explanation: { de: "new() verlangt für jede Konkretisierung einen öffentlichen parameterfreien Konstruktor; erst damit erlaubt der Compiler new T(). class reicht nicht: Eine Klasse kann etwa nur Konstruktoren mit Parametern haben oder abstrakt sein. Ein Interface wie IComparable<T> sagt nichts über Konstruktoren. (where T : struct schließt new() übrigens ein.) Die Einschränkungsarten aus 8.2.2 (Seite 595): Basisklasse, Interfaces, class, struct, new(); daneben kennt C# notnull (kommt in 15.1.1) und unmanaged (nicht im Buch). Mehrere werden mit Komma kombiniert; class/struct stehen zuerst, new() zuletzt.", en: "new() demands a public parameterless constructor for every type argument; only then does the compiler allow new T(). class is not enough: a class may, for example, have only constructors with parameters, or be abstract. An interface such as IComparable<T> says nothing about constructors. (where T : struct implies new(), by the way.) The kinds of constraint from 8.2.2 (page 595): base class, interfaces, class, struct, new(); C# also knows notnull (comes in 15.1.1) and unmanaged (not in the book). Several are combined with commas; class/struct come first, new() last." }
