id: generics-max-serienparameter
title: { de: "Max<T>() mit generischem Serienparameter", en: "Max<T>() with a generic series parameter" }
reading:
  section: "8.5"
  title: { de: "Generische Methoden", en: "Generic Methods" }
  printedPage: 602
teaches:
  - generics.params
  - generics.constraint-kinds
requires:
  - generics.method
  - generics.constraint-icomparable
  - generics.nullable-value
  - methods.parameters
  - control.for
items:
  - type: coding
    id: serie
    openFile: "Serie/Serie.cs"
    openLine: 3
    testProject: "Serie Tests/Serie.Tests.csproj"
  - type: multipleChoice
    id: constraint-arten
    prompt: { de: "Welche Einschränkung erlaubt new T() innerhalb einer generischen Klasse?", en: "What restriction does `new T()` allow within a generic class?" }
    options:
      - { de: "where T : new() — T muss einen öffentlichen parameterlosen Konstruktor haben.", en: "where T : new() — T must have a public, parameterless constructor." }
      - { de: "where T : class — Referenztypen haben immer einen Standardkonstruktor.", en: "where T : class — Reference types always have a default constructor." }
      - { de: "where T : struct — Strukturen lassen sich immer erzeugen, Klassen nicht.", en: "where T : struct — Structures can always be created, but classes cannot." }
    correct: [0]
    explanation: { de: "Die Einschränkungsarten aus 8.2.2 (Seite 593): Basisklasse, Interface, class, struct, new(), notnull, unmanaged. Mehrere werden mit Komma kombiniert; class/struct stehen zuerst, new() zuletzt.", en: "The restriction types from 8.2.2 (page 593): base class, interface, class, struct, new(), notnull, unmanaged. Multiple types are separated by commas; class and struct come first, and new() comes last." }
