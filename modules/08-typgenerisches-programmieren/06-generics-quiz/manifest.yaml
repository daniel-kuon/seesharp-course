id: generics-quiz
title: { de: "Generics-Quiz: Werttypen, Varianz, Vererbung", en: "Generics Quiz: Value Types, Variance, Inheritance" }
reading:
  section: "8.8"
  title: { de: "Übungsaufgaben zum Kapitel 8", en: "Exercises for Chapter 8" }
  printedPage: 607
teaches:
  - generics.invariance
  - generics.inheritance
requires:
  - generics.class-declare
  - generics.method
  - generics.default
  - inheritance.derive-class
  - structs.boxing
items:
  - type: multipleChoice
    id: werttyp-argument
    prompt: { de: "Darf ein Typformalparameter durch einen Werttyp konkretisiert werden, z. B. SimpleStack<int>?", en: "Can a type formal parameter be instantiated with a value type, e.g., `SimpleStack<int>`?" }
    options:
      - { de: "Ja; für jeden Werttyp erzeugt die Laufzeit eine eigene Konkretisierung ohne Boxing.", en: "Yes; for each value type, the runtime creates a separate constructed type without boxing." }
      - { de: "Nein; Typargumente müssen Klassen sein.", en: "No; type arguments must be classes." }
      - { de: "Nur, wenn die Klasse where T : struct deklariert.", en: "Only if the class is declared as `where T : struct`." }
    correct: [0]
    explanation: { de: "8.8 Aufgabe 1, Aussage 1 ist richtig. Genau das ist der Vorteil gegenüber ArrayList (Aufgabe 2). Typargumente müssen keine Klassen sein, und where T : struct ist keine Voraussetzung, sondern würde umgekehrt nur Werttypen zulassen.", en: "8.8 Exercise 1, Statement 1 is correct. That is precisely the advantage over ArrayList (Exercise 2). Type arguments need not be classes, and where T : struct is not a prerequisite; it would instead allow only value types." }
  - type: multipleChoice
    id: generische-methode
    prompt: { de: "Eine Methode einer generischen Klasse verwendet den Typformalparameter T aus dem Klassenkopf als Rückgabetyp (z. B. T Pop()). Ist Pop eine generische Methode?", en: "A method of a generic class uses the type parameter T from the class header as its return type (e.g., T Pop()). Is Pop a generic method?" }
    options:
      - { de: "Nein; eine generische Methode hat einen eigenen Typformalparameter in ihrem Kopf, etwa Max<T>(...).", en: "No; a generic method has its own type formal parameter in its header, such as Max<T>(...)." }
      - { de: "Ja; jede Methode, in der T vorkommt, ist generisch.", en: "Yes; any method that includes T is generic." }
    correct: [0]
    explanation: { de: "8.8 Aufgabe 1, Aussage 2 ist falsch. Pop benutzt nur den Parameter seiner Klasse (8.5, Seite 602).", en: "8.8 Exercise 1, Statement 2 is incorrect. Pop uses only the parameter of its class (8.5, page 602)." }
  - type: multipleChoice
    id: invarianz
    prompt: { de: "List<object> lo = new List<string>(); Kompiliert das, weil object Basisklasse von string ist?", en: "`List<object> lo = new List<string>();` Does that compile, because `object` is the base class of `string`?" }
    options:
      - { de: "Nein. Generische Klassen sind invariant: List<string> ist keine List<object>, sonst könnte man über lo ein int in die String-Liste legen.", en: "No. Generic classes are invariant: `List<string>` is not a `List<object>`; otherwise, you could use `lo` to add an `int` to the list of strings." }
      - { de: "Ja; Vererbung überträgt sich auf Typargumente.", en: "Yes; inheritance applies to type arguments." }
      - { de: "Ja, aber nur mit einem expliziten Cast.", en: "Yes, but only with an explicit cast." }
    correct: [0]
    explanation: { de: "8.8 Aufgabe 1, Aussage 3 ist falsch (8.2.3, Seite 597). Auch ein expliziter Cast hilft nicht, (List<object>)ls ist ebenfalls ein Compilerfehler. Typformalparameter können nur bei Interfaces und Delegaten ko- oder kontravariant sein (9.1.5, Level 9; 10.1.6, Level 12). Arrays sind dagegen kovariant, mit dem Risiko einer ArrayTypeMismatchException zur Laufzeit (Seite 597).", en: "8.8 Exercise 1, Statement 3 is incorrect (8.2.3, page 597). An explicit cast does not help either; (List<object>)ls is a compiler error too. Type parameters can be co- or contravariant only in interfaces and delegates (9.1.5, Level 9; 10.1.6, Level 12). Arrays, by contrast, are covariant, at the risk of an ArrayTypeMismatchException at run time (page 597)." }
  - type: multipleChoice
    id: vererbung
    prompt: { de: "Darf eine generische Klasse von einer nicht-generischen Klasse abstammen, z. B. class Lager<T> : Basis?", en: "May a generic class derive from a non-generic class, e.g. `class Lager<T> : Basis`?" }
    options:
      - { de: "Ja; umgekehrt darf eine nicht-generische Klasse auch von einer konkretisierten generischen Klasse erben (class IntLager : Lager<int>).", en: "Yes; conversely, a non-generic class may also inherit from a concretized generic class (class IntLager : Lager<int>)." }
      - { de: "Nein; generische und nicht-generische Klassen bilden getrennte Hierarchien.", en: "No; generic and non-generic classes form separate hierarchies." }
    correct: [0]
    explanation: { de: "8.8 Aufgabe 1, Aussage 4 ist richtig; die Regeln stehen in 8.2.3 (Seite 596). Eine offene generische Basis (: Lager<T>) braucht einen eigenen Typformalparameter in der abgeleiteten Klasse.", en: "8.8 Exercise 1, Statement 4 is correct; the rules are given in 8.2.3 (page 596). An open generic base class (: Lager<T>) requires its own type formal parameter in the derived class." }
  - type: multipleChoice
    id: laufzeittyp
    prompt: { de: "typeof(SimpleStack<int>) == typeof(SimpleStack<string>) — was liefert der Vergleich?", en: "typeof(SimpleStack<int>) == typeof(SimpleStack<string>) — what does this comparison return?" }
    options:
      - { de: "false: jede Konkretisierung ist zur Laufzeit ein eigener Typ; nur typeof(SimpleStack<>) bezeichnet die offene Definition.", en: "false: Each instantiation is a separate type at runtime; only `typeof(SimpleStack<>)` refers to the open definition." }
      - { de: "true: beide stammen aus derselben Klassendefinition.", en: "true: Both come from the same class definition." }
    correct: [0]
    explanation: { de: "8.4 Generische Typen zur Laufzeit (Seite 601). Statische Felder existieren deshalb pro Konkretisierung getrennt.", en: "8.4 Generic Types at Runtime (page 601). Static fields therefore exist separately for each instantiation." }
  - type: multipleChoice
    id: arraylist
    prompt: { de: "Warum ist List<int> beim Einfügen von einer Million int-Werten deutlich schneller als ArrayList?", en: "Why is `List<int>` significantly faster than `ArrayList` when inserting one million `int` values?" }
    options:
      - { de: "ArrayList speichert object; jedes int wird beim Einfügen geboxt und beim Lesen entpackt. List<int> speichert die Werte direkt.", en: "An ArrayList stores objects; each int is boxed when inserted and unboxed when read. A List<int> stores the values directly." }
      - { de: "ArrayList ist nicht threadsicher.", en: "ArrayList is not thread-safe." }
      - { de: "List<int> hat eine feste Größe und muss nie wachsen.", en: "List<int> has a fixed size and never needs to grow." }
    correct: [0]
    explanation: { de: "8.8 Aufgabe 2 misst das mit Stopwatch (Sample Listenwerte); Boxing ist aus 6.1.6 bekannt. Dass ArrayList nicht threadsicher ist, stimmt zwar, erklärt aber keinen Zeitunterschied (List<T> ist es auch nicht). Und List<int> wächst genauso dynamisch wie ArrayList.", en: "8.8 Exercise 2 measures this with a Stopwatch (sample Listenwerte); boxing is known from 6.1.6. ArrayList is indeed not thread-safe, but that explains no time difference (List<T> is not thread-safe either). And List<int> grows just as dynamically as ArrayList." }
  - type: multipleChoice
    id: default-klasse
    prompt: { de: "In einer generischen Klasse steht T x = default; Was enthält x, wenn T mit einer Klasse konkretisiert wurde?", en: "In a generic class, T x = default; what does x contain if T has been made concrete with a class?" }
    options:
      - { de: "null", en: "null" }
      - { de: "Ein Objekt, das mit dem Standardkonstruktor erzeugt wurde.", en: "An object created using the default constructor." }
      - { de: "Compilerfehler ohne where T : new().", en: "Compiler error without `where T : new()`." }
    correct: [0]
    explanation: { de: "default liefert für Referenztypen null, für Werttypen den typspezifischen Nullwert (8.7, Seite 605); das gilt ohne jede Einschränkung. Ein Objekt erzeugt nur new T() mit der Einschränkung new().", en: "`default` returns `null` for reference types and the type-specific zero value for value types (8.7, page 605); this works without any constraint. Only `new T()`, with the constraint `new()`, creates an object." }
