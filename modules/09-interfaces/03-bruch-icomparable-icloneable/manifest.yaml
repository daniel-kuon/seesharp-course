id: interfaces-bruch-icomparable-icloneable
title: { de: "Bruch implementiert IComparable<T> und ICloneable", en: "Bruch implements IComparable<T> and ICloneable" }
reading:
  section: "9.2.1"
  title: { de: "Beispiel IComparable<T>", en: "Example: IComparable<T>" }
  printedPage: 640
teaches:
  - interfaces.icomparable
  - interfaces.icloneable
  - oop.memberwise-clone
requires:
  - interfaces.implement
  - interfaces.multiple
  - oop.clone-method
  - oop.tostring-override
  - arrays.array-class
items:
  - type: coding
    id: bruch
    openFile: "b10 IComparable, ICloneable/Bruch.cs"
    openLine: 3
    testProject: "b10 Tests/b10.Tests.csproj"
  - type: multipleChoice
    id: klone-vs-clone
    prompt: { de: "Warum bleibt die eigene Methode Bruch Klone() neben object Clone() sinnvoll?", en: "Why does it still make sense to use the custom method `Bruch Klone()` alongside `object Clone()`?" }
    options:
      - { de: "Klone() liefert eine Bruch-Referenz; Clone() liefert object und zwingt den Aufrufer zu einem Cast.", en: "`Klone()` returns a `Bruch` reference; `Clone()` returns `object` and forces the caller to cast." }
      - { de: "Clone() darf nur von Array.Sort aufgerufen werden.", en: "Clone() may only be called by Array.Sort." }
      - { de: "Klone() ist schneller, weil sie kein Interface benutzt.", en: "`Klone()` is faster because it does not use an interface." }
    correct: [0]
    explanation: { de: "9.6 Aufgabe 1 (Seite 655) weist genau darauf hin: Klone() liefert eine Bruch-Referenz, sorgt für Typsicherheit und erspart Typumwandlungen; zu ICloneable gibt es keine generische Alternative (Seite 611). Clone() darf jeder aufrufen, und mit Geschwindigkeit hat die Entscheidung nichts zu tun.", en: "9.6 Exercise 1 (page 655) points this out explicitly: `Klone()` returns a `Bruch` reference, ensures type safety and saves casts; there is no generic alternative to `ICloneable` (page 611). Anyone may call `Clone()`, and the decision has nothing to do with speed." }
