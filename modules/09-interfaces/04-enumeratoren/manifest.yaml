id: interfaces-enumeratoren
title: { de: "IEnumerable<T> und ein handgeschriebener IEnumerator<T>", en: "IEnumerable<T> and a custom IEnumerator<T>" }
reading:
  section: "9.5"
  title: { de: "IEnumerable<T> und IEnumerator<T>", en: "IEnumerable<T> and IEnumerator<T>" }
  printedPage: 647
teaches:
  - interfaces.ienumerable
  - interfaces.ienumerator-manual
requires:
  - interfaces.explicit
  - interfaces.implement
  - generics.constraint-icomparable
  - algo.insertion-sort
  - control.foreach
  - oop.nested-class
  - oop.nested-private-access
items:
  - type: coding
    id: enumerator
    openFile: "Enumeratoren/SimpleSortedList.cs"
    openLine: 37
    testProject: "Enumeratoren Tests/Enumeratoren.Tests.csproj"
  - type: multipleChoice
    id: foreach-protokoll
    prompt: { de: "Was tut foreach (var x in liste) hinter den Kulissen?", en: "What does `foreach (var x in liste)` do behind the scenes?" }
    options:
      - { de: "Es ruft liste.GetEnumerator() auf und wiederholt MoveNext(); solange das true liefert, ist x der Wert von Current.", en: "It calls `liste.GetEnumerator()` and repeats `MoveNext()`; as long as that returns `true`, `x` is the value of `Current`." }
      - { de: "Es greift über den Indexer von 0 bis Count - 1 zu.", en: "It accesses the elements via the indexer from 0 to Count - 1." }
      - { de: "Es kopiert die Liste in ein Array und läuft darüber.", en: "It copies the list into an array and iterates through it." }
    correct: [0]
    explanation: { de: "9.5.1 (Seite 649). Deshalb reicht IEnumerable<T>, damit foreach über jeden eigenen Typ laufen kann; ein Indexer ist dafür nicht nötig, und kopiert wird nichts: Der Enumerator liefert die Elemente erst auf Anforderung.", en: "9.5.1 (page 649). Therefore, IEnumerable<T> is sufficient for foreach to iterate over any custom type; no indexer is needed, and nothing is copied: the enumerator delivers the elements only on request." }
