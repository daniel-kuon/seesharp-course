id: interfaces-quiz
title: { de: "Interfaces-Quiz: Deklaration, abstrakte Klassen, Varianz", en: "Interfaces Quiz: Declaration, Abstract Classes, Variance" }
reading:
  section: "9.1.5"
  title: { de: "Ko- und Kontravarianz von Typformalparametern in generischen Interfaces", en: "Covariance and Contravariance of Type Formal Parameters in Generic Interfaces" }
  printedPage: 634
teaches:
  - interfaces.declare
  - interfaces.vs-abstract-class
  - interfaces.default-member
  - generics.covariance
  - generics.contravariance
requires:
  - interfaces.implement
  - interfaces.icomparable
  - interfaces.ienumerable
  - inheritance.abstract-class
  - generics.invariance
items:
  - type: multipleChoice
    id: deklaration
    prompt: { de: "Welche Aussage über die Deklaration eines Interfaces ist richtig?", en: "Which statement about the declaration of an interface is correct?" }
    options:
      - { de: "Mitglieder ohne Rumpf sind implizit public und abstrakt; Instanzfelder sind nicht erlaubt; statische Felder und Mitglieder mit Implementierung gibt es seit C# 8, statische abstrakte Mitglieder seit C# 11.", en: "Members without a body are implicitly public and abstract; instance fields are not allowed; static fields and members with an implementation exist since C# 8, static abstract members since C# 11." }
      - { de: "Mitglieder sind implizit private, damit nur implementierende Klassen sie sehen.", en: "Members are implicitly private, so only implementing classes can see them." }
      - { de: "Ein Interface darf Instanzfelder deklarieren, die jede implementierende Klasse erbt.", en: "An interface may declare instance fields that are inherited by every class that implements it." }
    correct: [0]
    explanation: { de: "9.1 (Seite 614 und 615) und 9.1.2 (Seite 622 und 623). Voreingestellt ist public, nicht private; Instanzfelder sind verboten. Ein Interface beschreibt Fähigkeiten, keinen Zustand.", en: "9.1 (pages 614 and 615) and 9.1.2 (pages 622 and 623). The default is public, not private; instance fields are forbidden. An interface describes capabilities, not state." }
  - type: multipleChoice
    id: vs-abstrakt
    prompt: { de: "Worin unterscheiden sich Interfaces von abstrakten Klassen? (9.6 Aufgabe 2)", en: "How do interfaces differ from abstract classes? (9.6 Exercise 2)" }
    options:
      - { de: "Eine Klasse erbt von genau einer Basisklasse, kann aber beliebig viele Interfaces implementieren; Interfaces haben keine Instanzfelder und keine Konstruktoren, abstrakte Klassen können Zustand und Implementierung an Erben weitergeben; Strukturen können Interfaces implementieren, aber nicht von Klassen erben.", en: "A class inherits from exactly one base class but can implement any number of interfaces; interfaces have no instance fields and no constructors; abstract classes can pass state and implementation to their subclasses; structures can implement interfaces but cannot inherit from a class." }
      - { de: "Es gibt keinen Unterschied; Interfaces sind abstrakte Klassen ohne das Schlüsselwort class.", en: "There is no difference; interfaces are abstract classes without the keyword \"class.\"" }
      - { de: "Abstrakte Klassen dürfen keine Implementierung enthalten, Interfaces schon.", en: "Abstract classes cannot contain an implementation, but interfaces can." }
    correct: [0]
    explanation: { de: "Faustregel: abstrakte Klasse für eine ist-ein-Hierarchie mit gemeinsamem Code, Interface für eine Fähigkeit, die quer durch Hierarchien geht (IComparable<T>, IEnumerable<T>). Abstrakte Klassen dürfen sehr wohl Implementierung enthalten (Level 7), und ein Interface ist keine Klasse: keine Instanzfelder, keine Konstruktoren, Mehrfachimplementierung erlaubt (9.1.4.3, Seite 634).", en: "Rule of thumb: Use an abstract class for an \"is-a\" hierarchy with shared code, and an interface for a capability that cuts across hierarchies (IComparable<T>, IEnumerable<T>). Abstract classes may well contain implementation (Level 7), and an interface is not a class: no instance fields, no constructors, multiple implementation allowed (9.1.4.3, page 634)." }
  - type: multipleChoice
    id: default-member
    prompt: { de: "interface ILogger { void Log(string s); void LogError(string s) => Log(\"FEHLER: \" + s); } — Muss eine implementierende Klasse LogError implementieren?", en: "interface ILogger { void Log(string s); void LogError(string s) => Log(\"ERROR: \" + s); } — Does a class that implements this interface have to implement LogError?" }
    options:
      - { de: "Nein; LogError hat eine Standardimplementierung. Sie ist aber nur über eine ILogger-Referenz aufrufbar, nicht über die Klasse selbst.", en: "No; LogError has a default implementation. However, it can only be called via an ILogger reference, not via the class itself." }
      - { de: "Ja; jedes Interface-Mitglied muss implementiert werden.", en: "Yes; every interface member must be implemented." }
      - { de: "Der Code kompiliert nicht, weil Interfaces keine Rümpfe enthalten dürfen.", en: "The code won't compile because interfaces are not allowed to contain bodies." }
    correct: [0]
    explanation: { de: "Konkrete Schnittstellenmitglieder (9.1.1.2, Seite 616) gibt es seit C# 8; nur Mitglieder ohne Rumpf müssen implementiert werden. So lässt sich ein Interface nachträglich erweitern, ohne alle Implementierungen zu brechen. Ohne eigene Definition ist LogError nur über eine Interface-Referenz aufrufbar (9.1.4.3, Seite 634).", en: "Concrete interface members (9.1.1.2, page 616) exist since C# 8; only members without a body must be implemented. This allows an interface to be extended later without breaking all implementations. Without its own definition, LogError can be called only through an interface reference (9.1.4.3, page 634)." }
  - type: multipleChoice
    id: kovarianz
    prompt: { de: "static double SmallestX(IEnumerable<Figur> li) wird mit einer List<Kreis> aufgerufen. Kreis erbt von Figur. Kompiliert das?", en: "static double SmallestX(IEnumerable<Figur> li) is called with a List<Kreis>. Kreis inherits from Figur. Will this compile?" }
    options:
      - { de: "Ja: IEnumerable<out T> ist kovariant; eine Folge von Kreisen darf als Folge von Figuren gelesen werden, weil T nur herausgegeben wird.", en: "Yes: `IEnumerable<out T>` is covariant; a sequence of circles can be interpreted as a sequence of shapes because `T` is only output." }
      - { de: "Nein: generische Typen sind invariant, wie bei List<T>.", en: "No: generic types are invariant, as in `List<T>`." }
      - { de: "Nur mit einem expliziten Cast (IEnumerable<Figur>)listeK.", en: "Only with an explicit cast (IEnumerable<Figur>)listeK." }
    correct: [0]
    explanation: { de: "9.1.5.1 (Seite 637). Das out im Interface erlaubt die Zuweisung, und zwar implizit, ein Cast ist unnötig; bei List<T> (Klasse, T auch als Eingabe) wäre sie unsicher und ist verboten.", en: "9.1.5.1 (page 637). The `out` keyword in the interface allows the assignment, implicitly, so no cast is needed; with `List<T>` (a class, where `T` is also an input type), the assignment would be unsafe and is forbidden." }
  - type: multipleChoice
    id: kontravarianz
    prompt: { de: "Figur implementiert IComparable<Figur>; Kreis : Figur hat keine eigene Implementierung. Warum funktioniert listeK.Sort() für eine List<Kreis> trotzdem?", en: "`Figur` implements `IComparable<Figur>`; `Kreis : Figur` has no implementation of its own. Why does `listeK.Sort()` still work for a `List<Kreis>`?" }
    options:
      - { de: "IComparable<in T> ist kontravariant: Ein Vergleicher für Figuren kann auch Kreise vergleichen, weil T nur als Eingabe vorkommt; Kreis erbt die Implementierung von Figur.", en: "`IComparable<in T>` is contravariant: A comparer for `Figur` objects can also compare `Kreis` objects, because `T` occurs only as an input; `Kreis` inherits the implementation from `Figur`." }
      - { de: "Sort vergleicht nur die Objektadressen.", en: "Sort compares only the object addresses." }
      - { de: "Es funktioniert nicht; der Aufruf wirft InvalidOperationException.", en: "It doesn't work; the call throws an InvalidOperationException." }
    correct: [0]
    explanation: { de: "9.1.5.2 (Seite 638) und 9.2.2 (Seite 642, Erben von Schnittstellenimplementationen). Sort vergleicht per CompareTo, nicht per Adresse, und wirft InvalidOperationException nur, wenn der Elementtyp weder IComparable<T> noch IComparable erfüllt (Seite 641).", en: "9.1.5.2 (page 638) and 9.2.2 (page 642, Inheriting Interface Implementations). Sort compares with CompareTo, not by address, and throws InvalidOperationException only if the element type satisfies neither IComparable<T> nor IComparable (page 641)." }
  - type: multipleChoice
    id: in-out-regel
    prompt: { de: "Warum darf ein Typformalparameter, der sowohl als Parametertyp als auch als Rückgabetyp vorkommt (z. B. in IList<T>), weder in noch out sein?", en: "Why can't a type formal parameter that appears as both a parameter type and a return type (e.g., in IList<T>) be either \"in\" or \"out\"?" }
    options:
      - { de: "Kovarianz wäre beim Hineinschreiben unsicher (eine Figur in eine Kreis-Liste), Kontravarianz beim Herauslesen; also bleibt nur Invarianz.", en: "Covariance would be unsafe when writing (a `Figur` into a `Kreis` list), contravariance when reading; so only invariance remains." }
      - { de: "Weil Klassen keine Varianz unterstützen und IList<T> von List<T> abgeleitet ist.", en: "Because classes do not support variance, and IList<T> is derived from List<T>." }
      - { de: "Es dürfte schon, der Compiler erlaubt es nur aus historischen Gründen nicht.", en: "It should be allowed; the compiler just doesn't allow it for historical reasons." }
    correct: [0]
    explanation: { de: "out nur für Ausgabepositionen, in nur für Eingabepositionen (9.1.5.1 und 9.1.5.2, Seite 637 und 638). Das ist eine Frage der Typsicherheit, keine historische Laune; und IList<T> ist ein Interface, das List<T> implementiert, nicht umgekehrt.", en: "\"out\" only for output positions, \"in\" only for input positions (9.1.5.1 and 9.1.5.2, pages 637 and 638). This is a matter of type safety, not a historical whim; and IList<T> is an interface that List<T> implements, not the other way round." }
  - type: multipleChoice
    id: struktur-interface
    prompt: { de: "struct Punkt : IComparable<Punkt> — warum ist die generische Schnittstelle hier besser als das alte IComparable mit CompareTo(object)?", en: "`struct Punkt : IComparable<Punkt>` — why is the generic interface better here than the old `IComparable` with `CompareTo(object)`?" }
    options:
      - { de: "CompareTo(object) würde den Punkt bei jedem Aufruf boxen; die generische Fassung arbeitet typsicher und ohne Boxing.", en: "`CompareTo(object)` would box the `Punkt` on every call; the generic version works type-safely and without boxing." }
      - { de: "Strukturen können das nicht-generische IComparable nicht implementieren.", en: "Structures cannot implement the non-generic IComparable interface." }
      - { de: "Es gibt keinen Unterschied außer der Schreibweise.", en: "There is no difference other than the spelling." }
    correct: [0]
    explanation: { de: "9.2.3 Vorteile generischer Schnittstellen (Seite 642) und 9.3.2 (Seite 645).", en: "9.2.3 Advantages of Generic Interfaces (page 642) and 9.3.2 (page 645)." }
