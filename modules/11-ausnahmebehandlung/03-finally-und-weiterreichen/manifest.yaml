id: ausnahmen-finally-und-weiterreichen
title: { de: "finally, erneutes Werfen und Verpacken", en: "finally, Rethrowing, and Wrapping" }
reading:
  section: "13.3.1.3"
  title: { de: "Aufräumarbeiten im finally-Block", en: "Cleanup in the finally block" }
  printedPage: 895
teaches:
  - exceptions.finally
  - exceptions.rethrow
  - exceptions.inner-exception
  - exceptions.catch-when
requires:
  - exceptions.try-catch
  - exceptions.catch-specific
  - exceptions.catch-variable
  - exceptions.throw
  - interfaces.as-type
items:
  - type: coding
    id: ablauf
    openFile: "Ablaeufe/Ablauf.cs"
    openLine: 13
    testProject: "Ablaeufe Tests/Ablaeufe.Tests.csproj"
  - type: multipleChoice
    id: reihenfolge
    prompt: { de: "Welche Ausgabe erzeugt das Programm aus der Aufgabenbeschreibung (Abschnitt „Quizlisting: Verschachtelte try-Anweisungen“)?", en: "What output does the program generate based on the problem description (section “Quiz Listing: Nested try Statements”)?" }
    options:
      - { de: "A1 B1 B3 A3 M2 M3 M4", en: "A1 B1 B3 A3 M2 M3 M4" }
      - { de: "A1 B1 B2 B3 A3 M2 M3 M4", en: "A1 B1 B2 B3 A3 M2 M3 M4" }
      - { de: "A1 B1 B3 A3 M3 M2 M4", en: "A1 B1 B3 A3 M3 M2 M4" }
      - { de: "A1 B1 M2 M3 M4", en: "A1 B1 M2 M3 M4" }
    correct: [0]
    explanation: { de: "Die InvalidOperationException passt nicht zu catch (ArgumentException) in B(); B3 läuft trotzdem, A() hat keinen catch, aber sein finally (A3) wird beim Verlassen ausgeführt. Dann fängt Main() die Ausnahme (M2), sein finally läuft (M3) und danach geht es hinter der try-Anweisung weiter (M4); A2 und M1 werden nie erreicht (13.3.2, Seite 899).", en: "The InvalidOperationException does not match the catch (ArgumentException) in B(); B3 runs anyway, A() has no catch block, but its finally block (A3) is executed upon exit. Then Main() catches the exception (M2), its finally block runs (M3), and execution continues after the try statement (M4); A2 and M1 are never reached (13.3.2, page 899)." }
  - type: multipleChoice
    id: throw-ex
    prompt: { de: "Was ist der Unterschied zwischen throw; und throw ex; in einem catch-Block?", en: "What is the difference between `throw;` and `throw ex;` in a `catch` block?" }
    options:
      - { de: "throw; reicht dieselbe Ausnahme samt ursprünglichem Stack Trace weiter; throw ex; wirft sie neu, und der Stack Trace beginnt erst an dieser Stelle (der eigentliche Ursprung geht verloren).", en: "throw; passes on the same exception along with the original stack trace; throw ex; rethrows it, and the stack trace begins anew at this point (the original source is lost)." }
      - { de: "Es gibt keinen Unterschied, throw; ist nur eine Kurzschreibweise.", en: "There is no difference; throw; is just a shorthand notation." }
      - { de: "throw ex; erhält den Stack Trace, throw; verwirft ihn.", en: "throw ex; preserves the stack trace; throw; discards it." }
    correct: [0]
    explanation: { de: "13.6 (Seite 914): Zum Weiterreichen nimmt man throw;. Wer die Ursache in eine andere Ausnahme packt, gibt die ursprüngliche als InnerException mit und verliert so nichts.", en: "13.6 (page 914): To pass it on, use `throw;`. If you wrap the cause in another exception, you pass the original one as an `InnerException`, so nothing is lost." }
