id: delegaten-grundlagen
title: { de: "Delegaten deklarieren, erzeugen und aufrufen" }
reading:
  section: "10.1.1"
  title: { de: "Delegatentypen definieren" }
  printedPage: 659
teaches:
  - delegates.declare-type
  - delegates.create-invoke
  - delegates.parameter
requires:
  - methods.parameters
  - methods.declare-static
  - oop.method-instance
  - interfaces.as-type
  - statics.method
items:
  - type: coding
    id: rechner
    openFile: "Delegaten/Rechner.cs"
    openLine: 1
    testProject: "Delegaten Tests/Delegaten.Tests.csproj"
  - type: multipleChoice
    id: signatur
    prompt: { de: "Ein Delegatentyp ist als delegate double Operation(double a, double b); deklariert. Welche Methode passt zu ihm?" }
    options:
      - { de: "static double Addiere(double x, double y) { return x + y; }" }
      - { de: "static void Addiere(double x, double y) { }" }
      - { de: "static double Addiere(double x) { return x; }" }
    correct: [0]
    explanation: { de: "Entscheidend sind Parameterliste und Rückgabetyp (10.1.1, Seite 659); die Namen der Parameter und der Methode spielen keine Rolle." }
  - type: multipleChoice
    id: instanz-ziel
    prompt: { de: "Ein Delegatenobjekt wird aus einer Instanzmethode erzeugt (new Operation(r.Potenz)). Danach ändert sich das Feld r.Exponent. Was gilt beim Aufruf des Delegaten?" }
    options:
      - { de: "Das Delegatenobjekt merkt sich das Zielobjekt r; der Aufruf sieht den neuen Wert von Exponent." }
      - { de: "Das Delegatenobjekt hat eine Kopie von r angelegt; der Aufruf sieht noch den alten Wert." }
      - { de: "Das Delegatenobjekt merkt sich nur den Methodennamen und sucht das Objekt bei jedem Aufruf neu." }
    correct: [0]
    explanation: { de: "Ein Delegatenobjekt speichert Zielobjekt (bei Instanzmethoden) und Methode (10.1.2, Seite 660); das Objekt wird nicht kopiert." }
  - type: review
    id: eigener-delegat
    prompt: { de: "Deklariere in Operation.cs einen zweiten Delegatentyp Bedingung für Methoden mit einem double-Parameter und dem Rückgabetyp bool. Schreibe in Rechner eine Methode Zaehle(double[] werte, Bedingung b), die zählt, wie viele Werte die Bedingung erfüllen, und rufe sie mit einer Methodengruppe auf. Erkläre der Betreuung, was new Bedingung(Methode) zur Laufzeit erzeugt." }
    openFile: "Delegaten/Operation.cs"
