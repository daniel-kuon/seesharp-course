id: delegaten-mehrfachdelegaten
title: { de: "Mehrfachdelegaten", en: "Multiple delegates" }
reading:
  section: "10.1.3"
  title: { de: "Delegatenobjekte kombinieren", en: "Combining Delegate Objects" }
  printedPage: 663
teaches:
  - delegates.multicast
  - delegates.null-conditional-invoke
requires:
  - delegates.create-invoke
  - delegates.parameter
  - collections.list-add-remove
items:
  - type: coding
    id: verteiler
    openFile: "Mehrfach/Verteiler.cs"
    openLine: 1
    testProject: "Mehrfach Tests/Mehrfach.Tests.csproj"
  - type: multipleChoice
    id: rueckgabe
    prompt: { de: "Ein Delegat mit drei Zielmethoden, die int zurückgeben, wird aufgerufen. Was liefert der Aufruf?", en: "A delegate with three target methods that return `int` is called. What does the call return?" }
    options:
      - { de: "Den Rückgabewert der zuletzt ausgeführten Methode; die Werte der anderen gehen verloren.", en: "The return value of the last method executed; the values of the others are lost." }
      - { de: "Die Summe aller drei Rückgabewerte.", en: "The sum of all three return values." }
      - { de: "Ein Array mit allen drei Rückgabewerten.", en: "An array containing all three return values." }
    correct: [0]
    explanation: { de: "Bei einem Rückgabewert dominiert die zuletzt ausgeführte Methode (10.1.3, Seite 664). Wer alle Werte braucht, durchläuft GetInvocationList().", en: "In the case of a return value, the most recently executed method takes precedence (10.1.3, page 664). To obtain all values, call `GetInvocationList()`." }
  - type: multipleChoice
    id: leere-liste
    prompt: { de: "Was ist der Wert einer Delegatenvariablen, nachdem die letzte Methode aus ihrer Aufrufliste mit -= entfernt wurde?", en: "What is the value of a delegate variable after the last method in its call list has been removed using -=?" }
    options:
      - { de: "null; der Aufruf muss deshalb mit ?.Invoke() oder einer null-Prüfung geschützt werden.", en: "null; the call must therefore be protected using ?.Invoke() or a null check." }
      - { de: "Ein leeres Delegatenobjekt; der Aufruf tut nichts.", en: "An empty delegate object; the call does nothing." }
      - { de: "Der Aufruf von -= wirft eine Ausnahme.", en: "Calling -= throws an exception." }
    correct: [0]
    explanation: { de: "Beim Entleeren der Aufrufliste entsteht kein leeres Delegatenobjekt, sondern null (10.1.3, Seite 664).", en: "When clearing the call list, a null value is returned instead of an empty delegate object (10.1.3, page 664)." }
