id: delegaten-lambdas-und-praedikate
title: { de: "Lambda-Ausdrücke und Prädikate", en: "Lambda Expressions and Predicates" }
reading:
  section: "10.1.5.2"
  title: { de: "Lambda-Ausdrücke", en: "Lambda expressions" }
  printedPage: 667
teaches:
  - lambdas.expression
  - lambdas.statement
  - delegates.predicate
  - lambdas.list-predicate-methods
requires:
  - delegates.create-invoke
  - delegates.parameter
  - collections.list-sort
  - collections.list-remove-while-iterating
  - strings.methods
items:
  - type: coding
    id: filter
    openFile: "Lambdas/Filter.cs"
    openLine: 1
    testProject: "Lambdas Tests/Lambdas.Tests.csproj"
  - type: multipleChoice
    id: typ-praedikat
    prompt: { de: "Zu welchem Delegatentyp passt das Lambda  x => x > 3  in  list.Exists(x => x > 3)  mit list vom Typ List<int>?", en: "What type of delegate does the lambda expression `x => x > 3` in `list.Exists(x => x > 3)` correspond to, given that `list` is of type `List<int>`?" }
    options:
      - { de: "Predicate<int>", en: "Predicate<int>" }
      - { de: "Comparison<int>", en: "Comparison<int>" }
      - { de: "Action<int>", en: "Action<int>" }
      - { de: "Func<int, int, int>", en: "Func<int, int, int>" }
    correct: [0]
    explanation: { de: "Exists erwartet ein Predicate<T>: ein Argument vom Typ T, Rückgabetyp bool (10.3 Aufgabe 2, Seite 688). Comparison<int> und Func<int, int, int> haben zwei Parameter und liefern int, Action<int> liefert nichts.", en: "`Exists` expects a `Predicate<T>`: an argument of type `T`, with a return type of `bool` (10.3 Exercise 2, page 688). `Comparison<int>` and `Func<int, int, int>` take two parameters and return `int`; `Action<int>` returns nothing." }
  - type: multipleChoice
    id: typ-vergleich
    prompt: { de: "Zu welchem Delegatentyp passt das Lambda  (a, b) => a.Length - b.Length  in  wörter.Sort((a, b) => a.Length - b.Length)  mit wörter vom Typ List<string>?", en: "Which delegate type does the lambda `(a, b) => a.Length - b.Length` fit in `wörter.Sort((a, b) => a.Length - b.Length)`, with `wörter` of type `List<string>`?" }
    options:
      - { de: "Comparison<string>", en: "Comparison<string>" }
      - { de: "Predicate<string>", en: "Predicate<string>" }
      - { de: "Action<string, string>", en: "Action<string, string>" }
      - { de: "Func<string, bool>", en: "Func<string, bool>" }
    correct: [0]
    explanation: { de: "Sort(Comparison<T>) verlangt zwei Argumente vom Typ T und einen int als Ergebnis (negativ, 0, positiv; 10.1.2, Seite 662). Predicate<string> und Func<string, bool> haben nur einen Parameter und liefern bool, Action<string, string> liefert nichts.", en: "`Sort(Comparison<T>)` takes two arguments of type `T` and returns an `int` (negative, 0, or positive; 10.1.2, page 662). `Predicate<string>` and `Func<string, bool>` take only one parameter and return `bool`; `Action<string, string>` returns nothing." }
  - type: multipleChoice
    id: typ-action
    prompt: { de: "Zu welchem Delegatentyp passt das Lambda  s => Console.WriteLine(s)  in  wörter.ForEach(s => Console.WriteLine(s))?", en: "Which delegate type does the lambda `s => Console.WriteLine(s)` fit in `wörter.ForEach(s => Console.WriteLine(s))`?" }
    options:
      - { de: "Action<string>", en: "Action<string>" }
      - { de: "Predicate<string>", en: "Predicate<string>" }
      - { de: "Func<string, string>", en: "Func<string, string>" }
      - { de: "Comparison<string>", en: "Comparison<string>" }
    correct: [0]
    explanation: { de: "ForEach erwartet eine Action<T>: ein Argument, kein Rückgabewert. Console.WriteLine liefert void und passt daher weder zu Predicate<string> (bool) noch zu Func<string, string>; Comparison<string> hätte zwei Parameter.", en: "ForEach expects an Action<T>: one argument, no return value. Console.WriteLine returns void and therefore fits neither Predicate<string> (bool) nor Func<string, string>; Comparison<string> would take two parameters." }
  - type: multipleChoice
    id: ausdruck-oder-anweisung
    prompt: { de: "Welche Schreibweise ist ein Lambda mit Anweisungsblock (statement lambda)?", en: "What is the syntax for a lambda with a statement block (statement lambda)?" }
    options:
      - { de: "x => { int y = x * 2; return y + 1; }", en: "x => { int y = x * 2; return y + 1; }" }
      - { de: "x => x * 2 + 1", en: "x => x * 2 + 1" }
      - { de: "delegate (int x) { return x * 2 + 1; }", en: "delegate (int x) { return x * 2 + 1; }" }
    correct: [0]
    explanation: { de: "Ein Lambda mit geschweiften Klammern hat einen Anweisungsblock und braucht return, wenn es einen Wert liefert. x => x * 2 + 1 ist ein Ausdruckslambda; die dritte Variante ist eine anonyme Methode (10.1.5.1, Seite 665).", en: "A lambda with curly braces contains a block of statements and requires a `return` statement if it returns a value. `x => x * 2 + 1` is an expression lambda; the third variant is an anonymous method (10.1.5.1, page 665)." }
