id: delegaten-ereignisse-anbieten
title: { de: "Ereignisse anbieten" }
reading:
  section: "10.2.3"
  title: { de: "Ereignisse anbieten" }
  printedPage: 684
teaches:
  - events.declare
  - events.raise-safely
  - events.eventhandler-generic
  - events.custom-eventargs
requires:
  - delegates.multicast
  - delegates.null-conditional-invoke
  - delegates.generic-action
  - oop.property-validated
  - inheritance.derive-class
items:
  - type: coding
    id: thermostat
    openFile: "Ereignisse/Thermostat.cs"
    openLine: 1
    testProject: "Ereignisse Tests/Ereignisse.Tests.csproj"
  - type: multipleChoice
    id: on-methode
    prompt: { de: "Warum löst man ein Ereignis üblicherweise in einer Methode OnTemperaturGeaendert aus, die protected virtual ist, statt es direkt im Setter aufzurufen?" }
    options:
      - { de: "Abgeleitete Klassen können die Methode überschreiben und so die Auslösung kontrollieren (unterdrücken, ergänzen), ohne an die private Delegatenvariable zu kommen." }
      - { de: "Weil ein Ereignis nur in einer Methode mit dem Namen On... ausgelöst werden kann." }
      - { de: "Weil die Methode dadurch schneller läuft." }
    correct: [0]
    explanation: { de: "10.2.3 (Seite 684 bis 686): Die Delegatenvariable zum Ereignis ist privat; mit OnXyz() bekommen Erben eine Kontrollstelle. Der Name folgt der Konvention On + Ereignisname." }
  - type: multipleChoice
    id: null-pruefung
    prompt: { de: "Ein Ereignis hat keinen einzigen Abonnenten. Was passiert bei ereignis(this, e)?" }
    options:
      - { de: "NullReferenceException; deshalb löst man mit ereignis?.Invoke(this, e) aus." }
      - { de: "Nichts; ein Ereignis ohne Abonnenten ist ein leeres Delegatenobjekt." }
      - { de: "Der Compiler weigert sich, solchen Code zu übersetzen." }
    correct: [0]
    explanation: { de: "Ohne Abonnenten ist die Delegatenvariable null (10.1.3, Seite 664); ?.Invoke(...) prüft das thread-sicher in einem Schritt." }
