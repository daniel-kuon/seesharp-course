id: delegaten-ereignisse-abonnieren
title: { de: "Ereignisse abonnieren und abmelden", en: "Subscribe to and Unsubscribe from Events" }
reading:
  section: "10.2.2"
  title: { de: "Behandlungsmethoden registrieren", en: "Registering Handler Methods" }
  printedPage: 681
teaches:
  - events.subscribe-unsubscribe
  - events.sender-usage
requires:
  - events.declare
  - events.eventhandler-generic
  - events.custom-eventargs
  - lambdas.closure
  - collections.dictionary-add-lookup
items:
  - type: coding
    id: alarmzentrale
    openFile: "Alarm/Alarmzentrale.cs"
    openLine: 1
    testProject: "Alarm Tests/Alarm.Tests.csproj"
  - type: multipleChoice
    id: lambda-abmelden
    prompt: { de: "sensor.Alarm += (s, e) => zaehler++;  und später  sensor.Alarm -= (s, e) => zaehler++;  Wird der Abonnent dadurch abgemeldet?", en: "sensor.Alarm += (s, e) => counter++;  and later  sensor.Alarm -= (s, e) => counter++;  Will this unsubscribe the subscriber?" }
    options:
      - { de: "Nein; die zweite Zeile erzeugt ein neues Delegatenobjekt, das nicht in der Aufrufliste steht. Man müsste das Lambda in einer Variablen oder einem Feld aufbewahren.", en: "No; the second line creates a new delegate object that is not in the invocation list. You would have to store the lambda in a variable or a field." }
      - { de: "Ja; beide Lambdas sehen gleich aus und sind daher gleich.", en: "Yes; both lambdas look the same and are therefore the same." }
      - { de: "Der Compiler meldet für die zweite Zeile einen Fehler.", en: "The compiler reports an error on the second line." }
    correct: [0]
    explanation: { de: "-= entfernt ein Delegatenobjekt, das dem registrierten gleicht (gleiche Methode, gleiches Ziel). Zwei getrennt geschriebene Lambdas sind verschiedene Methoden (zu -= siehe 10.1.3, Seite 664). Übersetzt wird die zweite Zeile trotzdem; sie bewirkt nur nichts.", en: "-= removes a delegate object that matches the registered one (same method, same target). Two lambda expressions written separately are different methods (for -= see 10.1.3, page 664). The second line still compiles; it simply has no effect." }
  - type: multipleChoice
    id: abmelden-lohnt
    prompt: { de: "Warum sollte ein kurzlebiger Abonnent seine Behandlungsmethode abmelden, wenn der Ereignisanbieter länger lebt?", en: "Why should a short-lived subscriber unregister its handler method if the event provider lives longer?" }
    options:
      - { de: "Der Anbieter hält über die Aufrufliste eine Referenz auf den Abonnenten; ohne Abmelden bleibt dieser im Speicher und bekommt weiter Benachrichtigungen.", en: "Through the invocation list, the provider holds a reference to the subscriber; unless it unsubscribes, the subscriber stays in memory and keeps receiving notifications." }
      - { de: "Weil ein Ereignis nur einen Abonnenten gleichzeitig haben darf.", en: "Because an event can have only one subscriber at a time." }
      - { de: "Es ist nicht nötig; der Garbage Collector meldet Abonnenten automatisch ab.", en: "It's not necessary; the garbage collector automatically unsubscribes subscribers." }
    correct: [0]
    explanation: { de: "Ein Delegatenobjekt merkt sich das Zielobjekt (10.1.2, Seite 661); solange der Anbieter lebt, lebt über die Aufrufliste auch der Abonnent (10.2.2, Seite 684). Ein Ereignis darf beliebig viele Abonnenten haben, und der Garbage Collector meldet niemanden ab.", en: "A delegate object keeps track of the target object (10.1.2, page 661); as long as the provider is alive, the subscriber stays alive via the invocation list (10.2.2, page 684). An event may have any number of subscribers, and the garbage collector unsubscribes no one." }
