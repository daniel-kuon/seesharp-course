id: delegaten-ereignisse-abonnieren
title: { de: "Ereignisse abonnieren und abmelden", en: "Subscribe to and Unsubscribe from Events" }
reading:
  section: "10.2.2"
  title: { de: "Behandlungsmethoden registrieren", en: "Registering Handler Methods" }
  printedPage: 681
teaches:
  - events.subscribe-unsubscribe
  - events.sender-usage
requires:
  - events.declare
  - events.eventhandler-generic
  - events.custom-eventargs
  - lambdas.closure
  - collections.dictionary-add-lookup
items:
  - type: coding
    id: alarmzentrale
    openFile: "Alarm/Alarmzentrale.cs"
    openLine: 1
    testProject: "Alarm Tests/Alarm.Tests.csproj"
  - type: multipleChoice
    id: lambda-abmelden
    prompt: { de: "sensor.Alarm += (s, e) => zaehler++;  und später  sensor.Alarm -= (s, e) => zaehler++;  Wird der Abonnent dadurch abgemeldet?", en: "sensor.Alarm += (s, e) => counter++;  and later  sensor.Alarm -= (s, e) => counter++;  Will this unsubscribe the subscriber?" }
    options:
      - { de: "Nein; die zweite Zeile erzeugt ein neues Delegatenobjekt, das nicht in der Aufrufliste steht. Man müsste das Lambda in einer Variablen oder einem Feld aufbewahren.", en: "No; the second line creates a new delegate object that is not in the call list. You would have to store the lambda in a variable or an array." }
      - { de: "Ja; beide Lambdas sehen gleich aus und sind daher gleich.", en: "Yes; both lambdas look the same and are therefore the same." }
      - { de: "Der Compiler meldet für die zweite Zeile einen Fehler.", en: "The compiler reports an error on the second line." }
    correct: [0]
    explanation: { de: "-= entfernt ein Delegatenobjekt, das dem registrierten gleicht (gleiche Methode, gleiches Ziel). Zwei getrennt geschriebene Lambdas sind verschiedene Methoden (10.2.2, Seite 681).", en: "-= removes a delegate object that matches the registered one (same method, same target). Two lambda expressions written separately are considered different methods (10.2.2, page 681)." }
  - type: multipleChoice
    id: abmelden-lohnt
    prompt: { de: "Warum sollte ein kurzlebiger Abonnent seine Behandlungsmethode abmelden, wenn der Ereignisanbieter länger lebt?", en: "Why would a short-lived subscriber unsubscribe from its treatment method if the event provider outlives it?" }
    options:
      - { de: "Der Anbieter hält über die Aufrufliste eine Referenz auf den Abonnenten; ohne Abmelden bleibt dieser im Speicher und bekommt weiter Benachrichtigungen.", en: "The provider maintains a reference to the subscriber via the call list; unless the subscriber unsubscribes, this reference remains in memory and the subscriber continues to receive notifications." }
      - { de: "Weil ein Ereignis nur einen Abonnenten gleichzeitig haben darf.", en: "Because an event can have only one subscriber at a time." }
      - { de: "Es ist nicht nötig; der Garbage Collector meldet Abonnenten automatisch ab.", en: "It's not necessary; the garbage collector automatically unsubscribes subscribers." }
    correct: [0]
    explanation: { de: "Ein Delegatenobjekt merkt sich das Zielobjekt (10.1.2); solange der Anbieter lebt, lebt über die Aufrufliste auch der Abonnent.", en: "A delegate object keeps track of the target object (10.1.2); as long as the provider is alive, the subscriber remains alive via the call list." }
