id: delegaten-verstaendnisfragen
title: { de: "Verständnisfragen", en: "Comprehension questions" }
reading:
  section: "10"
  title: { de: "Delegaten und Ereignisse", en: "Delegates and Events" }
  printedPage: 657
teaches:
  - delegates.multicast
  - lambdas.closure
  - events.declare
  - events.raise-safely
requires:
  - delegates.declare-type
  - delegates.create-invoke
  - lambdas.list-predicate-methods
  - events.eventhandler-generic
  - events.custom-eventargs
  - events.subscribe-unsubscribe
items:
  - type: open
    id: delegat-typ
    prompt:
      de: "Erkläre, was ein Delegatentyp beschreibt und was ein Delegatenobjekt ist. Was muss eine Methode mitbringen, damit ein Delegatenobjekt auf sie zeigen darf, und was spielt dabei keine Rolle?"
      en: "Explain what a delegate type describes and what a delegate object is. What must a method have for a delegate object to be allowed to point to it, and what does not matter?"
  - type: open
    id: closure
    prompt:
      de: "Ein Lambda-Ausdruck benutzt eine lokale Variable der Methode, in der er steht. Erkläre, was dabei „Einfangen“ bedeutet, wie lange die Variable lebt und was passiert, wenn die Methode zweimal aufgerufen wird."
      en: "A lambda expression uses a local variable of the method it appears in. Explain what \"capturing\" means here, how long the variable lives, and what happens when the method is called twice."
  - type: open
    id: event-vs-feld
    prompt:
      de: "Eine Klasse deklariert `public Action<string>? Meldung;`, eine andere `public event Action<string>? Meldung;`. Was kann fremder Code beim öffentlichen Feld tun, was beim Ereignis nicht? Warum ist diese Einschränkung ein Vorteil?"
      en: "One class declares `public Action<string>? Meldung;`, another declares `public event Action<string>? Meldung;`. What can outside code do with the public field that it cannot do with the event? Why is this restriction an advantage?"
  - type: open
    id: standardmuster
    prompt:
      de: "Beschreibe das Standardmuster, mit dem eine Klasse ein Ereignis anbietet (Delegatentyp, Nutzdaten, auslösende Methode). Warum wird mit `Xyz?.Invoke(this, e)` ausgelöst, und warum ist die auslösende Methode `protected virtual`?"
      en: "Describe the standard pattern a class uses to provide an event (delegate type, payload, raising method). Why is the event raised with `Xyz?.Invoke(this, e)`, and why is the raising method `protected virtual`?"
  - type: open
    id: abmelden
    prompt:
      de: "Warum sollte sich ein Abonnent von einem Ereignis wieder abmelden? Und warum entfernt `x.Signal -= (s, e) => Console.WriteLine(\"A\");` ein vorher mit demselben Lambda angemeldetes Abonnement nicht, obwohl beide Zeilen gleich aussehen?"
      en: "Why should a subscriber unsubscribe from an event again? And why does `x.Signal -= (s, e) => Console.WriteLine(\"A\");` not remove a subscription that was added earlier with the same lambda, even though both lines look identical?"
  - type: open
    id: code-multicast
    prompt:
      de: |
        Was gibt dieses Programm aus, und warum?

        ```csharp
        Func<int> f = () => { Console.Write("A "); return 1; };
        f += () => { Console.Write("B "); return 2; };
        int ergebnis = f();
        Console.WriteLine(ergebnis);
        ```
      en: |
        What does this program print, and why?

        ```csharp
        Func<int> f = () => { Console.Write("A "); return 1; };
        f += () => { Console.Write("B "); return 2; };
        int ergebnis = f();
        Console.WriteLine(ergebnis);
        ```
  - type: open
    id: code-schleife
    prompt:
      de: |
        Was gibt dieses Programm aus? Wie änderst du es so, dass `0 1 2` erscheint?

        ```csharp
        var aktionen = new List<Action>();
        for (int i = 0; i < 3; i++)
            aktionen.Add(() => Console.Write(i + " "));
        foreach (var a in aktionen) a();
        ```
      en: |
        What does this program print? How do you change it so that `0 1 2` appears?

        ```csharp
        var aktionen = new List<Action>();
        for (int i = 0; i < 3; i++)
            aktionen.Add(() => Console.Write(i + " "));
        foreach (var a in aktionen) a();
        ```
  - type: open
    id: code-zaehler
    prompt:
      de: |
        Was geben die drei Ausgabezeilen aus, und warum?

        ```csharp
        static Func<int> Zaehler()
        {
            int n = 0;
            return () => ++n;
        }

        var a = Zaehler();
        var b = Zaehler();
        Console.WriteLine(a());
        Console.WriteLine(a());
        Console.WriteLine(b());
        ```
      en: |
        What do the three output lines print, and why?

        ```csharp
        static Func<int> Zaehler()
        {
            int n = 0;
            return () => ++n;
        }

        var a = Zaehler();
        var b = Zaehler();
        Console.WriteLine(a());
        Console.WriteLine(a());
        Console.WriteLine(b());
        ```
  - type: open
    id: code-on-methode
    prompt:
      de: |
        Was gibt dieses Programm aus, und in welcher Reihenfolge?

        ```csharp
        class Basis
        {
            public event EventHandler? Fertig;
            protected virtual void OnFertig()
            {
                Console.Write("Basis ");
                Fertig?.Invoke(this, EventArgs.Empty);
            }
            public void Arbeite() => OnFertig();
        }

        class Abgeleitet : Basis
        {
            protected override void OnFertig()
            {
                Console.Write("vorher ");
                base.OnFertig();
            }
        }

        var x = new Abgeleitet();
        x.Fertig += (s, e) => Console.Write("Abo ");
        x.Arbeite();
        ```
      en: |
        What does this program print, and in what order?

        ```csharp
        class Basis
        {
            public event EventHandler? Fertig;
            protected virtual void OnFertig()
            {
                Console.Write("Basis ");
                Fertig?.Invoke(this, EventArgs.Empty);
            }
            public void Arbeite() => OnFertig();
        }

        class Abgeleitet : Basis
        {
            protected override void OnFertig()
            {
                Console.Write("vorher ");
                base.OnFertig();
            }
        }

        var x = new Abgeleitet();
        x.Fertig += (s, e) => Console.Write("Abo ");
        x.Arbeite();
        ```
  - type: multipleChoice
    id: richtig-delegat
    prompt:
      de: "Welcher Code deklariert einen Delegatentyp für Methoden mit zwei `int`-Parametern und Rückgabetyp `bool`, erzeugt ein Delegatenobjekt und kompiliert?"
      en: "Which code declares a delegate type for methods with two `int` parameters and return type `bool`, creates a delegate object, and compiles?"
    options:
      - de: |
          ```csharp
          delegate bool Vergleich(int a, int b);
          Vergleich v = (a, b) => a < b;
          ```
      - de: |
          ```csharp
          delegate bool Vergleich(int a, int b);
          Vergleich v = new Vergleich();
          ```
      - de: |
          ```csharp
          delegate bool Vergleich(int a, int b);
          Vergleich v = (a, b) => a + b;
          ```
      - de: |
          ```csharp
          delegate bool Vergleich(int a, int b);
          Vergleich v = a => a < 1;
          ```
    correct: [0]
    explanation:
      de: "Zweite Option: Ein Delegatenobjekt entsteht aus einer Methode oder einem Lambda, nicht mit einem parameterlosen `new` (Fehler CS1729). Dritte Option: `a + b` ist ein `int`, der Delegat verlangt `bool` als Rückgabetyp (Fehler CS0029/CS1662). Vierte Option: Das Lambda hat einen Parameter, der Delegat zwei (Fehler CS1593)."
      en: "Second option: A delegate object is created from a method or a lambda, not with a parameterless `new` (error CS1729). Third option: `a + b` is an `int`, but the delegate requires `bool` as its return type (errors CS0029/CS1662). Fourth option: The lambda has one parameter, the delegate has two (error CS1593)."
  - type: multipleChoice
    id: richtig-ausloesen
    prompt:
      de: "Die Klasse `Sensor` soll nach dem Standardmuster ein Ereignis `Gemessen` anbieten. `MessEventArgs` ist eine von `EventArgs` abgeleitete Klasse. Welche Variante ist richtig?"
      en: "The class `Sensor` is supposed to provide an event `Gemessen` using the standard pattern. `MessEventArgs` is a class derived from `EventArgs`. Which variant is correct?"
    options:
      - de: |
          ```csharp
          public event EventHandler<MessEventArgs>? Gemessen;
          protected virtual void OnGemessen(MessEventArgs e)
              => Gemessen?.Invoke(this, e);
          ```
      - de: |
          ```csharp
          public event EventHandler<MessEventArgs>? Gemessen;
          protected virtual void OnGemessen(MessEventArgs e)
              => Gemessen(this, e);
          ```
      - de: |
          ```csharp
          public event EventHandler<MessEventArgs>? Gemessen;
          protected virtual void OnGemessen(MessEventArgs e)
              => Gemessen?.Invoke(e);
          ```
    correct: [0]
    explanation:
      de: "Zweite Option: Ohne `?.` stürzt der Aufruf mit einer `NullReferenceException` ab, solange sich niemand angemeldet hat (die Aufrufliste ist dann `null`). Dritte Option: `EventHandler<T>` verlangt zwei Argumente (`sender` und `e`); mit nur einem lässt sich der Code nicht übersetzen (Fehler CS7036)."
      en: "Second option: Without `?.`, the call crashes with a `NullReferenceException` as long as nobody has subscribed (the invocation list is then `null`). Third option: `EventHandler<T>` requires two arguments (`sender` and `e`); with only one, the code does not compile (error CS7036)."
  - type: multipleChoice
    id: richtig-handler
    prompt:
      de: "Gegeben ist `public event EventHandler<MessEventArgs>? Gemessen;` in der Klasse `Sensor`. Welche Methode kann man mit `sensor.Gemessen += …` anmelden?"
      en: "Given `public event EventHandler<MessEventArgs>? Gemessen;` in the class `Sensor`. Which method can be subscribed with `sensor.Gemessen += …`?"
    options:
      - de: |
          ```csharp
          static void Zeige(object? sender, MessEventArgs e)
              => Console.WriteLine(e.Wert);
          ```
      - de: |
          ```csharp
          static void Zeige(MessEventArgs e)
              => Console.WriteLine(e.Wert);
          ```
      - de: |
          ```csharp
          static int Zeige(object? sender, MessEventArgs e)
          {
              Console.WriteLine(e.Wert);
              return 0;
          }
          ```
      - de: |
          ```csharp
          static void Zeige(Sensor sender, MessEventArgs e)
              => Console.WriteLine(e.Wert);
          ```
    correct: [0]
    explanation:
      de: "Zweite Option: Es fehlt der `sender`-Parameter (CS0123). Dritte Option: Der Rückgabetyp muss `void` sein wie beim Delegaten (CS0407). Vierte Option: Der Delegat übergibt als ersten Parameter ein `object?`; eine Methode, die nur einen `Sensor` annimmt, könnte mit einem beliebigen Objekt aufgerufen werden und passt deshalb nicht (CS0123). Ein allgemeinerer Parametertyp wäre dagegen erlaubt (Kontravarianz)."
      en: "Second option: The `sender` parameter is missing (CS0123). Third option: The return type must be `void`, like the delegate's (CS0407). Fourth option: The delegate passes an `object?` as its first parameter; a method that accepts only a `Sensor` could be called with an arbitrary object and therefore does not fit (CS0123). A more general parameter type, however, would be allowed (contravariance)."
  - type: multipleChoice
    id: richtig-praedikat
    prompt:
      de: "Aus `List<int> zahlen = new() { 1, 2, 3, 4 };` sollen alle geraden Zahlen entfernt werden, sodass `zahlen` danach `1, 3` enthält. Welcher Code tut das?"
      en: "All even numbers are to be removed from `List<int> zahlen = new() { 1, 2, 3, 4 };` so that `zahlen` contains `1, 3` afterwards. Which code does that?"
    options:
      - de: "`zahlen.RemoveAll(z => z % 2 == 0);`"
      - de: "`zahlen.RemoveAll(z => z % 2);`"
      - de: |
          ```csharp
          foreach (var z in zahlen)
              if (z % 2 == 0) zahlen.Remove(z);
          ```
      - de: "`zahlen.FindAll(z => z % 2 == 0);`"
    correct: [0]
    explanation:
      de: "Zweite Option: Das Prädikat muss `bool` liefern, `z % 2` ist ein `int` (Fehler CS1662). Dritte Option: Das Ändern der Liste während des `foreach` wirft eine `InvalidOperationException`. Vierte Option: `FindAll` liefert eine neue Liste mit den geraden Zahlen und verändert `zahlen` nicht; `1, 2, 3, 4` bleiben stehen."
      en: "Second option: The predicate must return `bool`, but `z % 2` is an `int` (error CS1662). Third option: Modifying the list during `foreach` throws an `InvalidOperationException`. Fourth option: `FindAll` returns a new list with the even numbers and does not change `zahlen`; `1, 2, 3, 4` remain."
