id: linq-where-und-select
title: { de: "Where, Select und Verkettung", en: "Where, Select, and Chaining" }
reading:
  section: "18.2.1"
  title: { de: "Beispiel", en: "Example" }
  printedPage: 1211
teaches:
  - linq.where
  - linq.select
  - linq.projection-anonymous
  - linq.chaining
  - linq.materialize
requires:
  - lambdas.expression
  - delegates.generic-func
  - interfaces.ienumerable
  - collections.list-add-remove
  - types.anonymous
  - extensions.extension-method
  - tuples.declare
items:
  - type: coding
    id: abfragen
    openFile: "LinqEinstieg/Abfragen.cs"
    openLine: 1
    testProject: "LinqEinstieg Tests/LinqEinstieg.Tests.csproj"
  - type: multipleChoice
    id: anonymer-typ
    prompt: { de: "Was erzeugt  from p in produkte select new { p.Name, p.Preis }  und warum kann eine Methode diesen Typ nicht als Rückgabetyp deklarieren?", en: "What does `from p in produkte select new { p.Name, p.Preis }` return, and why can't a method declare this type as its return type?" }
    options:
      - { de: "Eine Sequenz anonymer Typen; der Compiler vergibt den Typnamen selbst, man kann ihn im Quelltext nicht hinschreiben. Als Rückgabetyp bieten sich Tupel oder ein benannter Typ (Record) an.", en: "A sequence of anonymous types; the compiler assigns the type name itself—you cannot specify it in the source code. Tuples or a named type (record) are suitable as return types." }
      - { de: "Eine Sequenz von Produkt-Objekten; der Rückgabetyp wäre dann IEnumerable<Produkt>.", en: "A sequence of `Produkt` objects; the return type would then be `IEnumerable<Produkt>`." }
      - { de: "Eine Liste von Dictionary<string, decimal>; als Rückgabetyp wäre das möglich.", en: "A list of Dictionary<string, decimal>; that would be possible as a return type." }
    correct: [0]
    explanation: { de: "Anonyme Typen (Level 6) haben einen vom Compiler erzeugten, unaussprechlichen Namen. Innerhalb einer Methode genügt var; über Methodengrenzen hinweg nimmt man ein Tupel (string Name, decimal Preis) oder einen Record.", en: "Anonymous types (Level 6) have an unpronounceable name generated by the compiler. Within a method, `var` is sufficient; across method boundaries, you use a tuple (`string Name, decimal Preis`) or a record." }
  - type: multipleChoice
    id: where-select-typ
    prompt: { de: "Welchen Typ hat  produkte.Where(p => p.Preis < 10)  ?", en: "What is the type of `produkte.Where(p => p.Preis < 10)`?" }
    options:
      - { de: "IEnumerable<Produkt>; die Methoden von System.Linq.Enumerable arbeiten auf IEnumerable<T> und liefern wieder IEnumerable<T>, sodass man sie verketten kann (Fluent-API).", en: "`IEnumerable<Produkt>`; the methods of `System.Linq.Enumerable` work on `IEnumerable<T>` and again return `IEnumerable<T>`, so they can be chained (fluent API)." }
      - { de: "List<Produkt>; Where kopiert die passenden Elemente in eine neue Liste.", en: "`List<Produkt>`; `Where` copies the matching elements into a new list." }
      - { de: "bool; Where prüft, ob mindestens ein Produkt passt.", en: "`bool`; `Where` checks whether at least one product matches." }
    correct: [0]
    explanation: { de: "18.2.3 (Seite 1213): Weil jede Methode eine Sequenz zurückgibt, lassen sich Aufrufe zu einer Kette verbinden.", en: "18.2.3 (page 1213): Because each method returns a sequence, method calls can be chained together." }
