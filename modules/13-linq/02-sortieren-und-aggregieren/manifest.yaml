id: linq-sortieren-und-aggregieren
title: { de: "Sortieren, Aggregate und Teilfolgen", en: "Sorting, Aggregates, and Subsequences" }
reading:
  section: "18.2.7"
  title: { de: "Sortieren", en: "Sorting" }
  printedPage: 1218
teaches:
  - linq.orderby
  - linq.aggregates
  - linq.paging
requires:
  - linq.where
  - linq.select
  - linq.chaining
  - lambdas.expression
  - strings.methods
items:
  - type: coding
    id: statistik
    openFile: "Statistik/Statistik.cs"
    openLine: 1
    testProject: "Statistik Tests/Statistik.Tests.csproj"
  - type: multipleChoice
    id: average-leer
    prompt: { de: "Was passiert bei  new List<decimal>().Average()  ?", en: "What happens when you call `new List<decimal>().Average()`?" }
    options:
      - { de: "InvalidOperationException: Aus einer leeren Sequenz lässt sich kein Mittelwert bilden. Man prüft vorher mit Any() oder weicht auf DefaultIfEmpty() aus.", en: "InvalidOperationException: You cannot calculate an average from an empty sequence. Check first using Any() or fall back to DefaultIfEmpty()." }
      - { de: "Das Ergebnis ist 0.", en: "The result is 0." }
      - { de: "Das Ergebnis ist double.NaN.", en: "The result is double.NaN." }
    correct: [0]
    explanation: { de: "Min, Max und Average werfen bei einer leeren Folge von Zahlen (int, decimal, double usw.) eine InvalidOperationException; Sum und Count liefern dagegen 0. Das Buch verhindert die Ausnahme im GroupJoin-Beispiel mit Any() (Seite 1227 und 1228).", en: "Min, Max, and Average throw an InvalidOperationException for an empty sequence of numbers (int, decimal, double, etc.); Sum and Count, on the other hand, return 0. In its GroupJoin example the book avoids the exception with Any() (pages 1227 and 1228)." }
  - type: multipleChoice
    id: stabil
    prompt: { de: "Produkte sollen nach Kategorie und innerhalb einer Kategorie nach Preis sortiert werden. Was leistet  produkte.OrderBy(p => p.Kategorie).OrderBy(p => p.Preis)  ?", en: "Products are to be sorted by category and, within a category, by price. What does `produkte.OrderBy(p => p.Kategorie).OrderBy(p => p.Preis)` do?" }
    options:
      - { de: "Es sortiert am Ende nach dem Preis; das zweite OrderBy sortiert neu. Für das zweite Kriterium braucht man ThenBy: OrderBy(p => p.Kategorie).ThenBy(p => p.Preis).", en: "In the end it sorts by price; the second OrderBy sorts anew. The second criterion needs ThenBy: OrderBy(p => p.Kategorie).ThenBy(p => p.Preis)." }
      - { de: "Es sortiert nach Kategorie und innerhalb der Kategorie nach Preis.", en: "It sorts by category and, within a category, by price." }
      - { de: "Der Compiler lehnt zwei OrderBy hintereinander ab.", en: "The compiler rejects two OrderBy calls in a row." }
    correct: [0]
    explanation: { de: "18.2.7 (Seite 1218 f.): Folgen zwei OrderBy aufeinander, startet das zweite eine neue Sortierung. Weitere Kriterien hängt man mit ThenBy/ThenByDescending an. Der Code kompiliert, denn OrderBy liefert wieder eine Sequenz.", en: "18.2.7 (pages 1218–1219): If two OrderBy calls follow each other, the second starts a new sort. Further criteria are appended with ThenBy/ThenByDescending. The code compiles, because OrderBy returns a sequence again." }
