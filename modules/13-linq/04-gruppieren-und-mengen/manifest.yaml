id: linq-gruppieren-und-mengen
title: { de: "Gruppieren, Zählen und Mengenoperatoren", en: "Grouping, Counting, and Set Operators" }
reading:
  section: "18.2.9"
  title: { de: "GroupBy()", en: "GroupBy()" }
  printedPage: 1222
teaches:
  - linq.groupby
  - linq.countby
  - linq.set-operators
requires:
  - linq.select
  - linq.orderby
  - linq.aggregates
  - collections.dictionary-grouping
  - collections.set-operations
  - records.value-equality
items:
  - type: coding
    id: auswertung
    openFile: "Gruppen/Auswertung.cs"
    openLine: 1
    testProject: "Gruppen Tests/Gruppen.Tests.csproj"
    requiredTests:
      - AuswertungTests.Duplikate_findet_gleiche_Groesse_und_Hash
      - AuswertungTests.Duplikate_ohne_Treffer_ist_leer
      - AuswertungTests.SpeicherProEndung_summiert_und_sortiert
      - AuswertungTests.SpeicherProEndung_bricht_Gleichstand_nach_Endung
      - AuswertungTests.Mengenoperatoren_auf_Tags
  - type: multipleChoice
    id: countby-oder-groupby
    prompt: { de: "Welcher Ausdruck liefert für  string[] werte = { \"a\", \"b\", \"a\" };  die Häufigkeit jedes Werts, also (a, 2) und (b, 1)?", en: "Which expression returns the frequency of each value for `string[] werte = { \"a\", \"b\", \"a\" };`, that is (a, 2) and (b, 1)?" }
    options:
      - { de: "werte.GroupBy(w => w).Select(g => (g.Key, g.Count()))", en: "werte.GroupBy(w => w).Select(g => (g.Key, g.Count()))" }
      - { de: "werte.Distinct().Count()", en: "werte.Distinct().Count()" }
      - { de: "werte.Select(w => (w, werte.Count()))", en: "werte.Select(w => (w, werte.Count()))" }
    correct: [0]
    explanation: { de: "18.2.9 (Seite 1222): GroupBy fasst gleiche Schlüssel zu Gruppen zusammen; Key ist der Wert, Count() die Größe der Gruppe. Distinct().Count() liefert nur die Zahl der verschiedenen Werte (2). Die dritte Variante liefert für jedes Element die Gesamtzahl 3 und wiederholt \"a\".", en: "18.2.9 (page 1222): GroupBy combines equal keys into groups; Key is the value, Count() the size of the group. Distinct().Count() only returns the number of distinct values (2). The third option returns the total 3 for every element and repeats \"a\"." }
  - type: multipleChoice
    id: groupby-gruppen
    prompt: { de: "Was ist ein Element der Sequenz, die  eintraege.GroupBy(e => e.Hash)  liefert?", en: "What is an element of the sequence returned by `eintraege.GroupBy(e => e.Hash)`?" }
    options:
      - { de: "Ein IGrouping<string, Dateieintrag>: eine Folge von Dateieinträgen mit der Eigenschaft Key (hier der Hash).", en: "An `IGrouping<string, Dateieintrag>`: a sequence of `Dateieintrag` objects with the `Key` property (here the hash)." }
      - { de: "Ein einzelner Dateieintrag.", en: "A single file entry." }
      - { de: "Ein Dictionary<string, int> mit den Häufigkeiten.", en: "A Dictionary<string, int> containing the frequencies." }
    correct: [0]
    explanation: { de: "18.2.9 (Seite 1222): Jede Gruppe ist selbst eine Sequenz und trägt ihren Schlüssel in Key; man wertet sie mit Count(), Sum(), Select() usw. aus.", en: "18.2.9 (page 1222): Each group is itself a sequence and stores its key in `Key`; it is evaluated using `Count()`, `Sum()`, `Select()`, etc." }
