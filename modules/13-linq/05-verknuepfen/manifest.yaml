id: linq-verknuepfen
title: { de: "Join, GroupJoin und Zip", en: "Join, GroupJoin, and Zip" }
reading:
  section: "18.2.10"
  title: { de: "Verknüpfen von zwei Sequenzen", en: "Linking Two Sequences" }
  printedPage: 1224
teaches:
  - linq.join
  - linq.groupjoin
  - linq.zip
requires:
  - linq.groupby
  - linq.select
  - linq.orderby
  - linq.aggregates
  - tuples.declare
  - records.declare
items:
  - type: coding
    id: verknuepfungen
    openFile: "Verknuepfen/Verknuepfungen.cs"
    openLine: 1
    testProject: "Verknuepfen Tests/Verknuepfen.Tests.csproj"
  - type: multipleChoice
    id: join-oder-groupjoin
    prompt: { de: "Ein Kunde hat keine Bestellung. Wie verhalten sich Join und GroupJoin über Kunden und Bestellungen?", en: "A customer has no orders. How do `Join` and `GroupJoin` behave for customers and orders?" }
    options:
      - { de: "Join (innerer Join) liefert für diesen Kunden keine Zeile; GroupJoin liefert eine Zeile mit einer leeren Gruppe von Bestellungen (Zahl 0).", en: "Join (inner join) returns no rows for this customer; GroupJoin returns one row with an empty group of orders (count 0)." }
      - { de: "Beide liefern für diesen Kunden keine Zeile.", en: "Neither returns a row for this customer." }
      - { de: "Join liefert eine Zeile mit null; GroupJoin liefert keine Zeile.", en: "Join returns one row with null; GroupJoin returns no row." }
    correct: [0]
    explanation: { de: "18.2.10.2 (Seite 1227 und 1228): GroupJoin ordnet jedem Element der äußeren Sequenz die Gruppe seiner Treffer zu, auch wenn sie leer ist; das Buch nennt das einen Left Outer Join. Join liefert nur Paare (Inner Join). Eine flache Folge von Paaren mit null für fehlende Partner baut man mit GroupJoin plus SelectMany/DefaultIfEmpty, seit .NET 10 auch direkt mit LeftJoin.", en: "18.2.10.2 (pages 1227 and 1228): GroupJoin assigns the group of its matches to each element of the outer sequence, even if it is empty; the book calls this a left outer join. Join returns only pairs (inner join). A flat sequence of pairs with null for missing partners is built with GroupJoin plus SelectMany/DefaultIfEmpty, and since .NET 10 directly with LeftJoin." }
