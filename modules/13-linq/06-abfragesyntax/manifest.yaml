id: linq-abfragesyntax
title: { de: "Abfragesyntax mit let, into und join" }
reading:
  section: "18.3"
  title: { de: "Abfragesyntax" }
  printedPage: 1235
teaches:
  - linq.query-syntax
  - linq.query-let
  - linq.query-into
  - linq.query-group-join
requires:
  - linq.where
  - linq.select
  - linq.orderby
  - linq.groupby
  - linq.join
items:
  - type: coding
    id: umschreiben
    openFile: "Abfragesyntax/Abfragesyntax.cs"
    openLine: 1
    testProject: "Abfragesyntax Tests/Abfragesyntax.Tests.csproj"
  - type: multipleChoice
    id: let-uebersetzung
    prompt: { de: "from p in produkte  let brutto = p.Preis * 1.19m  where brutto > 20m  select (p.Name, brutto)  — In welche Methodenaufrufe übersetzt der Compiler das?" }
    options:
      - { de: "Ein Select, das p und brutto in einem anonymen Typ bündelt (transparenter Bezeichner), gefolgt von Where und einem weiteren Select, das darauf zugreift." }
      - { de: "Ein einziges Where; let wird dabei weggelassen." }
      - { de: "Ein Aggregate-Aufruf, der brutto als Akkumulator führt." }
    correct: [0]
    explanation: { de: "18.3 (Seite 1235 bis 1243): Die Abfragesyntax ist nur Zucker; der Compiler schreibt sie in Methodenaufrufe um. let wird zu einem Select mit anonymem Typ { p, brutto }, den die folgenden Klauseln unter dem Namen der Bereichsvariablen ansprechen." }
  - type: multipleChoice
    id: kein-schluesselwort
    prompt: { de: "Welche dieser Operationen hat in der Abfragesyntax kein eigenes Schlüsselwort und wird deshalb mit dem Methodenaufruf auf der geklammerten Abfrage geschrieben?" }
    options:
      - { de: "Take, Skip und Count, z. B. (from p in produkte orderby p.Preis select p).Take(3)" }
      - { de: "where" }
      - { de: "orderby" }
      - { de: "join" }
    correct: [0]
    explanation: { de: "Die Abfragesyntax kennt from, where, select, group, into, orderby, join und let. Alles andere (Take, Skip, Count, Distinct, Chunk usw.) hängt man als Methode an. Daher lässt sich nicht jede Methodensyntax-Abfrage allein in Abfragesyntax ausdrücken (18.6 Aufgabe 1.1)." }
