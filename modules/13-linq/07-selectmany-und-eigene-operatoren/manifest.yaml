id: linq-selectmany-und-eigene-operatoren
title: { de: "SelectMany, Unterabfragen, OfType und eigene Operatoren" }
reading:
  section: "18.2.8.2"
  title: { de: "SelectMany()" }
  printedPage: 1220
teaches:
  - linq.selectmany
  - linq.subquery
  - linq.oftype
  - linq.custom-operator
requires:
  - linq.select
  - linq.where
  - linq.query-syntax
  - iterators.yield
  - extensions.extension-method
  - generics.method
  - interfaces.ienumerable
  - inheritance.type-test
items:
  - type: coding
    id: operatoren
    openFile: "Operatoren/Auswertung.cs"
    openLine: 1
    testProject: "Operatoren Tests/Operatoren.Tests.csproj"
  - type: multipleChoice
    id: aussage-1
    prompt: { de: "Aussage: Jede in der Methodensyntax formulierbare LINQ-to-Objects-Abfrage lässt sich in einen Abfrageausdruck übersetzen. (18.6 Aufgabe 1.1)" }
    options:
      - { de: "Richtig" }
      - { de: "Falsch" }
    correct: [1]
    explanation: { de: "Operatoren wie Take, Skip, Count, Distinct oder Chunk haben kein Schlüsselwort in der Abfragesyntax; man hängt sie als Methode an den geklammerten Ausdruck." }
  - type: multipleChoice
    id: aussage-2
    prompt: { de: "Aussage: Ein Abfrageausdruck mit zwei from-Klauseln wird vom Compiler in eine SelectMany()-Methode übersetzt. (18.6 Aufgabe 1.2)" }
    options:
      - { de: "Richtig" }
      - { de: "Falsch" }
    correct: [0]
    explanation: { de: "Die zweite from-Klausel entspricht SelectMany (18.2.8.2, Seite 1220; Sample Abfragesyntax/SelectMany per Abfragesyntax)." }
  - type: multipleChoice
    id: aussage-3
    prompt: { de: "Aussage: Eine PLINQ-Abfrage kann Multithreading in Form von Datenparallelität realisieren. (18.6 Aufgabe 1.3)" }
    options:
      - { de: "Richtig" }
      - { de: "Falsch" }
    correct: [0]
    explanation: { de: "AsParallel() verteilt die Elemente auf mehrere Threads; PLINQ ist Thema des Wahlmoduls Multithreading (18.5)." }
  - type: multipleChoice
    id: aussage-4
    prompt: { de: "Aussage: Das kooperative Abbruchmodell lässt sich in LINQ-Abfragen mit WithCancellation(...) nutzen; dieser Operator gibt es aber nur bei PLINQ (ParallelQuery), nicht bei gewöhnlichem LINQ-to-Objects. (18.6 Aufgabe 1.4)" }
    options:
      - { de: "Richtig" }
      - { de: "Falsch" }
    correct: [0]
    explanation: { de: "WithCancellation ist eine Methode von ParallelEnumerable; gewöhnliche Abfragen auf IEnumerable<T> kennen sie nicht. Zum Abbrechen einer sequenziellen Abfrage prüft man ein CancellationToken im Lambda selbst." }
  - type: multipleChoice
    id: aussage-5
    prompt: { de: "Aussage: Mit dem LINQ-Operator Zip() lässt sich eine Datei komprimieren. (18.6 Aufgabe 1.5)" }
    options:
      - { de: "Richtig" }
      - { de: "Falsch" }
    correct: [1]
    explanation: { de: "Zip() paart die Elemente zweier Sequenzen. Dateien komprimiert man mit System.IO.Compression.ZipFile (Namensvetter, keine Beziehung)." }
