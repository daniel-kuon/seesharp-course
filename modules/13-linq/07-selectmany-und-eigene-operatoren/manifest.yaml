id: linq-selectmany-und-eigene-operatoren
title: { de: "SelectMany, Unterabfragen, OfType und eigene Operatoren", en: "SelectMany, subqueries, OfType, and custom operators" }
reading:
  section: "18.2.8.2"
  title: { de: "SelectMany()", en: "SelectMany()" }
  printedPage: 1220
teaches:
  - linq.selectmany
  - linq.subquery
  - linq.oftype
  - linq.custom-operator
requires:
  - linq.select
  - linq.where
  - linq.query-syntax
  - iterators.yield
  - extensions.extension-method
  - generics.method
  - interfaces.ienumerable
  - inheritance.type-test
items:
  - type: coding
    id: operatoren
    openFile: "Operatoren/Auswertung.cs"
    openLine: 1
    testProject: "Operatoren Tests/Operatoren.Tests.csproj"
  - type: multipleChoice
    id: aussage-1
    prompt: { de: "Aussage: Jede in der Methodensyntax formulierbare LINQ-to-Objects-Abfrage lässt sich in einen Abfrageausdruck übersetzen. (18.6 Aufgabe 1.1)", en: "Statement: Every LINQ to Objects query that can be expressed using the method syntax can be translated into a query expression. (18.6 Exercise 1.1)" }
    options:
      - { de: "Richtig", en: "Correct" }
      - { de: "Falsch", en: "Wrong" }
    correct: [1]
    explanation: { de: "Umgekehrt gilt es: Jeder Abfrageausdruck lässt sich in Methodensyntax übersetzen, aber etliche Operatoren gibt es nur als Methode (18.2, Seite 1210; 18.3, Seite 1235). Take, Skip, Count, Distinct, Reverse oder Chunk haben kein Schlüsselwort in der Abfragesyntax; man hängt sie als Methode an den geklammerten Ausdruck.", en: "The reverse holds: every query expression can be translated into method syntax, but several operators exist only as methods (18.2, page 1210; 18.3, page 1235). Take, Skip, Count, Distinct, Reverse, or Chunk have no keyword in query syntax; they are appended as methods to the parenthesized expression." }
  - type: multipleChoice
    id: aussage-2
    prompt: { de: "Aussage: Ein Abfrageausdruck mit zwei from-Klauseln wird vom Compiler in eine SelectMany()-Methode übersetzt. (18.6 Aufgabe 1.2)", en: "Statement: A query expression with two `from` clauses is translated by the compiler into a `SelectMany()` method. (18.6 Exercise 1.2)" }
    options:
      - { de: "Richtig", en: "Correct" }
      - { de: "Falsch", en: "Wrong" }
    correct: [0]
    explanation: { de: "Die zweite from-Klausel entspricht SelectMany (18.3.8, Seite 1241; Sample Abfragesyntax/SelectMany per Abfragesyntax).", en: "The second `from` clause corresponds to `SelectMany` (18.3.8, page 1241; sample `Abfragesyntax/SelectMany per Abfragesyntax`)." }
  - type: multipleChoice
    id: aussage-3
    prompt: { de: "Aussage: Eine PLINQ-Abfrage kann Multithreading in Form von Datenparallelität realisieren. (18.6 Aufgabe 1.3)", en: "Statement: A PLINQ query can implement multithreading in the form of data parallelism. (18.6 Exercise 1.3)" }
    options:
      - { de: "Richtig", en: "Correct" }
      - { de: "Falsch", en: "Wrong" }
    correct: [0]
    explanation: { de: "AsParallel() verteilt die Elemente auf mehrere Threads; PLINQ ist Thema des Wahlmoduls Multithreading (18.5, Seite 1245).", en: "AsParallel() distributes the elements across multiple threads; PLINQ is covered in the elective module on multithreading (18.5, page 1245)." }
  - type: multipleChoice
    id: aussage-4
    prompt: { de: "Aussage: Die LINQ-to-Objects-Abfragen und die PLINQ-Abfragen unterstützen das kooperative Abbruchmodell. (18.6 Aufgabe 1.4)", en: "Statement: LINQ to Objects queries and PLINQ queries both support the cooperative cancellation model. (18.6 Exercise 1.4)" }
    options:
      - { de: "Richtig", en: "Correct" }
      - { de: "Falsch", en: "Wrong" }
    correct: [1]
    explanation: { de: "Nur PLINQ-Abfragen unterstützen es: WithCancellation(...) ist eine Methode von ParallelEnumerable, zu der es keine Enumerable-Entsprechung gibt (18.5.6, Seite 1254). Zum Abbrechen einer sequenziellen Abfrage müsste man ein CancellationToken im Lambda selbst prüfen.", en: "Only PLINQ queries support it: WithCancellation(...) is a method of ParallelEnumerable with no Enumerable counterpart (18.5.6, page 1254). To cancel a sequential query you would have to check a CancellationToken inside the lambda yourself." }
  - type: multipleChoice
    id: aussage-5
    prompt: { de: "Aussage: Mit dem LINQ-Operator Zip() lässt sich eine Datei komprimieren. (18.6 Aufgabe 1.5)", en: "Statement: You can compress a file using the LINQ Zip() operator. (18.6 Exercise 1.5)" }
    options:
      - { de: "Richtig", en: "Correct" }
      - { de: "Falsch", en: "Wrong" }
    correct: [1]
    explanation: { de: "Zip() paart die Elemente zweier Sequenzen. Dateien komprimiert man mit System.IO.Compression.ZipFile (Namensvetter, keine Beziehung).", en: "Zip() pairs the elements of two sequences. Files are compressed using System.IO.Compression.ZipFile (namesake, no relation)." }
