id: fortgeschritten-muster-grundlagen
title: { de: "Muster: Konstante, Typ, Relation, logisch", en: "Patterns: Constant, Type, Relational, Logical" }
reading:
  section: "15.2.3"
  title: { de: "Typ- und Deklarationsmuster", en: "Type and Declaration Patterns" }
  printedPage: 975
teaches:
  - patterns.constant
  - patterns.type
  - patterns.relational
  - patterns.logical
requires:
  - control.switch-expression
  - nullable.null-conditional
  - inheritance.type-test
  - operators.logical
  - records.declare
items:
  - type: coding
    id: muster
    openFile: "Musterabgleich/Muster.cs"
    openLine: 7
    testProject: "Musterabgleich Tests/Musterabgleich.Tests.csproj"
  - type: multipleChoice
    id: not-or
    prompt: { de: "Für welche Werte von x ist der Ausdruck x is not 1 or 2 wahr?", en: "For which values of x is the expression \"x is not 1 or 2\" true?" }
    options:
      - { de: "Für alle Werte außer 1, denn not bindet stärker als or: (not 1) or 2.", en: "For all values except 1, because \"not\" has higher precedence than \"or\": (not 1) or 2." }
      - { de: "Für alle Werte außer 1 und 2.", en: "For all values except 1 and 2." }
      - { de: "Nur für den Wert 2.", en: "Only for the value 2." }
      - { de: "Für gar keinen: Das Muster ist ein Übersetzungsfehler.", en: "For none: the pattern is a compile error." }
    correct: [0]
    explanation: { de: "15.2.9 (Seite 984). Die Rangfolge der Musterkombinatoren ist not vor and vor or. Gemeint ist meist x is not (1 or 2), das für alle Werte außer 1 und 2 gilt; dafür braucht es die Klammern. Ohne Klammern übersetzt der Compiler die Zeile, warnt aber mit CS9336 (Muster redundant), weil or 2 nichts mehr ändert.", en: "15.2.9 (page 984). The precedence of the pattern combinators is not before and before or. What is usually meant is x is not (1 or 2), which is true for all values except 1 and 2; that needs the parentheses. Without them the compiler accepts the line but warns with CS9336 (redundant pattern), because or 2 changes nothing." }
