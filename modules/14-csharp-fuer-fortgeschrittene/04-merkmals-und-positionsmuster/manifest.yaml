  - type: multipleChoice
    id: null-und-merkmalsmuster
    prompt: { de: "Was liefert p is { X: 0 }, wenn p den Wert null hat?" }
    options:
      - { de: "false, ein Merkmalsmuster passt nie auf null; es gibt keine Ausnahme." }
      - { de: "Eine NullReferenceException, weil p.X gelesen wird." }
      - { de: "true, weil null wie 0 behandelt wird." }
      - { de: "Einen Übersetzungsfehler." }
    correct: [0]
    explanation: { de: "15.2.4 (Seite 976). Das Merkmalsmuster prüft zuerst, ob der Wert nicht null ist. Deshalb sind { Halter.Land: \"DE\" } und Ähnliches null-sicher." }
