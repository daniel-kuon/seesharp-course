id: fortgeschritten-merkmals-und-positionsmuster
title: { de: "Merkmals-, Positions- und var-Muster", en: "Property, Positional, and var Patterns" }
reading:
  section: "15.2.4"
  title: { de: "Merkmalsmuster", en: "Property Patterns" }
  printedPage: 976
teaches:
  - patterns.property
  - patterns.when-guard
  - patterns.positional
  - patterns.var
requires:
  - patterns.constant
  - patterns.type
  - patterns.relational
  - patterns.logical
  - records.declare
  - tuples.deconstruct
  - oop.property-auto
items:
  - type: coding
    id: muster
    openFile: "Merkmalsmuster/Muster.cs"
    openLine: 5
    testProject: "Merkmalsmuster Tests/Merkmalsmuster.Tests.csproj"
  - type: multipleChoice
    id: null-und-merkmalsmuster
    prompt: { de: "Was liefert p is { X: 0 }, wenn p den Wert null hat?", en: "What does p is { X: 0 } return if p is null?" }
    options:
      - { de: "false, ein Merkmalsmuster passt nie auf null; es gibt keine Ausnahme.", en: "false; a property pattern never matches null, and no exception is thrown." }
      - { de: "Eine NullReferenceException, weil p.X gelesen wird.", en: "A NullReferenceException, because p.X is read." }
      - { de: "true, weil null wie 0 behandelt wird.", en: "true, because null is treated as 0." }
      - { de: "Einen Übersetzungsfehler.", en: "A compile error." }
    correct: [0]
    explanation: { de: "15.2.4 (Seite 976, die null-Regel auf Seite 978). Das Merkmalsmuster prüft zuerst, ob der Wert nicht null ist, und liest X nur dann. Deshalb sind { Halter.Land: \"DE\" } und Ähnliches null-sicher.", en: "15.2.4 (page 976, the null rule on page 978). The property pattern first checks that the value is not null and reads X only then. Therefore { Halter.Land: \"DE\" } and similar patterns are null-safe." }
