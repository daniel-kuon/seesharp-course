id: fortgeschritten-tupel-liste-und-maut
title: { de: "Tupel- und Listenmuster; Mautrechner", en: "Tuple and List Patterns; Toll Calculator" }
reading:
  section: "15.2.10"
  title: { de: "Listenmuster", en: "List Patterns" }
  printedPage: 985
teaches:
  - patterns.tuple
  - patterns.list
  - patterns.combine-in-switch
requires:
  - patterns.property
  - patterns.positional
  - patterns.relational
  - patterns.logical
  - patterns.when-guard
  - collections.expression
  - interfaces.ienumerable
  - enums.declare
items:
  - type: coding
    id: maut
    openFile: "TupelListeMaut/Spiele.cs"
    openLine: 10
    testProject: "TupelListeMaut Tests/TupelListeMaut.Tests.csproj"
  - type: multipleChoice
    id: listenmuster
    prompt: { de: "Auf welche Arrays passt das Listenmuster [1, .., 9]?", en: "Which arrays match the list pattern [1, .., 9]?" }
    options:
      - { de: "Auf jedes Array mit mindestens zwei Elementen, dessen erstes Element 1 und dessen letztes 9 ist (auch [1, 9]).", en: "Any array with at least two elements, where the first element is 1 and the last element is 9 (including [1, 9])." }
      - { de: "Nur auf Arrays mit genau drei Elementen.", en: "Only on arrays with exactly three elements." }
      - { de: "Auf jedes Array, das irgendwo eine 1 und später eine 9 enthält.", en: "Any array that contains a 1 somewhere and a 9 later on." }
      - { de: "Auch auf [1] und [9], weil .. für beliebig viele Elemente (auch keines) steht.", en: "Also [1] and [9], because .. stands for any number of elements, including none." }
    correct: [0]
    explanation: { de: "15.2.10.1 (Seite 985 f.). Das Bereichsmuster .. steht für null oder mehr Elemente in der Mitte, aber 1 und 9 sind zwei verschiedene Positionen; deshalb braucht das Muster mindestens zwei Elemente. Die Länge ist sonst beliebig, und die 1 muss das erste, die 9 das letzte Element sein, nicht irgendwo.", en: "15.2.10.1 (pages 985 f.). The slice pattern .. stands for zero or more elements in the middle, but 1 and 9 are two different positions; therefore the pattern needs at least two elements. Otherwise the length is arbitrary, and 1 must be the first and 9 the last element, not just anywhere." }
