id: dateien-binaerdaten
title: { de: "Binärdateien: FileStream und BinaryWriter", en: "Binary Files: FileStream and BinaryWriter" }
reading:
  section: "16.3.1"
  title: { de: "Schreiben und Lesen im Binärformat", en: "Writing and Reading in Binary Format" }
  printedPage: 1032
teaches:
  - files.filestream-bytes
  - files.filemode-access
  - files.binary-readwrite
requires:
  - files.streamwriter
  - files.streamreader-lines
  - exceptions.finally
  - arrays.array-class
  - types.int
items:
  - type: coding
    id: binaerdaten
    openFile: "Binaerdateien/Binaerdaten.cs"
    openLine: 9
    testProject: "Binaerdateien Tests/Binaerdateien.Tests.csproj"
  - type: multipleChoice
    id: filemode
    prompt: { de: "Welcher FileMode legt eine Datei neu an und wirft eine IOException, wenn sie schon existiert?", en: "Which FileMode creates a new file and throws an IOException if it already exists?" }
    options:
      - { de: "FileMode.CreateNew", en: "FileMode.CreateNew" }
      - { de: "FileMode.Create", en: "FileMode.Create" }
      - { de: "FileMode.OpenOrCreate", en: "FileMode.OpenOrCreate" }
      - { de: "FileMode.Truncate", en: "FileMode.Truncate" }
    correct: [0]
    explanation: { de: "16.1.4.1 (Seite 1019). Create überschreibt eine vorhandene Datei (kürzt sie auf Länge 0), OpenOrCreate öffnet sie unverändert, Truncate verlangt, dass sie existiert, und leert sie; nur CreateNew weigert sich bei vorhandener Datei.", en: "16.1.4.1 (page 1019). `Create` overwrites an existing file (truncating it to length 0); `OpenOrCreate` opens it unchanged; `Truncate` requires that the file exist and empties it; only `CreateNew` fails if a file already exists." }
  - type: multipleChoice
    id: read-liefert-weniger
    prompt: { de: "stream.Read(puffer, 0, 4096) liefert 1000. Was bedeutet das?", en: "stream.Read(buffer, 0, 4096) returns 1000. What does that mean?" }
    options:
      - { de: "Es wurden 1000 Bytes gelesen; bei 0 ist das Ende erreicht. Zwischen 1 und 4096 ist alles möglich, deshalb muss man den Rückgabewert verwenden.", en: "1,000 bytes were read; a value of 0 indicates the end of the data. Any value between 1 and 4,096 is possible, so you must use the return value." }
      - { de: "Der Puffer ist zu klein; es wird eine Ausnahme geworfen.", en: "The buffer is too small; an exception is thrown." }
      - { de: "Die Datei ist genau 1000 Bytes lang.", en: "The file is exactly 1,000 bytes long." }
      - { de: "Es wurden 4096 Bytes gelesen, 1000 davon sind gültig.", en: "4,096 bytes were read, 1,000 of which are valid." }
    correct: [0]
    explanation: { de: "16.1.3.1 (Seite 1015). Read liefert die tatsächlich gelesene Zahl, 0 am Datenende. Wer immer den ganzen Puffer schreibt, hängt Müll an das Dateiende.", en: "16.1.3.1 (page 1015). The `Read` function returns the number that was actually read, with a 0 at the end of the data. Whoever writes the entire buffer appends garbage to the end of the file." }
