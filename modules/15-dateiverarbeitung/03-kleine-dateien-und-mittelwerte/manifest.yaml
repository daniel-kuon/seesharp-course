id: dateien-kleine-dateien-und-mittelwerte
title: { de: "Kleine Dateien und Spaltenmittelwerte", en: "Small Files and Column Averages" }
reading:
  section: "16.4"
  title: { de: "Schreiben und Lesen von kleinen Dateien mit Bytes oder Texten", en: "Reading and Writing Small Files Containing Bytes or Text" }
  printedPage: 1041
teaches:
  - files.readall-writeall
  - files.parse-delimited-text
  - files.invariant-culture
requires:
  - files.streamreader-lines
  - exceptions.parse-handling
  - exceptions.catch-specific
  - strings.methods
  - tuples.return-multiple
  - collections.list-add-remove
items:
  - type: coding
    id: mittelwerte
    openFile: "Mittelwertrechnung/Mittelwerte.cs"
    openLine: 17
    testProject: "Mittelwertrechnung Tests/Mittelwertrechnung.Tests.csproj"
  - type: multipleChoice
    id: kultur
    prompt: { de: "Die Datei daten.txt existiert schon und hat 10 Zeilen. Was passiert bei File.WriteAllLines(\"daten.txt\", [\"a\", \"b\"])?", en: "The file daten.txt already exists and has 10 lines. What happens with File.WriteAllLines(\"daten.txt\", [\"a\", \"b\"])?" }
    options:
      - { de: "Die Datei wird überschrieben und enthält danach nur die zwei Zeilen a und b. Zum Anhängen gibt es AppendAllLines.", en: "The file is overwritten and afterwards contains only the two lines a and b. To append, there is AppendAllLines." }
      - { de: "Die zwei Zeilen werden hinten angehängt; die Datei hat danach 12 Zeilen.", en: "The two lines are appended at the end; the file then has 12 lines." }
      - { de: "Es gibt eine IOException, weil die Datei schon existiert.", en: "An IOException is thrown because the file already exists." }
      - { de: "Die Datei bleibt geöffnet, bis man Close() aufruft.", en: "The file stays open until you call Close()." }
    correct: [0]
    explanation: { de: "16.4 (Seite 1042 f.): Die File-Methoden öffnen intern einen FileStream mit FileMode.Create (eine vorhandene Datei wird überschrieben) und schließen die Datei selbst, auch im Fehlerfall. Erweitern statt überschreiben: AppendAllLines.", en: "16.4 (pages 1042–1043): The File methods internally open a FileStream with FileMode.Create (an existing file is overwritten) and close the file themselves, even if an error occurs. To extend instead of overwrite: AppendAllLines." }
