id: dateien-ressourcen-freigeben
title: { de: "using, Dispose und AutoFlush" }
reading:
  section: "16.2.3"
  title: { de: "using-Anweisung" }
  printedPage: 1027
teaches:
  - resources.dispose-close
  - resources.using-statement
  - resources.using-declaration
  - resources.try-with-using
  - files.flush-autoflush
requires:
  - files.streamwriter
  - files.streamreader-lines
  - exceptions.finally
  - exceptions.try-catch
  - delegates.generic-func
  - interfaces.as-type
items:
  - type: coding
    id: freigabe
    openFile: "Ressourcenfreigabe/Freigabe.cs"
    openLine: 12
    testProject: "Ressourcenfreigabe Tests/Ressourcenfreigabe.Tests.csproj"
  - type: multipleChoice
    id: using-expansion
    prompt: { de: "In welchen Code übersetzt der Compiler using (var s = Oeffne()) { Benutze(s); }?" }
    options:
      - { de: "In einen try-Block mit Benutze(s); und einem finally-Block, der s.Dispose() aufruft (falls s nicht null ist)." }
      - { de: "In einen Aufruf von Benutze(s), gefolgt von s.Close() ohne try-Block." }
      - { de: "In einen Aufruf von Benutze(s); die Freigabe übernimmt später der Garbage Collector." }
      - { de: "In einen try-Block mit catch (Exception), der Fehler beim Benutzen verschluckt." }
    correct: [0]
    explanation: { de: "16.2.3 (Seite 1027). using ist Kurzschreibweise für try/finally mit Dispose(). Die Ausnahme aus Benutze(s) läuft nach der Freigabe weiter, sie wird nicht verschluckt." }
  - type: multipleChoice
    id: autoflush
    prompt: { de: "Ein StreamWriter mit AutoFlush = true schreibt 30 000 Zeilen mit WriteLine. Was ist die Folge?" }
    options:
      - { de: "Jede Zeile wird sofort an den Strom weitergereicht; das ist für Protokolle richtig, bei Massendaten aber viel langsamer als einmaliges Flush() am Ende." }
      - { de: "Nichts; AutoFlush hat keinen Einfluss auf die Geschwindigkeit." }
      - { de: "Die Datei wird nie geschlossen." }
      - { de: "Der Puffer wächst, bis der Speicher voll ist." }
    correct: [0]
    explanation: { de: "16.2.3 und 16.3.2.1.3 (Seite 1038); Übung 16.7/2 (Seite 1060). AutoFlush bedeutet: nach jedem Schreibaufruf Flush(). Das passt, wenn Sicherheit vor Tempo geht (z. B. Protokoll, bevor das Programm abstürzt)." }
