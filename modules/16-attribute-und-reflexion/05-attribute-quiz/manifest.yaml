id: attribute-quiz
title: { de: "Attribute: Quiz", en: "Attributes: Quiz" }
reading:
  section: "14.3"
  title: { de: "Attribute für Assemblen", en: "Attributes for Assemblies" }
  printedPage: 929
teaches:
  - attributes.conditional
  - attributes.assembly-level
requires:
  - attributes.apply
  - attributes.obsolete
  - attributes.caller-info
  - attributes.flags
  - reflection.nameof
items:
  - type: multipleChoice
    id: assembly
    prompt: { de: "Wo steht [assembly: CLSCompliant(true)] und worauf bezieht es sich?", en: "Where is [assembly: CLSCompliant(true)] located, and what does it refer to?" }
    options:
      - { de: "In irgendeiner Quelldatei des Projekts auf oberster Ebene (klassisch in AssemblyInfo.cs), außerhalb jeder Typdeklaration. Das vorangestellte assembly: legt fest, dass das Attribut die ganze Assembly beschreibt.", en: "In any top-level source file of the project (typically in AssemblyInfo.cs), outside of any type declaration. The \"assembly:\" prefix specifies that the attribute applies to the entire assembly." }
      - { de: "Direkt vor einer Klasse; der Compiler erkennt am Namen, dass die ganze Assembly gemeint ist.", en: "Immediately before a class; the compiler recognizes from the name that the entire assembly is meant." }
      - { de: "Nur in der .csproj-Datei; im Quelltext ist es nicht erlaubt.", en: "Only in the .csproj file; it is not allowed in the source code." }
    correct: [0]
    explanation: { de: "14.3 (Seite 929): Bei Assemblies lässt sich der Bezug nicht durch die Platzierung herstellen, deshalb die explizite Widmung. Für viele Assembly-Attribute (Version, Firma, Produkt) gibt es zusätzlich Projekteigenschaften in der .csproj.", en: "14.3 (page 929): With assemblies, the reference cannot be established through placement, which is why an explicit dedication is required. For many assembly attributes (version, company, product), there are also project properties in the .csproj file." }
  - type: multipleChoice
    id: conditional
    prompt: { de: "[Conditional(\"DEBUG\")] steht an der Methode Protokolliere(). Das Programm wird ohne das Symbol DEBUG übersetzt. Was passiert?", en: "`[Conditional(\"DEBUG\")]` is on the method `Protokolliere()`. The program is compiled without the `DEBUG` symbol. What happens?" }
    options:
      - { de: "Der Compiler lässt die AUFRUFE von Protokolliere() weg; die Methode selbst bleibt in der Assembly. Argumente der entfernten Aufrufe werden gar nicht erst ausgewertet.", en: "The compiler omits the calls to `Protokolliere()`; the method itself remains in assembly code. Arguments for the omitted calls are not evaluated at all." }
      - { de: "Die Methode wird aus der Assembly entfernt; Aufrufe führen zu einem Laufzeitfehler.", en: "The method is removed from the assembly; calls to it result in a runtime error." }
      - { de: "Die Methode wird zur Laufzeit übersprungen, indem sie bei jedem Aufruf prüft, ob DEBUG gesetzt ist.", en: "The method is skipped at runtime by checking whether DEBUG is set each time it is called." }
    correct: [0]
    explanation: { de: "14.5.2 (Seite 935). Die Entscheidung fällt beim Übersetzen der AUFRUFSTELLE, nicht zur Laufzeit. Deshalb muss die Methode void sein, und deshalb eignet sich die Aufgabe nicht für automatische Tests: Ob das Symbol gesetzt ist, bestimmt der Build, nicht der Test.", en: "14.5.2 (page 935). The decision is made when the CALLSITE is translated, not at runtime. Therefore, the method must be void, and for this reason, the task is not suitable for automated testing: Whether the symbol is set is determined by the build, not by the test." }
  - type: multipleChoice
    id: step-through
    prompt: { de: "Was bewirkt [DebuggerStepThrough] an einer Methode?", en: "What does [DebuggerStepThrough] do to a method?" }
    options:
      - { de: "Der Debugger hält im Einzelschrittmodus und an Haltepunkten innerhalb der Methode nicht an; das Verhalten des Programms ändert sich nicht.", en: "The debugger does not pause in single-step mode or at breakpoints within the method; the program's behavior does not change." }
      - { de: "Die Methode wird in Release-Builds nicht ausgeführt.", en: "The method is not executed in release builds." }
      - { de: "Ausnahmen in der Methode werden verschluckt, damit der Debugger nicht stoppt.", en: "Exceptions in the method are swallowed so that the debugger does not stop." }
    correct: [0]
    explanation: { de: "14.5.3 (Seite 937). Ein reines Werkzeug-Attribut: Es ändert nur, wie der Debugger durch den Code läuft. Sinnvoll für triviale Hilfsmethoden, durch die man nicht schrittweise gehen will.", en: "14.5.3 (page 937). A purely utility-based attribute: It only changes how the debugger steps through the code. Useful for trivial helper methods that you don't want to step through." }
  - type: multipleChoice
    id: struct-layout
    prompt: { de: "[StructLayout(LayoutKind.Explicit)] mit zwei [FieldOffset(0)]-Feldern (float f; uint u;): Wozu dient das?", en: "[StructLayout(LayoutKind.Explicit)] with two [FieldOffset(0)] fields (float f; uint u;): What is this for?" }
    options:
      - { de: "Beide Felder liegen an derselben Speicherstelle (Union wie in C): Man schreibt einen float und liest dieselben vier Bytes als uint, z. B. um die Bits einer Gleitkommazahl zu betrachten.", en: "Both fields are located at the same memory location (a union, as in C): You write a float and read the same four bytes as a uint, for example, to examine the bits of a floating-point number." }
      - { de: "Der Compiler erzeugt zwei getrennte Felder und synchronisiert sie bei jedem Zugriff.", en: "The compiler creates two separate arrays and synchronizes them every time they are accessed." }
      - { de: "Die Struktur wird auf dem Heap statt auf dem Stack abgelegt.", en: "The structure is stored on the heap rather than on the stack." }
    correct: [0]
    explanation: { de: "14.5.5 (Seite 940), Beispiel FloatBits. Typisch bei Interoperabilität mit nativem Code; im Alltag selten.", en: "14.5.5 (page 940), FloatBits example. Typical in cases of interoperability with native code; rarely encountered in everyday use." }
  - type: multipleChoice
    id: attribut-vs-basisklasse
    prompt: { de: "Wodurch unterscheidet sich ein Attribut davon, einfach eine Basisklasse zu erben?", en: "How does an attribute differ from simply inheriting from a base class?" }
    options:
      - { de: "Ein Attribut hängt Metadaten an ein Element, ohne dessen Typhierarchie oder Verhalten zu ändern; es kann auch an Methoden, Eigenschaften, Parameter und Assemblies stehen und wird erst von Compiler oder Werkzeug (per Reflexion) gelesen.", en: "An attribute attaches metadata to an element without changing its type hierarchy or behavior; it can also be attached to methods, properties, parameters, and assemblies, and is read only by the compiler or a tool (via reflection)." }
      - { de: "Ein Attribut ist nur eine andere Schreibweise für eine Basisklasse.", en: "An attribute is just another way of referring to a base class." }
      - { de: "Ein Attribut ersetzt Vererbung und ist schneller, weil es zur Laufzeit nicht gelesen wird.", en: "An attribute replaces inheritance and is faster because it is not read at runtime." }
    correct: [0]
    explanation: { de: "Vererbung beschreibt, WAS ein Typ ist und wie er sich verhält (Polymorphie). Attribute beschreiben, WIE ihn jemand behandeln soll: serialisieren, validieren, als veraltet kennzeichnen. Eine Klasse hat eine Basisklasse, aber beliebig viele Attribute.", en: "Inheritance describes WHAT a type is and how it behaves (polymorphism). Attributes describe HOW it should be treated: serialized, validated, or marked as obsolete. A class has one base class but any number of attributes." }
  - type: multipleChoice
    id: return-target
    prompt: { de: "In [return: NotNull] public string Lade() ...: Was legt return: fest?", en: "In [return: NotNull] public string Lade() ...: What does return: specify?" }
    options:
      - { de: "Das Attribut gilt für den RÜCKGABEWERT der Methode, nicht für die Methode selbst. Das Präfix (Attributziel) ist nötig, weil das Attribut sonst der Methode zugeordnet würde.", en: "The attribute applies to the RETURN VALUE of the method, not to the method itself. The prefix (attribute target) is necessary because otherwise the attribute would be assigned to the method." }
      - { de: "Das Attribut wird nur ausgewertet, wenn die Methode erfolgreich zurückkehrt.", en: "The attribute is evaluated only if the method returns successfully." }
      - { de: "Es ist gleichbedeutend mit [NotNull] direkt vor Lade; return: ist nur eine Stilfrage.", en: "It is equivalent to `[NotNull]` directly in front of `Lade`; `return:` is just a matter of style." }
    correct: [0]
    explanation: { de: "Auch assembly: ist ein solches Ziel (14.3). Zielangaben wie return:, param:, assembly: nennt man Attributziel-Präfixe; im Buch erscheint return: bei den Lambda-Attributen (14.8, Seite 945).", en: "\"assembly:\" is also one such target (14.3). Target specifications such as \"return:\", \"param:\", and \"assembly:\" are called attribute target prefixes; in the book, \"return:\" appears in the section on lambda attributes (14.8, page 945)." }
  - type: open
    id: obsolete-error
    prompt: { de: "Ein Kommentar \"bitte nicht mehr verwenden\" an einer alten Methode genügt oft nicht. Warum ist [Obsolete(\"Bitte Neu() verwenden\", error: true)] das bessere Werkzeug für eine Migration, und wann würdest du bewusst bei error: false bleiben?", en: "A comment \"please do not use anymore\" on an old method is often not enough. Why is `[Obsolete(\"Bitte Neu() verwenden\", error: true)]` the better tool for a migration, and when would you deliberately stay with `error: false`?" }
