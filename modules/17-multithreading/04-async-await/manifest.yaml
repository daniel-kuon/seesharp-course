id: threads-async-await
title: { de: "async und await", en: "async and await" }
reading:
  section: "17.6.4"
  title: { de: "Definition von async-Methoden", en: "Definition of Async Methods" }
  printedPage: 1169
teaches:
  - async.declare
  - async.await
  - async.exception-handling
  - async.cancellation
  - async.avoid-async-void
  - async.avoid-blocking
requires:
  - tasks.run
  - tasks.when-all-any
  - tasks.cancellation
  - tasks.aggregate-exception
  - exceptions.try-catch
  - files.readall-writeall
