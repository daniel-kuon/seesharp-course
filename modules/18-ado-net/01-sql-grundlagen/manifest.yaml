id: adonet-sql-grundlagen
title: { de: "SQL-Grundlagen mit SQLite", en: "SQL Basics with SQLite" }
reading:
  section: "19.6"
  title: { de: "SQL", en: "SQL" }
  printedPage: 1296
teaches:
  - sql.create-table
  - sql.primary-foreign-key
  - sql.insert
  - sql.select-where
  - sql.update-delete
  - sql.join
  - sql.aggregate-group
requires:
  - strings.methods
  - types.string-basic
items:
  - type: coding
    id: skripte
    openFile: "SqlGrundlagen/Skripte.cs"
    openLine: 11
    testProject: "SqlGrundlagen Tests/SqlGrundlagen.Tests.csproj"
    # Pflichttests (Buch). Extra (Deep Dive): Schema_verlangt_eindeutige_Kategorienamen,
    # KategorienMitMehrerenArtikeln_filtert_mit_HAVING, LoescheLeereKategorien_entfernt_nur_Kategorien_ohne_Artikel
    requiredTests:
      - SkripteTests.Schema_legt_beide_Tabellen_an
      - SkripteTests.Schema_deklariert_Primaerschluessel_und_Fremdschluessel
      - SkripteTests.Schema_weist_Artikel_mit_unbekannter_Kategorie_ab
      - SkripteTests.Schema_weist_negative_Preise_ab
      - SkripteTests.Schema_verlangt_Namen
      - SkripteTests.Daten_fuegt_Kategorien_und_Artikel_ein
      - SkripteTests.TeureArtikel_liefert_Artikel_ueber_10_absteigend
      - SkripteTests.ArtikelMitKategorie_verknuepft_und_sortiert
      - SkripteTests.AnzahlProKategorie_gruppiert_und_zaehlt
      - SkripteTests.Preiserhoehung_erhoeht_nur_die_Kategorie_Garten
  - type: multipleChoice
    id: where-having
    prompt: { de: "Du willst je Kategorie zählen, wie viele Artikel mehr als 10 kosten. Welche Abfrage liefert das?", en: "For each category you want to count how many items cost more than 10. Which query returns that?" }
    options:
      - { de: "SELECT KategorieId, COUNT(*) FROM Artikel WHERE Preis > 10 GROUP BY KategorieId", en: "SELECT KategorieId, COUNT(*) FROM Artikel WHERE Preis > 10 GROUP BY KategorieId" }
      - { de: "SELECT KategorieId, COUNT(*) FROM Artikel WHERE Preis > 10", en: "SELECT KategorieId, COUNT(*) FROM Artikel WHERE Preis > 10" }
      - { de: "SELECT KategorieId, COUNT(*) FROM Artikel GROUP BY KategorieId ORDER BY Preis > 10", en: "SELECT KategorieId, COUNT(*) FROM Artikel GROUP BY KategorieId ORDER BY Preis > 10" }
    correct: [0]
    explanation: { de: "WHERE (19.6.4.2) wählt zuerst die Zeilen mit Preis über 10 aus, GROUP BY (19.6.4.6) bildet daraus je Kategorie eine Gruppe, und COUNT(*) zählt je Gruppe. Ohne GROUP BY zählt COUNT(*) über die ganze Ergebnistabelle statt je Kategorie (19.6.4.5). ORDER BY sortiert nur und filtert nichts.", en: "WHERE (19.6.4.2) first selects the rows priced over 10, GROUP BY (19.6.4.6) forms one group per category from them, and COUNT(*) counts per group. Without GROUP BY, COUNT(*) counts over the whole result table instead of per category (19.6.4.5). ORDER BY only sorts and filters nothing." }
