id: adonet-sql-grundlagen
title: { de: "SQL-Grundlagen mit SQLite", en: "SQL Basics with SQLite" }
reading:
  section: "19.6"
  title: { de: "SQL", en: "SQL" }
  printedPage: 1296
teaches:
  - sql.create-table
  - sql.primary-foreign-key
  - sql.insert
  - sql.select-where
  - sql.update-delete
  - sql.join
  - sql.aggregate-group
requires:
  - strings.methods
  - types.string-basic
items:
  - type: coding
    id: skripte
    openFile: "SqlGrundlagen/Skripte.cs"
    openLine: 11
    testProject: "SqlGrundlagen Tests/SqlGrundlagen.Tests.csproj"
  - type: multipleChoice
    id: where-having
    prompt: { de: "Du willst nur Kategorien mit mehr als einem Artikel auflisten. Wo gehört die Bedingung COUNT(*) > 1 hin?", en: "You only want to list categories with more than one item. Where should the condition COUNT(*) > 1 go?" }
    options:
      - { de: "In die WHERE-Klausel, denn WHERE filtert alle Zeilen.", en: "In the WHERE clause, because WHERE filters all rows." }
      - { de: "In die HAVING-Klausel, denn sie filtert die Gruppen, nachdem GROUP BY und die Aggregatfunktion ausgewertet wurden.", en: "In the HAVING clause, because it filters the groups after the GROUP BY clause and the aggregate function have been evaluated." }
      - { de: "In die ORDER-BY-Klausel, denn dort stehen alle Bedingungen zur Anzahl.", en: "In the ORDER BY clause, because that's where all the conditions related to the count are listed." }
    correct: [1]
    explanation: { de: "19.6.4: WHERE wählt einzelne Zeilen vor dem Gruppieren aus und kennt keine Aggregatergebnisse; HAVING wählt Gruppen nach dem Gruppieren aus. ORDER BY sortiert nur.", en: "19.6.4: WHERE selects individual rows before grouping and does not take aggregate results into account; HAVING selects groups after grouping. ORDER BY only sorts." }
