items:
  - type: coding
    id: artikel-repository
    openFile: "Artikelverwaltung/ArtikelRepository.cs"
    openLine: 31
    testProject: "Artikelverwaltung Tests/Artikelverwaltung.Tests.csproj"
  - type: multipleChoice
    id: getstring-null
    prompt: { de: "In der Spalte Kategorie steht für einen Artikel NULL. Was passiert bei leser.GetString(spalte), wenn du vorher nicht IsDBNull(spalte) geprüft hast?" }
    options:
      - { de: "GetString liefert null, das passt zum Typ string?." }
      - { de: "GetString liefert eine leere Zeichenkette." }
      - { de: "GetString löst eine Ausnahme aus, denn die Spalte enthält keinen Wert; null muss man vorher mit IsDBNull abfangen." }
    correct: [2]
    explanation: { de: "19.7.15: Die typisierten Get-Methoden (GetString, GetInt32, GetDecimal ...) können NULL nicht darstellen und lösen eine Ausnahme aus. Erst IsDBNull fragen, dann lesen; sonst ist der Programmierfehler nur bei Zeilen mit NULL sichtbar." }
