id: adonet-datareader-und-objekte
title: { de: "DataReader und Objektabbildung", en: "DataReader and Object Mapping" }
reading:
  section: "19.7.15"
  title: { de: "DbDataReader", en: "DbDataReader" }
  printedPage: 1363
teaches:
  - ado.datareader
  - ado.map-rows
requires:
  - ado.execute-scalar
  - ado.parameters
  - ado.dbnull
  - records.declare
  - collections.list-add-remove
  - collections.dictionary-add-lookup
items:
  - type: coding
    id: artikel-repository
    openFile: "Artikelverwaltung/ArtikelRepository.cs"
    openLine: 31
    testProject: "Artikelverwaltung Tests/Artikelverwaltung.Tests.csproj"
  - type: multipleChoice
    id: getstring-null
    prompt: { de: "In der Spalte Kategorie steht für einen Artikel NULL. Was liefert der Indexer leser[\"Kategorie\"] für diese Zeile?", en: "In the `Kategorie` column, an item has NULL. What does the indexer `leser[\"Kategorie\"]` return for this row?" }
    options:
      - { de: "null, das passt zum Typ string?.", en: "null, which fits the type string?." }
      - { de: "Eine leere Zeichenkette.", en: "An empty string." }
      - { de: "DBNull.Value, also ein Objekt und nicht null; man prüft mit is DBNull und macht selbst null daraus. Ein Cast (string)leser[\"Kategorie\"] würde eine InvalidCastException werfen.", en: "DBNull.Value, an object and not null; you check with is DBNull and turn it into null yourself. A cast (string)leser[\"Kategorie\"] would throw an InvalidCastException." }
    correct: [2]
    explanation: { de: "19.7.15: Der Indexer liefert ein object. Ein fehlender Wert ist in ADO.NET DBNull.Value (wie bei ExecuteScalar in Aufgabe 2 und bei DataRow in 19.7.11), nicht null. Erst prüfen, dann umwandeln; sonst zeigt sich der Fehler nur bei Zeilen mit NULL.", en: "19.7.15: The indexer returns an object. A missing value in ADO.NET is DBNull.Value (as with ExecuteScalar in exercise 2 and with DataRow in 19.7.11), not null. Check first, then convert; otherwise the error only shows up in rows containing NULL." }
