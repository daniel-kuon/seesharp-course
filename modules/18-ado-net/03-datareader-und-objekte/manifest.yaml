id: adonet-datareader-und-objekte
title: { de: "DataReader und Objektabbildung", en: "DataReader and Object Mapping" }
reading:
  section: "19.7.15"
  title: { de: "DbDataReader", en: "DbDataReader" }
  printedPage: 1363
teaches:
  - ado.datareader
  - ado.map-rows
requires:
  - ado.execute-scalar
  - ado.parameters
  - ado.dbnull
  - records.declare
  - collections.list-add-remove
  - collections.dictionary-add-lookup
items:
  - type: coding
    id: artikel-repository
    openFile: "Artikelverwaltung/ArtikelRepository.cs"
    openLine: 31
    testProject: "Artikelverwaltung Tests/Artikelverwaltung.Tests.csproj"
  - type: multipleChoice
    id: getstring-null
    prompt: { de: "In der Spalte Kategorie steht für einen Artikel NULL. Was passiert bei leser.GetString(spalte), wenn du vorher nicht IsDBNull(spalte) geprüft hast?", en: "In the `Kategorie` column, an item has NULL. What happens with `leser.GetString(spalte)` if you have not checked `IsDBNull(spalte)` first?" }
    options:
      - { de: "GetString liefert null, das passt zum Typ string?.", en: "GetString returns null, which is consistent with the string? type." }
      - { de: "GetString liefert eine leere Zeichenkette.", en: "GetString returns an empty string." }
      - { de: "GetString löst eine Ausnahme aus, denn die Spalte enthält keinen Wert; null muss man vorher mit IsDBNull abfangen.", en: "GetString throws an exception because the column does not contain a value; you must first check for null using IsDBNull." }
    correct: [2]
    explanation: { de: "19.7.15: Die typisierten Get-Methoden (GetString, GetInt32, GetDecimal ...) können NULL nicht darstellen und lösen eine Ausnahme aus. Erst IsDBNull fragen, dann lesen; sonst ist der Programmierfehler nur bei Zeilen mit NULL sichtbar.", en: "July 19, 2015: The typed Get methods (GetString, GetInt32, GetDecimal, etc.) cannot handle NULL and will throw an exception. First check for IsDBNull, then read; otherwise, the programming error will only be visible in rows containing NULL." }
