id: adonet-transaktionen
title: { de: "Transaktionen: Commit und Rollback", en: "Transactions: Commit and Rollback" }
reading:
  section: "19.7.7"
  title: { de: "DbTransaction", en: "DbTransaction" }
  printedPage: 1332
teaches:
  - ado.transaction
  - ado.transaction-rollback
requires:
  - ado.execute-nonquery
  - ado.parameters
  - ado.execute-scalar
  - exceptions.try-catch
  - exceptions.rethrow
  - exceptions.finally
  - resources.using-statement
items:
  - type: coding
    id: bank
    openFile: "Bankgeschaefte/Bank.cs"
    openLine: 23
    testProject: "Bankgeschaefte Tests/Bankgeschaefte.Tests.csproj"
  - type: multipleChoice
    id: transactionscope
    prompt: { de: "Ein Programm benutzt using var scope = new TransactionScope(); führt zwei Datenbankänderungen aus und verlässt den Block, ohne scope.Complete() aufzurufen. Was geschieht mit den Änderungen?", en: "A program uses `using var scope = new TransactionScope();`, performs two database changes, and exits the block without calling `scope.Complete()`. What happens to the changes?" }
    options:
      - { de: "Sie werden dauerhaft gespeichert, weil die Befehle ja erfolgreich waren.", en: "They are saved permanently because the commands were successful." }
      - { de: "Sie werden zurückgenommen: Ohne Complete() macht Dispose des Scopes einen impliziten Rollback.", en: "They are rolled back: Without `Complete()`, `Dispose` on the scope performs an implicit rollback." }
      - { de: "Das Programm bricht mit einer Ausnahme ab, und die Änderungen bleiben halb gespeichert.", en: "The program crashes with an exception, and the changes are only partially saved." }
    correct: [1]
    explanation: { de: "19.7.8: TransactionScope ist der implizite Weg; nur mit Complete() wird beim Verlassen des Blocks bestätigt, sonst zurückgerollt. Mit Microsoft.Data.Sqlite lässt sich der Scope nicht für verteilte Transaktionen über mehrere Datenbanken nutzen; deshalb üben wir hier das ausdrückliche DbTransaction mit Commit und Rollback.", en: "19.7.8: TransactionScope is the implicit approach; only if Complete() was called is the work committed when the block is left, otherwise it is rolled back. With Microsoft.Data.Sqlite, the scope cannot be used for distributed transactions across multiple databases; therefore, we use the explicit DbTransaction with Commit and Rollback here." }
