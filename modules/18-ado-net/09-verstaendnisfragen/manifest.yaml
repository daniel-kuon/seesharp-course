id: adonet-verstaendnisfragen
title: { de: "Verständnisfragen", en: "Comprehension questions" }
reading:
  section: "19.7"
  title: { de: "ADO.NET: Verbindungen, Befehle, Leser und Transaktionen", en: "ADO.NET: Connections, Commands, Readers and Transactions" }
  printedPage: 1307
teaches:
  - ado.transaction
  - ado.transaction-rollback
  - ado.provider-independent
  - ado.datatable-load
requires:
  - sql.create-table
  - sql.primary-foreign-key
  - sql.select-where
  - ado.connection-open-close
  - ado.execute-nonquery
  - ado.execute-scalar
  - ado.parameters
