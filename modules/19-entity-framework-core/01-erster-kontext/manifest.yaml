id: efcore-erster-kontext
title: { de: "Der erste DbContext", en: "The First DbContext" }
reading:
  section: "20.1"
  title: { de: "Erster Eindruck und Überblick", en: "First Impressions and Overview" }
  printedPage: 1399
teaches:
  - ef.entity-class
  - ef.dbcontext-define
  - ef.ensure-created
  - ef.add-savechanges
  - ef.data-annotations
  - ef.dbcontext-lifetime
requires:
  - oop.property-auto
  - collections.list-add-remove
  - resources.using-statement
  - nullable.annotation
  - interfaces.as-type
  - inheritance.derive-class
  - inheritance.base-constructor
items:
  - type: coding
    id: blog-kontext
    openFile: "Blogging/BlogContext.cs"
    openLine: 14
    testProject: "Blogging Tests/Blogging.Tests.csproj"
  - type: multipleChoice
    id: maxlength-sqlite
    prompt: { de: "Dein Blog hat [MaxLength(100)] am Namen. Du speicherst mit SQLite einen Namen mit 150 Zeichen. Was geschieht?", en: "Your `Blog` has `[MaxLength(100)]` on the name. With SQLite you save a name with 150 characters. What happens?" }
    options:
      - { de: "SaveChanges wirft immer eine DbUpdateException, weil EF Core die Länge prüft.", en: "SaveChanges always throws a DbUpdateException because EF Core checks the length." }
      - { de: "Es wird gespeichert: EF Core legt die Spalte als TEXT an und SQLite erzwingt keine Längen. Beim SQL Server (nvarchar(100)) würde der Name abgewiesen. [MaxLength] ist hier nur ein Hinweis für das Schema.", en: "It is stored as follows: EF Core creates the column as TEXT, and SQLite does not enforce any length limits. In SQL Server (nvarchar(100)), the name would be rejected. [MaxLength] is only a note for the schema here." }
      - { de: "Der Name wird beim Speichern automatisch auf 100 Zeichen gekürzt.", en: "The name is automatically truncated to 100 characters when saved." }
    correct: [1]
    explanation: { de: "20.5 (Annotationen): Annotationen beeinflussen das erzeugte Schema; ob eine Regel durchgesetzt wird, entscheidet das Datenbanksystem. [Required] wird zu NOT NULL und von SQLite durchgesetzt, die Länge nicht. Wer die Länge sicher prüfen will, validiert zusätzlich im Programm.", en: "20.5 (Annotations): Annotations affect the generated schema; the database system determines whether a rule is enforced. [Required] becomes NOT NULL and is enforced by SQLite, but the length is not. If you want to ensure the length is correct, you must also validate it within the program." }
