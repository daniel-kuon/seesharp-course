id: efcore-erster-kontext
title: { de: "Der erste DbContext", en: "The First DbContext" }
reading:
  section: "20.1"
  title: { de: "Erster Eindruck und Überblick", en: "First Impressions and Overview" }
  printedPage: 1399
teaches:
  - ef.entity-class
  - ef.dbcontext-define
  - ef.ensure-created
  - ef.add-savechanges
  - ef.data-annotations
  - ef.dbcontext-lifetime
requires:
  - oop.property-auto
  - collections.list-add-remove
  - resources.using-statement
  - nullable.annotation
  - interfaces.as-type
  - inheritance.derive-class
  - inheritance.base-constructor
items:
  - type: coding
    id: blog-kontext
    openFile: "Blogging/BlogContext.cs"
    openLine: 14
    testProject: "Blogging Tests/Blogging.Tests.csproj"
  - type: multipleChoice
    id: maxlength-sqlite
    prompt: { de: "Die Eigenschaft Title einer Entität trägt [MaxLength(200), MinLength(5)]. Welchen Spaltentyp legt eine Migration für den SQL Server an?", en: "The property `Title` of an entity carries `[MaxLength(200), MinLength(5)]`. Which column type does a migration create for SQL Server?" }
    options:
      - { de: "nvarchar(max): Annotationen wirken sich nie auf das Schema aus.", en: "nvarchar(max): annotations never affect the schema." }
      - { de: "nvarchar(200); die Mindestlänge wirkt sich nicht auf das Datenbankschema aus.", en: "nvarchar(200); the minimum length does not affect the database schema." }
      - { de: "nvarchar(200) und zusätzlich eine CHECK-Restriktion für mindestens 5 Zeichen.", en: "nvarchar(200) plus a CHECK constraint for at least 5 characters." }
    correct: [1]
    explanation: { de: "20.5.5 (Seite 1423): MaxLength wird zum Spaltentyp nvarchar(200), der überlange Zeichenfolgen abweist; die Mindestlänge taucht im Schema nicht auf. Annotationen beeinflussen also das erzeugte Schema, aber nicht jede Annotation wird zu einer Datenbankregel.", en: "20.5.5 (page 1423): MaxLength becomes the column type nvarchar(200), which rejects overlong strings; the minimum length does not show up in the schema. Annotations thus affect the generated schema, but not every annotation becomes a database rule." }
