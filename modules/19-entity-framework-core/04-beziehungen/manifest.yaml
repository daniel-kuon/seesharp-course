id: efcore-beziehungen
title: { de: "Beziehungen: Include, Kaskade und Fluent API", en: "Relationships: Include, Cascade, and Fluent API" }
reading:
  section: "20.5.11"
  title: { de: "Master-Details - Beziehung", en: "Master Details - Relationship" }
  printedPage: 1429
teaches:
  - ef.relation-one-to-many
  - ef.include
  - ef.cascade-delete
  - ef.fluent-config
requires:
  - ef.entity-class
  - ef.dbcontext-define
  - ef.query-where-tolist
  - ef.remove
  - ef.add-savechanges
items:
  - type: coding
    id: beziehungen
    openFile: "Beziehungen/Datenmodell.cs"
    openLine: 44
    testProject: "Beziehungen Tests/Beziehungen.Tests.csproj"
  - type: multipleChoice
    id: ohne-include
    prompt: { de: "Du lädst mit kontext.Blogs.FirstOrDefault(b => b.Id == id) einen Blog ohne Include und gibst den Kontext frei. Was enthält blog.Beitraege (Lazy Loading ist nicht eingerichtet)?", en: "With `kontext.Blogs.FirstOrDefault(b => b.Id == id)` you load a `Blog` without `Include` and dispose the context. What does `blog.Beitraege` contain (lazy loading is not set up)?" }
    options:
      - { de: "Alle Beiträge des Blogs, EF Core lädt sie bei Bedarf nach.", en: "All blog posts; EF Core loads them as needed." }
      - { de: "Eine leere Liste (keine Ausnahme): Navigationseigenschaften werden nur geladen, wenn man es ausdrücklich verlangt, z. B. mit Include (Eager Loading).", en: "An empty list (no exception): Navigation properties are loaded only when explicitly requested, e.g., using `Include` (eager loading)." }
      - { de: "null, weil die Eigenschaft nicht geladen wurde.", en: "null, because the property was not loaded." }
    correct: [1]
    explanation: { de: "20.9.7: Assoziierte Entitäten lädt EF Core nicht von selbst. Eager Loading mit Include holt sie in derselben Abfrage (JOIN). Die Liste ist durch den Initialisierer new() leer, nicht null; man sieht den Fehler also nur an fehlenden Daten.", en: "20.9.7: EF Core does not load associated entities on its own. Eager loading with `Include` fetches them in the same query (JOIN). The list is empty—not null—due to the `new()` initializer; therefore, the error is only apparent because of the missing data." }
