id: efcore-beziehungen
title: { de: "Beziehungen: Include, Kaskade und Fluent API" }
reading:
  section: "20.5.11"
  title: { de: "Master-Details - Beziehung" }
  printedPage: 1429
teaches:
  - ef.relation-one-to-many
  - ef.include
  - ef.cascade-delete
  - ef.fluent-config
requires:
  - ef.entity-class
  - ef.dbcontext-define
