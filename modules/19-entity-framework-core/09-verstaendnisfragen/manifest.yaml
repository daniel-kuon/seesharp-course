id: efcore-verstaendnisfragen
title: { de: "Verständnisfragen", en: "Comprehension questions" }
reading:
  section: "20"
  title: { de: "Entity Framework Core", en: "Entity Framework Core" }
  printedPage: 1399
teaches:
  - ef.change-tracking-state
  - ef.include
  - ef.concurrency-token
  - ef.transactions
requires:
  - ef.entity-class
  - ef.dbcontext-define
  - ef.dbcontext-lifetime
  - ef.add-savechanges
  - ef.query-where-tolist
  - ef.find-firstordefault
  - ef.update-tracked
  - ef.remove
  - ef.relation-one-to-many
