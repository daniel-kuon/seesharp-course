id: wpf-layouts-nachbauen
title: { de: "Zusatz: Layouts nachbauen", en: "Extra: Recreating Layouts" }
optional: true
reading:
  section: "12.11"
  title: { de: "Layoutcontainer", en: "Layout Container" }
  printedPage: 804
teaches:
  - xaml.layout-containers
  - xaml.controls
requires:
  - wpf.project-structure
items:
  - type: review
    id: anmeldung
    prompt: { de: "Baue das Anmeldefenster aus der Aufgabenstellung (Skizze 1) in einem WPF-Projekt nach: Grid mit Beschriftungsspalte (Auto) und Eingabespalte (*), StackPanel für die Schaltflächen, keine festen Pixelpositionen. Zeige der Betreuung das Fenster in kleiner und in großer Fassung.", en: "Recreate the login window from the exercise text (sketch 1) in a WPF project: a Grid with a label column (Auto) and an input column (*), a StackPanel for the buttons, no fixed pixel positions. Show the supervisor the window in a small and in a large version." }
  - type: review
    id: mail
    prompt: { de: "Baue das Mail-Fenster mit drei Bereichen (Skizze 2) nach: DockPanel für Menüleiste und Statuszeile, ein Grid mit drei Spalten (Ordnerliste, Nachrichtenliste, Lesebereich; verstellbare Trenner mit GridSplitter sind ein freiwilliger Deep Dive), WrapPanel für die Schnellfilter. Erkläre, wann du StackPanel, DockPanel und Grid gewählt hast und warum kein Canvas.", en: "Recreate the mail window with three sections (Sketch 2): a DockPanel for the menu bar and status bar, a three-column Grid (folder list, message list, reading pane; adjustable dividers with GridSplitter are an optional Deep Dive), and a WrapPanel for the quick filters. Explain when you chose StackPanel, DockPanel, and Grid, and why you didn’t use Canvas." }
