id: netz-tcp-sockets
title: { de: "TCP-Server und -Klient im Loopback", en: "TCP Server and Client in Loopback Mode" }
reading:
  section: "21.6.1"
  title: { de: "TCP-Server", en: "TCP Server" }
  printedPage: 1526
teaches:
  - net.tcp-listener
  - net.tcp-client
  - net.line-protocol
requires:
  - files.streamwriter
  - files.streamreader-lines
  - resources.using-statement
  - exceptions.try-catch
  - strings.methods
  - types.int
items:
  - type: coding
    id: rechenserver
    openFile: "Rechenserver/RechenServer.cs"
    openLine: 1
    testProject: "Rechenserver Tests/Rechenserver.Tests.csproj"
  - type: multipleChoice
    id: autoflush
    prompt: { de: "Der Server schreibt seine Antwort mit schreiber.WriteLine(antwort), aber AutoFlush ist nicht eingeschaltet. Der Klient wartet ewig auf die Antwort. Warum?", en: "The server writes its response with `schreiber.WriteLine(antwort)`, but `AutoFlush` is not switched on. The client waits forever for the response. Why?" }
    options:
      - { de: "Der StreamWriter puffert die Daten; sie gehen erst bei Flush() (oder Dispose) wirklich auf das Netz. Mit AutoFlush = true wird nach jedem Schreiben geleert.", en: "StreamWriter buffers the data; it is not actually sent to the network until Flush() (or Dispose) is called. If AutoFlush = true, the buffer is flushed after every write operation." }
      - { de: "WriteLine sendet nur, wenn der Klient vorher ENDE gesendet hat.", en: "`WriteLine` only sends if the client has sent `ENDE` beforehand." }
      - { de: "Der NetworkStream kann nur in eine Richtung benutzt werden.", en: "The NetworkStream can only be used in one direction." }
    correct: [0]
    explanation: { de: "21.6.1 (Seite 1526 bis 1530): StreamWriter und NetworkStream arbeiten wie bei Dateien (Level 15). Bei einem Dialog über das Netz muss jede Antwort sofort hinausgehen, sonst warten beide Seiten aufeinander.", en: "21.6.1 (pages 1526–1530): StreamWriter and NetworkStream work the same way as with files (Level 15). In a network dialogue, each response must be sent immediately; otherwise, both sides will end up waiting for each other." }
  - type: multipleChoice
    id: readline-null
    prompt: { de: "Wann liefert StreamReader.ReadLine() auf einem NetworkStream den Wert null?", en: "When does StreamReader.ReadLine() return null on a NetworkStream?" }
    options:
      - { de: "Wenn die Gegenseite die Verbindung geschlossen hat und alle Daten gelesen sind (Ende des Datenstroms). Solange die Verbindung offen ist und nichts ankommt, blockiert ReadLine dagegen.", en: "When the other end has closed the connection and all data has been read (end of the data stream). However, as long as the connection is open and no data is coming in, `ReadLine` will block." }
      - { de: "Wenn gerade keine Zeile da ist; ReadLine kehrt dann sofort mit null zurück.", en: "If there is no line at the moment, `ReadLine` returns `null` immediately." }
      - { de: "Wenn der Klient eine leere Zeile sendet.", en: "When the client sends a blank line." }
    correct: [0]
    explanation: { de: "21.6.2 (Seite 1530). Eine leere Zeile ist eine Zeichenkette der Länge 0, nicht null. Ein Server prüft deshalb auf null, um getrennte Klienten zu erkennen.", en: "21.6.2 (page 1530). An empty line is a string of length 0, not null. A server therefore checks for null to identify disconnected clients." }
  - type: multipleChoice
    id: port-null
    prompt: { de: "Der Zeitserver im Buch legt seinen Listener so an: new TcpListener(IPAddress.IPv6Any, 55555) und danach listener.Server.DualMode = true. Was bewirkt das?", en: "The time server in the book creates its listener like this: `new TcpListener(IPAddress.IPv6Any, 55555)` followed by `listener.Server.DualMode = true`. What does that do?" }
    options:
      - { de: "Der Server lauscht auf Port 55555 über alle IPv6-Adressen des Rechners; mit DualMode = true ist er zusätzlich über die IPv4-Adresse erreichbar (Dual-Stack-Server). Lauschen beginnt erst mit Start().", en: "The server listens on port 55555 on all IPv6 addresses of the computer; with DualMode = true it can also be reached via the IPv4 address (dual-stack server). Listening only begins with Start()." }
      - { de: "Der Server lauscht nur auf der lokalen Schleife, und zwar auf Port 80; 55555 ist die Zahl der erlaubten Klienten.", en: "The server listens only on the local loopback, on port 80; 55555 is the number of clients allowed." }
      - { de: "Der Aufruf verbindet sich als Klient mit einem Server auf Port 55555.", en: "The call connects as a client to a server on port 55555." }
    correct: [0]
    explanation: { de: "21.6.1 (Seite 1526 und 1527). IPv6Any ist die universelle Adresse ::, der zweite Parameter ist der Port. Die Tests dieser Aufgabe nehmen stattdessen 127.0.0.1 und Port 0 (das Betriebssystem teilt einen freien Port zu), damit kein Konflikt mit anderen Programmen entsteht und der Server von außen nicht erreichbar ist.", en: "21.6.1 (pages 1526 and 1527). IPv6Any is the universal address ::, the second parameter is the port. The tests of this exercise use 127.0.0.1 and port 0 instead (the operating system assigns a free port), so that there is no conflict with other programs and the server cannot be reached from outside." }
