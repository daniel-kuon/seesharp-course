id: netz-mehrere-klienten-und-browser
title: { de: "Mehrere Klienten und WebView2", en: "Multiple Clients and WebView2" }
reading:
  section: "21.6.3"
  title: { de: "Simultane Bedienung von mehreren Klienten", en: "Simultaneous Service of Multiple Clients" }
  printedPage: 1531
teaches:
  - net.multi-client
  - net.webview2
requires:
  - net.tcp-listener
  - net.tcp-client
  - net.line-protocol
items:
  - type: review
    id: mehrere-klienten
    prompt: { de: "Erweitere den Server aus Aufgabe 4 so, dass zwei Klienten gleichzeitig verbunden sein können: eine Annahmeschleife ruft AcceptTcpClient() wiederholt auf und übergibt jeden Klienten an eine eigene Task, die ihn zeilenweise bedient. Starte den Server in einem Terminal und zwei Klienten (zum Beispiel zwei Konsolenprogramme mit Klient.Frage oder ein einfacher Telnet-/netcat-Aufruf) in zwei weiteren Terminals; beide müssen gleichzeitig Antworten bekommen. Zeige das der Betreuung und erkläre, wie du den Server sauber beendest.", en: "Extend the server from Exercise 4 so that two clients can be connected at the same time: an accept loop repeatedly calls `AcceptTcpClient()` and hands each client to its own task, which serves it line by line. Start the server in one terminal and two clients (for example, two console programs with `Klient.Frage` or a simple Telnet/netcat call) in two more terminals; both must receive answers at the same time. Show this to the supervisor and explain how you shut the server down cleanly." }
  - type: open
    id: warum-blockiert
    prompt: { de: "Warum blockiert der sequenzielle Server aus Aufgabe 4 den zweiten Klienten, solange der erste verbunden ist? Was begrenzt bei der Lösung mit einer Task je Klient die Zahl der Klienten, die gleichzeitig bedient werden können?", en: "Why does the sequential server from Exercise 4 block the second client as long as the first one is connected? In the solution with one task per client, what limits the number of clients that can be served simultaneously?" }
  - type: review
    id: webview2
    prompt: { de: "Nur Windows: Lege in Rider eine kleine WPF-Anwendung mit einem WebView2-Steuerelement an (NuGet-Paket Microsoft.Web.WebView2, Abschnitt 21.4.2), die die lokale Adresse einer laufenden Seite anzeigt (zum Beispiel eine kleine Testseite, die du mit HttpListener oder einem Dateiserver bereitstellst). Die Betreuung prüft die Projektdatei (Zieltyp net10.0-windows, Paketverweis) und das laufende Fenster.", en: "Windows only: Create a small WPF application in Rider with a WebView2 control (NuGet package Microsoft.Web.WebView2, Section 21.4.2) that displays the local address of a running page (for example, a small test page that you host using HttpListener or a file server). The supervisor checks the project file (target type net10.0-windows, package reference) and the running window." }
