id: aspnet-integrationstests-und-routing
title: { de: "Seiten, Routing und Integrationstests", en: "Pages, Routing, and Integration Tests" }
reading:
  section: "22.7"
  title: { de: "Routing", en: "Routing" }
  printedPage: 1577
teaches:
  - web.program-cs
  - web.di-register
  - web.routing-parameters
  - web.razor-syntax
  - web.integration-test
requires:
  - web.pagemodel-onget
  - web.pagemodel-onpost
  - web.di-inject
  - web.validation-attributes
  - web.redirect-to-page
  - linq.where
  - collections.dictionary-add-lookup
items:
  - type: coding
    id: seiten
    openFile: "Umfrage/Program.cs"
    openLine: 1
    testProject: "Umfrage Tests/Umfrage.Tests.csproj"
  - type: multipleChoice
    id: routenrestriktion
    prompt: { de: "Eine Seite beginnt mit `@page \"{id:int}\"`. Was antwortet die Anwendung auf `GET /Detail/abc`?", en: "A page begins with `@page \"{id:int}\"`. What does the application return in response to a `GET /Detail/abc` request?" }
    options:
      - { de: "404: Der Text passt nicht zur Restriktion int, die URL wird keiner Seite zugeordnet und OnGet läuft gar nicht erst.", en: "404: The text does not match the \"int\" restriction; the URL is not associated with any page, and OnGet does not run at all." }
      - { de: "200: OnGet(int id) bekommt 0 und zeigt eine leere Seite.", en: "200: OnGet(int id) receives 0 and displays a blank page." }
      - { de: "500: Die Umwandlung von abc nach int wirft eine Ausnahme.", en: "500: The conversion from abc to int throws an exception." }
    correct: [0]
    explanation: { de: "22.7.2.4 (Seite 1581): Eine Typrestriktion verhindert die Abbildung der URL auf die Seite; es wird keine Behandlungsmethode aufgerufen.", en: "22.7.2.4 (page 1581): A type restriction prevents the URL from being mapped to the page; no handler is called." }
  - type: multipleChoice
    id: singleton
    prompt: { de: "Statt im Dienst würde `UmfrageModel` die Stimmen in einem eigenen Feld `List<Stimme> _stimmen` sammeln. Was passiert?", en: "Instead of in the service, `UmfrageModel` would collect the votes in a field of its own, `List<Stimme> _stimmen`. What happens?" }
    options:
      - { de: "Bei der nächsten Anforderung sind die Stimmen weg: Das PageModel entsteht bei jeder Anforderung neu, sein Feld beginnt wieder leer.", en: "At the next request the votes are gone: the PageModel is created anew for every request, and its field starts empty again." }
      - { de: "Nichts; das PageModel bleibt erhalten, solange die Anwendung läuft.", en: "Nothing; the PageModel is kept as long as the application runs." }
      - { de: "Die Stimmen bleiben erhalten, aber jeder Browser sieht nur seine eigenen.", en: "The votes are kept, but every browser sees only its own." }
    correct: [0]
    explanation: { de: "22.5.4 (Seite 1571): Page- und PageModel-Objekte leben nur eine Anforderung lang (HTTP ist zustandslos). Zustand über Anforderungen hinweg braucht einen langlebigen Dienst, eine Datenbank oder Cookies; deshalb liegt der Speicher im Singleton-Dienst.", en: "22.5.4 (page 1571): Page and PageModel objects live for a single request only (HTTP is stateless). State across requests needs a long-lived service, a database or cookies; that is why the store lives in the singleton service." }
