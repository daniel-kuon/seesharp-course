id: aspnet-umfrage-oberflaeche
title: { de: "Die Umfrage-Oberfläche mit Layout und Tag-Helfern", en: "The survey interface, including layout and tag helpers" }
reading:
  section: "22.6"
  title: { de: "Tag-Helfer", en: "Tag Helper" }
  printedPage: 1572
teaches:
  - web.tag-helpers-form
  - web.layout
requires:
  - web.razor-syntax
  - web.validation-attributes
  - web.program-cs
items:
  - type: review
    id: formular
    prompt: { de: "Baue das Umfrageformular in Pages/Umfrage.cshtml aus: Die Partei wählt man in einem <select> (asp-for und asp-items mit Model.ParteiAuswahl, dazu eine Leeroption), jedes Feld hat ein <label asp-for>, ein <span asp-validation-for> und die Seite einen asp-validation-summary. Binde die Skripte für die Klienten-Validierung ein (22.9.3). Zeige der Betreuung, was der Browser bei einem leeren Formular tut, und danach, was passiert, wenn man die Skripte entfernt.", en: "Complete the survey form in `Pages/Umfrage.cshtml`: The party is chosen in a `<select>` (`asp-for` and `asp-items` with `Model.ParteiAuswahl`, plus an empty option), every field has a `<label asp-for>` and a `<span asp-validation-for>`, and the page has an `asp-validation-summary`. Include the scripts for client-side validation (22.9.3). Show the supervisor what the browser does with an empty form, and then what happens when the scripts are removed." }
    openFile: "Umfrage/Pages/Umfrage.cshtml"
  - type: review
    id: layout
    prompt: { de: "Lege ein gemeinsames Layout an (Pages/Shared/_Layout.cshtml mit Navigation und @RenderBody, Pages/_ViewStart.cshtml), verschiebe die Ergebnistabelle in eine partielle Ansicht (_Ergebnisse.cshtml, eingebunden mit <partial>) und binde ein Stylesheet aus wwwroot/css ein (Program.cs braucht dafür UseStaticFiles). Lege drei Screenshots in den Ordner Umfrage/screenshots ab: das leere Formular, das Formular mit Fehlermeldungen (Klienten-Validierung ausgeschaltet oder umgangen, damit die Meldung vom Server kommt) und die Ergebnisseite.", en: "Create a shared layout (Pages/Shared/_Layout.cshtml with navigation and @RenderBody, Pages/_ViewStart.cshtml), move the results table to a partial view (_Results.cshtml, included with <partial>), and include a stylesheet from wwwroot/css (Program.cs requires UseStaticFiles for this). Place three screenshots in the Umfrage/screenshots folder: the empty form, the form with error messages (client-side validation disabled or bypassed so that the message comes from the server), and the results page." }
    openFile: "Umfrage/Program.cs"
  - type: open
    id: texte-und-logik
    prompt: { de: "Wo stehen in deiner Lösung die Beschriftungen und Texte (22.11.1), und warum steht in den .cshtml-Dateien keine Geschäftslogik? Was passiert mit den eingegebenen Werten, wenn der Server das Formular wegen eines Fehlers erneut anzeigt, und welcher Tag-Helfer sorgt dafür (22.11.2)?", en: "Where are the labels and text located in your solution (11/22/1), and why is there no business logic in the .cshtml files? What happens to the entered values when the server redisplays the form due to an error, and which tag helper handles this (22.11.2)?" }
