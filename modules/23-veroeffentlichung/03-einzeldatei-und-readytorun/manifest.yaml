id: publish-einzeldatei-und-readytorun
title: { de: "Einzeldatei und ReadyToRun" }
reading:
  section: "23.1.6"
  title: { de: "Zusammenfassung in einer einzelnen Datei" }
  printedPage: 1646
teaches:
  - publish.single-file
  - publish.readytorun
requires:
  - publish.self-contained
  - publish.runtime-identifier
  - publish.dotnet-publish
  - publish.output-contents
items:
  - type: review
    id: drei-varianten
    prompt: { de: "Veröffentliche dasselbe Konsolenprogramm dreimal, jeweils in einen eigenen Ordner (`-o`): (1) frameworkabhängig: `dotnet publish -c Release -o pub-fd`; (2) eigenständig als Einzeldatei: `dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o pub-single`; (3) wie (2) mit ReadyToRun: `dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=true -o pub-r2r`. Starte jede Variante einmal. Zeige der Betreuung die drei Ordner und die Starts." }
  - type: open
    id: tabelle
    prompt: { de: "Trage für jede der drei Varianten die Anzahl der Dateien und die Gesamtgröße des Ordners in eine kleine Tabelle ein (Markdown oder CSV; kopiere sie hierher). Erkläre dann in zwei Sätzen die Unterschiede zwischen den Varianten bei Größe, Startzeit und Übertragbarkeit auf andere Rechner." }
