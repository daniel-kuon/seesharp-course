id: publish-webanwendung
title: { de: "Webanwendung veröffentlichen und hosten", en: "Publish and Host a Web Application" }
reading:
  section: "23.2.3"
  title: { de: "Webanwendung mit ASP.NET Core Razor Pages", en: "Web Application Using ASP.NET Core Razor Pages" }
  printedPage: 1658
teaches:
  - publish.web-local-install
  - publish.web-hosting
  - publish.reverse-proxy
requires:
  - publish.framework-dependent
  - publish.self-contained
  - publish.dotnet-publish
items:
  - type: multipleChoice
    id: kestrel
    prompt: { de: "Welcher Webserver führt eine ASP.NET-Core-Anwendung aus, die du aus dem Veröffentlichungsordner startest?", en: "Which web server runs an ASP.NET Core application that you start from the publish folder?" }
    options:
      - { de: "Kestrel, der in ASP.NET Core eingebaute Webserver; ein separat installierter Webserver ist dafür nicht nötig.", en: "Kestrel, the web server built into ASP.NET Core; no separately installed web server is needed." }
      - { de: "Immer IIS; ohne IIS lässt sich eine ASP.NET-Core-Anwendung nicht starten.", en: "Always IIS; without IIS, an ASP.NET Core application cannot be started." }
      - { de: "Der Browser; die Anwendung läuft im Browser des Benutzers.", en: "The browser; the application runs in the user's browser." }
    correct: [0]
    explanation: { de: "23.2.3.1 (Seite 1661): Ein Doppelklick auf die exe startet die Anwendung mit Kestrel; das Konsolenfenster zeigt Port 5000. Der Browser ist nur der Klient. Deep Dive (nicht im Buch): IIS kann eine ASP.NET-Core-Anwendung auch selbst hosten, im selben Prozess (in-process) oder als Reverse Proxy vor einem eigenen Kestrel-Prozess (out-of-process).", en: "23.2.3.1 (page 1661): Double-clicking the exe starts the application with Kestrel; the console window shows port 5000. The browser is only the client. Deep Dive (not in the book): IIS can also host an ASP.NET Core application itself, in the same process (in-process) or as a reverse proxy in front of its own Kestrel process (out-of-process)." }
  - type: multipleChoice
    id: reverse-proxy
    prompt: { de: "Was macht ein Reverse Proxy (IIS, Nginx, Apache), der vor Kestrel steht?", en: "What does a reverse proxy (IIS, Nginx, Apache) placed in front of Kestrel do?" }
    options:
      - { de: "Er empfängt die HTTP(S)-Anforderungen aus dem Internet und leitet sie an Kestrel weiter.", en: "It receives the HTTP(S) requests from the Internet and forwards them to Kestrel." }
      - { de: "Er übersetzt die Anforderungen in ein eigenes Format, weil Kestrel kein HTTP versteht.", en: "It translates the requests into its own format because Kestrel does not understand HTTP." }
      - { de: "Er führt den C#-Code der Anwendung aus; Kestrel wird dann nicht mehr gebraucht.", en: "It executes the application's C# code; Kestrel is then no longer needed." }
    correct: [0]
    explanation: { de: "23.2.3.3 (Seite 1662): Kestrel kann eigenständig oder zusammen mit einem Reverse Proxy arbeiten; der Proxy empfängt HTTP(S)-Anforderungen aus dem Internet und leitet sie an Kestrel weiter. Deep Dive (nicht im Buch): Der Proxy übernimmt oft die TLS-Verschlüsselung samt Zertifikat und verteilt mehrere Anwendungen hinter Port 443.", en: "23.2.3.3 (page 1662): Kestrel can work on its own or together with a reverse proxy; the proxy receives HTTP(S) requests from the Internet and forwards them to Kestrel. Deep Dive (not in the book): the proxy often handles TLS encryption including the certificate and distributes several applications behind port 443." }
  - type: multipleChoice
    id: launchsettings
    prompt: { de: "Im Entwicklungsordner hört die Anwendung nach `dotnet run` auf `http://localhost:5194`. Aus dem Veröffentlichungsordner gestartet, antwortet dieser Port nicht; die Konsole nennt Port 5000. Warum?", en: "In the development folder, the application listens on `http://localhost:5194` after `dotnet run`. Started from the publish folder, this port does not respond; the console shows port 5000. Why?" }
    options:
      - { de: "Die Ports stehen in `launchSettings.json`, und die Datei fehlt im Veröffentlichungsordner; ohne Einstellung benutzt Kestrel den Standardport 5000 (nur HTTP).", en: "The ports are specified in `launchSettings.json`, and the file is missing from the publish folder; without this setting, Kestrel uses the default port 5000 (HTTP only)." }
      - { de: "Die Veröffentlichung hat die Portnummer zufällig neu gewürfelt.", en: "Publishing randomly reassigned the port number." }
      - { de: "Release-Anwendungen dürfen nur Ports unter 1024 benutzen.", en: "Release applications may only use ports below 1024." }
    correct: [0]
    explanation: { de: "23.2.3.1 (Seite 1661): `launchSettings.json` gilt nur für Starts aus der Entwicklungsumgebung. Es gibt andere Wege, den Port 5000 zu ändern; die Aufgabe benutzt die Kommandozeilenoption `--urls` (nicht im Buch, hier vorgegeben). Deep Dive: auch die Umgebungsvariable `ASPNETCORE_URLS` setzt die Adressen.", en: "23.2.3.1 (page 1661): `launchSettings.json` applies only to launches from the development environment. There are other ways to change port 5000; the exercise uses the command-line option `--urls` (not in the book, given here). Deep Dive: the environment variable `ASPNETCORE_URLS` also sets the addresses." }
  - type: multipleChoice
    id: umgebung-veroeffentlicht
    prompt: { de: "Im Projekt setzt `launchSettings.json` die Umgebungsvariable `ASPNETCORE_ENVIRONMENT` auf `Development`, und `Program.cs` enthält `if (!app.Environment.IsDevelopment()) { app.UseExceptionHandler(\"/Error\"); ... }` (22.2.2). Was gilt, wenn du die Anwendung aus dem Veröffentlichungsordner startest?", en: "In the project, `launchSettings.json` sets the environment variable `ASPNETCORE_ENVIRONMENT` to `Development`, and `Program.cs` contains `if (!app.Environment.IsDevelopment()) { app.UseExceptionHandler(\"/Error\"); ... }` (22.2.2). What applies when you start the application from the publish folder?" }
    options:
      - { de: "`launchSettings.json` fehlt im Veröffentlichungsordner, also ist die Umgebung nicht `Development`: Der `if`-Zweig läuft, und `UseExceptionHandler(\"/Error\")` ist aktiv.", en: "`launchSettings.json` is missing from the publish folder, so the environment is not `Development`: the `if` branch runs, and `UseExceptionHandler(\"/Error\")` is active." }
      - { de: "Die Umgebung bleibt `Development`, weil die Veröffentlichung die Einstellungen aus `launchSettings.json` in die `.dll` übernimmt.", en: "The environment stays `Development` because publishing copies the settings from `launchSettings.json` into the `.dll`." }
      - { de: "Die Anwendung startet nicht, weil `launchSettings.json` fehlt.", en: "The application does not start because `launchSettings.json` is missing." }
    correct: [0]
    explanation: { de: "22.2.2 (Seite 1553) und 23.2.3.1 (Seite 1661): `launchSettings.json` gilt nur für Starts aus der Entwicklungsumgebung und fehlt im `publish`-Ordner. Ohne diese Einstellung ist die Umgebung nicht `Development`; die Konsole meldet `Hosting environment: Production`. Deep Dive (nicht im Buch): Mit der Umgebungsvariable `ASPNETCORE_ENVIRONMENT` setzt man die Umgebung auch außerhalb der Entwicklungsumgebung.", en: "22.2.2 (page 1553) and 23.2.3.1 (page 1661): `launchSettings.json` only applies to starts from the development environment and is missing from the `publish` folder. Without this setting, the environment is not `Development`; the console reports `Hosting environment: Production`. Deep Dive (not in the book): the environment variable `ASPNETCORE_ENVIRONMENT` sets the environment outside the development environment as well." }
  - type: review
    id: webapp-veroeffentlichen
    prompt: { de: "Lege mit `dotnet new webapp -o MeineWeb` eine Razor-Webanwendung an, veröffentliche sie mit `dotnet publish -c Release` und starte sie aus dem Veröffentlichungsordner mit `dotnet MeineWeb.dll --urls http://localhost:5123` (wähle einen freien Port). Rufe die Seite im Browser auf. Zeige der Betreuung einen Screenshot der laufenden Seite und die Konsolenausgabe des Servers mit der Zeile, die den Port nennt.", en: "Create a Razor web application with `dotnet new webapp -o MeineWeb`, publish it with `dotnet publish -c Release`, and start it from the publish folder with `dotnet MeineWeb.dll --urls http://localhost:5123` (choose a free port). Open the page in the browser. Show the supervisor a screenshot of the running page and the server's console output with the line that names the port." }
