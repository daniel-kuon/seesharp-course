id: publish-quiz-2
title: { de: "Zusatz: Veröffentlichungs-Quiz 2" }
optional: true
reading:
  section: "23.1.4"
  title: { de: "Zielruntime" }
  printedPage: 1643
teaches:
  - publish.configuration-release
  - publish.runtime-identifier
  - publish.readytorun
requires:
  - publish.self-contained
items:
  - type: multipleChoice
    id: linux-server
    prompt: { de: "Ein Linux-Server (x64) hat keine .NET-Laufzeit, und du willst eine einzige Datei ausliefern. Welches Kommando passt?" }
    options:
      - { de: "`dotnet publish -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true`" }
      - { de: "`dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true`" }
      - { de: "`dotnet publish -c Debug` und die `.exe` kopieren" }
    correct: [0]
    explanation: { de: "Der RID richtet sich nach dem Zielrechner (23.1.4, Seite 1643); eigenständig, weil keine Laufzeit vorhanden ist; Einzeldatei laut 23.1.6." }
  - type: multipleChoice
    id: windows-kiosk
    prompt: { de: "Ein Windows-Kiosk-PC (64 Bit) ist vom Netz getrennt und hat keine .NET-Laufzeit. Welche Veröffentlichung läuft dort ohne Installation?" }
    options:
      - { de: "Eigenständig mit `-r win-x64`." }
      - { de: "Frameworkabhängig mit `-r win-x64`; die Laufzeit ist im Windows enthalten." }
      - { de: "Jede Veröffentlichung, weil Windows alle .NET-Programme starten kann." }
    correct: [0]
    explanation: { de: "23.1.5 (Seite 1645): Nur die eigenständige Veröffentlichung bringt die Laufzeit mit und setzt nichts auf dem Einsatzrechner voraus." }
  - type: multipleChoice
    id: schnell-startendes-werkzeug
    prompt: { de: "Ein Kommandozeilenwerkzeug wird oft gestartet und läuft nur kurz; die Startzeit stört. Welche Option hilft, und was ist der Preis?" }
    options:
      - { de: "ReadyToRun (`-p:PublishReadyToRun=true`): Der IL-Code ist vorübersetzt, der Start schneller. Preis: größere Dateien, und das Ergebnis ist an die Zielruntime gebunden." }
      - { de: "Die Konfiguration Debug: Sie startet schneller, weil sie nicht optimiert." }
      - { de: "`PublishSingleFile`: Es verkürzt immer die Startzeit auf null." }
    correct: [0]
    explanation: { de: "23.1.7 (Seite 1648) und 23.2.2 (Seite 1652): R2R ist eine AOT-Übersetzung für eine bestimmte Zielruntime und deshalb nicht portabel." }
  - type: multipleChoice
    id: falscher-rid
    prompt: { de: "Du veröffentlichst eigenständig mit `-r win-x64` und kopierst die Datei auf einen Linux-Rechner. Was passiert?" }
    options:
      - { de: "Sie lässt sich nicht starten: Die mitgelieferte Laufzeit und der Starter gehören zu Windows. Für Linux musst du mit `-r linux-x64` (oder `linux-arm64`) neu veröffentlichen." }
      - { de: "Sie läuft, weil der IL-Code portabel ist; nur das Fenster sieht anders aus." }
      - { de: "Linux wählt beim Start automatisch den passenden RID." }
    correct: [0]
    explanation: { de: "23.1.4 (Seite 1643 und 1644) und 23.2.2 (Seite 1652 und 1657): Die Zielruntime bestimmt Betriebssystem und CPU-Architektur; für jede Zielruntime wird einzeln veröffentlicht." }
  - type: multipleChoice
    id: kleinster-download
    prompt: { de: "Alle Kunden haben die .NET-10-Laufzeit installiert. Du willst die kleinste Auslieferung. Was wählst du?" }
    options:
      - { de: "Frameworkabhängig: unter 140 KB im Beispiel des Buchs (Starter, dll, Konfigurationsdateien)." }
      - { de: "Eigenständig mit Einzeldatei: Die Laufzeit ist dann nicht mehr nötig, also ist die Datei kleiner." }
      - { de: "ReadyToRun: Vorübersetzter Code ist immer kleiner als IL." }
    correct: [0]
    explanation: { de: "23.1.5 (Seite 1645 und 1646): Frameworkabhängige Auslieferungen sind etwa tausendmal kleiner als eigenständige. R2R vergrößert die Dateien." }
  - type: multipleChoice
    id: alte-laufzeit
    prompt: { de: "Dein Projekt zielt auf `net10.0`. Auf dem Rechner des Kunden ist nur .NET 8 installiert. Was passiert bei der frameworkabhängigen Veröffentlichung, und was löst das Problem?" }
    options:
      - { de: "Der Start scheitert mit dem Hinweis auf die fehlende Laufzeit. Lösung: .NET 10 installieren oder eigenständig veröffentlichen." }
      - { de: "Das Programm läuft mit .NET 8 weiter; ältere Laufzeiten sind aufwärtskompatibel." }
      - { de: "Es läuft, nur langsamer." }
    correct: [0]
    explanation: { de: "23.1.2 (Seite 1638): Das Zielframework legt die mindestens erforderliche .NET-Version fest; eine neuere Laufzeit ist unproblematisch, eine ältere nicht (23.1.3, Seite 1642 zeigt die Fehlermeldung bei fehlender Laufzeit)." }
  - type: multipleChoice
    id: debug-ausgeliefert
    prompt: { de: "Ein Kollege liefert die Debug-Ausgabe (`bin/Debug`) an Kunden aus. Was ist daran nachteilig?" }
    options:
      - { de: "Der Compiler hat nicht optimiert (zum Beispiel kein Inlining); das Programm ist langsamer als nötig. Ausgeliefert wird die Release-Konfiguration." }
      - { de: "Debug-Ausgaben laufen nur auf dem Entwicklungsrechner." }
      - { de: "Debug enthält den Quelltext im Klartext." }
    correct: [0]
    explanation: { de: "23.1.1 (Seite 1637): Wegen der besseren Performanz sollte bei einer Veröffentlichung die Release-Übersetzung zum Einsatz kommen. Ein Debug-Assembly enthält aber keinen Quelltext, nur Debug-Hilfen in der pdb-Datei." }
  - type: multipleChoice
    id: r2r-woanders
    prompt: { de: "Eine ReadyToRun-Einzeldatei wurde mit `-r linux-x64` gebaut. Läuft sie auf einem Mac mit Apple-Prozessor (`osx-arm64`)?" }
    options:
      - { de: "Nein: Sie enthält Maschinencode und eine Laufzeit für genau eine Zielruntime. Für den Mac wird mit `-r osx-arm64` neu veröffentlicht." }
      - { de: "Ja: Der IL-Code ist enthalten, also läuft sie überall." }
      - { de: "Ja, wenn die Datei in .app umbenannt wird." }
    correct: [0]
    explanation: { de: "23.2.2 (Seite 1652 bis 1658): Eine R2R-Anwendung ist nicht portabel, die Veröffentlichung für mehrere Zielruntimes ist aber ohne großen Aufwand möglich." }
  - type: multipleChoice
    id: wpf-trimmen
    prompt: { de: "Du veröffentlichst eine WPF-Anwendung eigenständig mit `-p:PublishTrimmed=true`. Was meldet das Kommando?" }
    options:
      - { de: "Fehler NETSDK1168: WPF wird bei aktiviertem Kürzen nicht unterstützt. Ohne `PublishTrimmed` klappt die Veröffentlichung." }
      - { de: "Es klappt; die Datei wird besonders klein." }
      - { de: "Es klappt, aber die Anwendung startet nur unter Linux." }
    correct: [0]
    explanation: { de: "23.1.6 (Seite 1648). WPF ist an Windows gebunden; deshalb lautet das Zielframework `net10.0-windows` (23.1.2)." }
  - type: multipleChoice
    id: dateien-ausliefern
    prompt: { de: "Welche Dateien gehören bei der frameworkabhängigen Veröffentlichung eines Programms namens `Rechner` mindestens zur Auslieferung?" }
    options:
      - { de: "`Rechner.exe`, `Rechner.dll`, `Rechner.runtimeconfig.json` und `Rechner.deps.json`; die `Rechner.pdb` ist verzichtbar." }
      - { de: "Nur die `Rechner.pdb`, weil sie den Code enthält." }
      - { de: "Nur die `Rechner.exe`; sie enthält alles." }
    correct: [0]
    explanation: { de: "23.1.5 (Seite 1645) und 23.2.2 (Seite 1656): Die dll enthält den IL-Code, die exe ist der Starter, die json-Dateien beschreiben die benötigte Laufzeit und die Abhängigkeiten; die pdb enthält Debug-Hilfen." }
