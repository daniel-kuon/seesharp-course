# SeeSharp skill vocabulary — levels 0–6 (draft for review, task 3a).
#
# Rules (SKILL-MODEL.md §1):
# - ids are English, namespaced (category.name), lowercase, permanent. Never rename;
#   retire by adding a new id with `aliases: [old-id]`.
# - a skill must be teachable (some exercise lists it in `teaches`) and observable
#   (a unit test or quiz item could fail if the trainee lacked it).
# - labels are translated, ids are not. `de` is required, `en` optional.
# - optional `supersedes: <id>` marks a finer skill that replaces a coarser one.
#
# The level a skill belongs to is NOT stored here: it is derived from the exercises
# that teach it. The level comments below only document the drafting order.

skills:

